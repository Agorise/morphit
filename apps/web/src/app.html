<!doctype html>
<html lang="en" dir="ltr" class="dark">
	<head>
		<meta charset="utf-8" />
		<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
		<meta name="color-scheme" content="dark" />
		<meta name="theme-color" content="#00DA69" />

		<meta name="referrer" content="no-referrer" />

		<link rel="icon" type="image/svg+xml" href="%sveltekit.assets%/favicon.svg" />
		<link rel="apple-touch-icon" href="%sveltekit.assets%/apple-touch-icon.png" />
		<!-- crossorigin="use-credentials": the browser fetches the manifest
		     WITHOUT credentials by default, so during beta the HTTP Basic Auth
		     gate 401s it (visible as a console error). Sending credentials makes
		     the manifest fetch carry the auth → 200; harmless at the stable
		     release (Morphit sets no cookies). cp305. -->
		<link
			rel="manifest"
			href="%sveltekit.assets%/manifest.webmanifest"
			crossorigin="use-credentials"
		/>

		<!-- v1.8.0 (t.txt): iOS PWA launch screens. Full-screen splash images —
		     the Morphit WORDMARK (with gradient) centred on the dark #0a0e16
		     background — shown during app startup only. iOS picks the image whose
		     media query matches the device; without these it shows a blank screen
		     (and there is no way to remove the app-name text from Android's
		     Chrome-generated splash, which is why this is iOS-only). Portrait
		     set covers current + recent iPhones and iPads. -->
		<link rel="apple-touch-startup-image" media="(device-width: 375px) and (device-height: 667px) and (-webkit-device-pixel-ratio: 2) and (orientation: portrait)" href="%sveltekit.assets%/splash/splash-iphone-se.png" />
		<link rel="apple-touch-startup-image" media="(device-width: 414px) and (device-height: 736px) and (-webkit-device-pixel-ratio: 3) and (orientation: portrait)" href="%sveltekit.assets%/splash/splash-iphone-8plus.png" />
		<link rel="apple-touch-startup-image" media="(device-width: 375px) and (device-height: 812px) and (-webkit-device-pixel-ratio: 3) and (orientation: portrait)" href="%sveltekit.assets%/splash/splash-iphone-x.png" />
		<link rel="apple-touch-startup-image" media="(device-width: 414px) and (device-height: 896px) and (-webkit-device-pixel-ratio: 2) and (orientation: portrait)" href="%sveltekit.assets%/splash/splash-iphone-xr.png" />
		<link rel="apple-touch-startup-image" media="(device-width: 414px) and (device-height: 896px) and (-webkit-device-pixel-ratio: 3) and (orientation: portrait)" href="%sveltekit.assets%/splash/splash-iphone-xsmax.png" />
		<link rel="apple-touch-startup-image" media="(device-width: 390px) and (device-height: 844px) and (-webkit-device-pixel-ratio: 3) and (orientation: portrait)" href="%sveltekit.assets%/splash/splash-iphone-12.png" />
		<link rel="apple-touch-startup-image" media="(device-width: 430px) and (device-height: 932px) and (-webkit-device-pixel-ratio: 3) and (orientation: portrait)" href="%sveltekit.assets%/splash/splash-iphone-14promax.png" />
		<link rel="apple-touch-startup-image" media="(device-width: 428px) and (device-height: 926px) and (-webkit-device-pixel-ratio: 3) and (orientation: portrait)" href="%sveltekit.assets%/splash/splash-iphone-12promax.png" />
		<link rel="apple-touch-startup-image" media="(device-width: 393px) and (device-height: 852px) and (-webkit-device-pixel-ratio: 3) and (orientation: portrait)" href="%sveltekit.assets%/splash/splash-iphone-14pro.png" />
		<link rel="apple-touch-startup-image" media="(device-width: 402px) and (device-height: 874px) and (-webkit-device-pixel-ratio: 3) and (orientation: portrait)" href="%sveltekit.assets%/splash/splash-iphone-16pro.png" />
		<link rel="apple-touch-startup-image" media="(device-width: 440px) and (device-height: 956px) and (-webkit-device-pixel-ratio: 3) and (orientation: portrait)" href="%sveltekit.assets%/splash/splash-iphone-16promax.png" />
		<link rel="apple-touch-startup-image" media="(device-width: 768px) and (device-height: 1024px) and (-webkit-device-pixel-ratio: 2) and (orientation: portrait)" href="%sveltekit.assets%/splash/splash-ipad-mini.png" />
		<link rel="apple-touch-startup-image" media="(device-width: 810px) and (device-height: 1080px) and (-webkit-device-pixel-ratio: 2) and (orientation: portrait)" href="%sveltekit.assets%/splash/splash-ipad-10.png" />
		<link rel="apple-touch-startup-image" media="(device-width: 834px) and (device-height: 1112px) and (-webkit-device-pixel-ratio: 2) and (orientation: portrait)" href="%sveltekit.assets%/splash/splash-ipad-air.png" />
		<link rel="apple-touch-startup-image" media="(device-width: 834px) and (device-height: 1194px) and (-webkit-device-pixel-ratio: 2) and (orientation: portrait)" href="%sveltekit.assets%/splash/splash-ipad-pro11.png" />
		<link rel="apple-touch-startup-image" media="(device-width: 1024px) and (device-height: 1366px) and (-webkit-device-pixel-ratio: 2) and (orientation: portrait)" href="%sveltekit.assets%/splash/splash-ipad-pro12.png" />

		<meta name="apple-mobile-web-app-capable" content="yes" />
		<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
		<meta name="apple-mobile-web-app-title" content="Morphit" />
		<meta name="mobile-web-app-capable" content="yes" />

		<link
			rel="preload"
			href="%sveltekit.assets%/fonts/comfortaa-latin-400.woff2"
			as="font"
			type="font/woff2"
			crossorigin="anonymous"
		/>
		<link
			rel="preload"
			href="%sveltekit.assets%/fonts/comfortaa-latin-700.woff2"
			as="font"
			type="font/woff2"
			crossorigin="anonymous"
		/>

		<script>
			(function () {
				try {
					var q = new URLSearchParams(window.location.search);
					var code = q.get('lang');
					if (!code) return;
					var allowed = ['en', 'es', 'de', 'pl', 'fr', 'it', 'ru', 'fa', 'zh-CN', 'zh-HK'];
					if (allowed.indexOf(code) === -1) return;
					document.documentElement.lang = code;
					document.documentElement.dir = code === 'fa' ? 'rtl' : 'ltr';
				} catch (_e) {}
			})();
		</script>

		<!--
			DEFAULT social-share metadata (v1.8.0, t.txt: "pasted a morphit link into
			Element and it generated a horrible preview — logo cut off, wrong title").

			Why this is here and not only in Head.svelte: the site ships with
			`fallback: 'index.html'` (svelte.config.js), so any URL that isn't one of
			the prerendered `/<lang>/…` routes — a bare `/chat`, a dynamic
			`/<lang>/chat/<peer>`, or a link a user pastes WITHOUT the locale prefix —
			is served the SPA shell, whose `%sveltekit.head%` is empty until JS
			hydrates. A link-preview scraper never runs that JS, so with no OG tags it
			fell back to scraping the visible <noscript> <h1> ("Morphit works without
			JavaScript — partly.") as the title and the favicon as the image (cropped
			to the preview's thumbnail). These static tags give every such URL a
			correct default card instead.

			On a prerendered route Head.svelte re-emits og:*/twitter:* into
			`%sveltekit.head%` BELOW these, and link-preview parsers use the LAST value
			for a scalar property, so the route-specific title/description/url win
			there — these only take effect when `%sveltekit.head%` contributed none
			(the fallback case). Deliberately NO static <title>: browsers honour the
			FIRST <title>, so a static one would override every route's tab title;
			og:title (last-wins) is what scrapers read anyway. Absolute morphit.io URLs
			match Head.svelte's hardcoded CANONICAL_ORIGIN.
		-->
		<meta property="og:type" content="website" />
		<meta property="og:site_name" content="Morphit" />
		<meta property="og:title" content="Morphit — No-KYC P2P Marketplace to Buy &amp; Sell Monero, Bitcoin &amp; More" />
		<meta property="og:description" content="The private, no-KYC way to buy and sell Monero, Bitcoin and more, peer-to-peer with real people — non-custodial, no account, no email, no tracking." />
		<meta property="og:url" content="https://morphit.io/" />
		<meta property="og:image" content="https://morphit.io/og-image.png" />
		<meta property="og:image:type" content="image/png" />
		<meta property="og:image:width" content="1200" />
		<meta property="og:image:height" content="630" />
		<meta property="og:image:alt" content="Morphit — privacy-first P2P marketplace for Monero, Bitcoin and more" />
		<meta name="twitter:card" content="summary_large_image" />
		<meta name="twitter:title" content="Morphit — No-KYC P2P Marketplace to Buy &amp; Sell Monero, Bitcoin &amp; More" />
		<meta name="twitter:description" content="The private, no-KYC way to buy and sell Monero, Bitcoin and more, peer-to-peer with real people — non-custodial, no account, no email, no tracking." />
		<meta name="twitter:image" content="https://morphit.io/og-image.png" />

		%sveltekit.head%
	</head>
	<body data-sveltekit-preload-data="hover" class="bg-ink-950 text-ink-100 antialiased">
		<noscript>
			<div
				style="
					max-width: 640px;
					margin: 48px auto;
					padding: 24px;
					border-radius: 16px;
					background: linear-gradient(135deg, rgba(142, 239, 38, 0.12), rgba(2, 166, 178, 0.12));
					font-family: system-ui, sans-serif;
					line-height: 1.6;
				"
			>
				<h1 style="margin-top: 0; font-size: 22px">Morphit works without JavaScript — partly.</h1>
				<p>You can browse orders, profiles, and feedback with JavaScript off. That is by design.</p>
				<p>
					<strong>Trading</strong> (creating orders, chatting, signing feedback) needs JavaScript,
					because all cryptography happens inside your browser. Morphit never sees your keys. If JS
					ran on our servers instead, we'd have to hold them — and we refuse to.
				</p>
				<p>Turn on JS only when you're ready to trade. Browsing is safe without it.</p>
			</div>
		</noscript>

		<div id="svelte" style="display: contents">%sveltekit.body%</div>
	</body>
</html>
