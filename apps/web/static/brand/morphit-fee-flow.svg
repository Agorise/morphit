<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 1180" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif">
  <!--
    Morphit fees & rewards — where the money flows.

    Dark-mode diagram for the public blog.
    Brand colors: morphit-emerald #00DA69 (money in / rewards),
                  red #DC2626 (money out / fees),
                  deep navy #0B1220 background,
                  ink-200 #D9DFE7 primary text on dark.

    All amounts are operator-tunable defaults sourced from:
      apps/indexer/src/config/index.ts (MORPHIT_INDEXER_FEE_BASE_BLURT = 60)
      apps/indexer/src/indexer/strangerFeePricing.ts (STRANGER_FEE_BASE_BLURT = 5)
      apps/indexer/src/indexer/operatorEarnings.ts (OPERATOR_BLURT_SPLIT_PERCENT = 90)
      apps/indexer/src/indexer/handlers/feedback.ts (welcome bonus 10 liquid + 10 vesting BP)
      apps/indexer/src/indexer/handlers/featureBid.ts (50 BLURT/hour, MIN_HOURS = 6)
      apps/relay/src/blurt/client.ts (account_create; ~100 BLURT fee paid inline)
    BLURT/USD reference: ~$0.002/BLURT (project default static floor).
  -->

  <defs>
    <marker id="arrow-red" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#DC2626"/>
    </marker>
    <marker id="arrow-green" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#00DA69"/>
    </marker>
    <marker id="arrow-neutral" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#8A96A8"/>
    </marker>
    <marker id="arrow-purple" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#A78BFA"/>
    </marker>
  </defs>

  <!-- Dark navy background — Morphit dark mode -->
  <rect width="1600" height="1180" fill="#0B1220"/>

  <!-- Title -->
  <text x="800" y="50" text-anchor="middle" font-size="34" font-weight="700" fill="#F7F8FA">Morphit fees &amp; rewards</text>
  <text x="800" y="82" text-anchor="middle" font-size="18" font-weight="500" fill="#00DA69">where the money flows</text>
  <text x="800" y="112" text-anchor="middle" font-size="14" fill="#8A96A8">All amounts are operator-tunable defaults. USD figures use BLURT &#8776; $0.002 as a rough peg.</text>

  <!-- ═══ Column 1: USERS (left) ═══ -->
  <text x="140" y="160" text-anchor="middle" font-size="20" font-weight="700" fill="#DC2626">Money out</text>
  <text x="140" y="184" text-anchor="middle" font-size="13" fill="#8A96A8">(what users pay)</text>
  <line x1="40" y1="198" x2="240" y2="198" stroke="#DC2626" stroke-width="2"/>

  <g>
    <rect x="40" y="220" width="200" height="78" rx="10" fill="#1A202B" stroke="#DC2626" stroke-width="2"/>
    <text x="140" y="252" text-anchor="middle" font-size="16" font-weight="600" fill="#F7F8FA">Buyer</text>
    <text x="140" y="278" text-anchor="middle" font-size="13" fill="#D9DFE7">posts a buy order</text>
  </g>

  <g>
    <rect x="40" y="320" width="200" height="78" rx="10" fill="#1A202B" stroke="#DC2626" stroke-width="2"/>
    <text x="140" y="352" text-anchor="middle" font-size="16" font-weight="600" fill="#F7F8FA">Seller</text>
    <text x="140" y="378" text-anchor="middle" font-size="13" fill="#D9DFE7">posts a sell order</text>
  </g>

  <g>
    <rect x="40" y="420" width="200" height="78" rx="10" fill="#1A202B" stroke="#DC2626" stroke-width="2"/>
    <text x="140" y="452" text-anchor="middle" font-size="16" font-weight="600" fill="#F7F8FA">First-time messager</text>
    <text x="140" y="478" text-anchor="middle" font-size="13" fill="#D9DFE7">DMing a stranger</text>
  </g>

  <g>
    <rect x="40" y="520" width="200" height="78" rx="10" fill="#1A202B" stroke="#DC2626" stroke-width="2"/>
    <text x="140" y="552" text-anchor="middle" font-size="16" font-weight="600" fill="#F7F8FA">Featured bidder</text>
    <text x="140" y="578" text-anchor="middle" font-size="13" fill="#D9DFE7">wants top placement</text>
  </g>

  <g>
    <rect x="40" y="620" width="200" height="78" rx="10" fill="#1A202B" stroke="#DC2626" stroke-width="2"/>
    <text x="140" y="652" text-anchor="middle" font-size="16" font-weight="600" fill="#F7F8FA">New signup</text>
    <text x="140" y="678" text-anchor="middle" font-size="13" fill="#D9DFE7">creates an account</text>
  </g>

  <!-- ═══ Column 2: FEE TYPES (middle-left) ═══ -->
  <text x="560" y="160" text-anchor="middle" font-size="20" font-weight="700" fill="#DC2626">Fee they pay</text>
  <text x="560" y="184" text-anchor="middle" font-size="13" fill="#8A96A8">(one-time, per action)</text>
  <line x1="420" y1="198" x2="700" y2="198" stroke="#DC2626" stroke-width="2"/>

  <g>
    <rect x="420" y="220" width="280" height="180" rx="10" fill="#1A202B" stroke="#DC2626" stroke-width="2"/>
    <text x="560" y="252" text-anchor="middle" font-size="17" font-weight="700" fill="#F7F8FA">Listing fee</text>
    <text x="560" y="278" text-anchor="middle" font-size="15" font-weight="600" fill="#00DA69">60 BLURT  &#8776; $0.12</text>
    <text x="560" y="304" text-anchor="middle" font-size="12" fill="#B8C2D0">(one fee per posted order)</text>
    <line x1="440" y1="318" x2="680" y2="318" stroke="#3E4A5C" stroke-dasharray="3 3"/>
    <text x="560" y="338" text-anchor="middle" font-size="12" fill="#D9DFE7">Posting 4+ orders in 24h?</text>
    <text x="560" y="356" text-anchor="middle" font-size="12" fill="#D9DFE7">4th = 1x &#183; 5th = 2x &#183; 6th = 4x &#183; 7th+ = 8x</text>
    <text x="560" y="382" text-anchor="middle" font-size="12" fill="#B8C2D0">First buy: free (one-time waiver)</text>
  </g>

  <g>
    <rect x="420" y="420" width="280" height="78" rx="10" fill="#1A202B" stroke="#DC2626" stroke-width="2"/>
    <text x="560" y="452" text-anchor="middle" font-size="16" font-weight="700" fill="#F7F8FA">Cold-message fee</text>
    <text x="560" y="478" text-anchor="middle" font-size="14" font-weight="600" fill="#00DA69">5 BLURT  &#8776; $0.01</text>
  </g>

  <g>
    <rect x="420" y="520" width="280" height="78" rx="10" fill="#1A202B" stroke="#DC2626" stroke-width="2"/>
    <text x="560" y="552" text-anchor="middle" font-size="16" font-weight="700" fill="#F7F8FA">Featured-slot bid</text>
    <text x="560" y="578" text-anchor="middle" font-size="13" fill="#D9DFE7">&#8805; 50 BLURT/hour &#183; 6 hour minimum</text>
  </g>

  <g>
    <rect x="420" y="620" width="280" height="78" rx="10" fill="#1A202B" stroke="#8A96A8" stroke-width="2" stroke-dasharray="5 3"/>
    <text x="560" y="652" text-anchor="middle" font-size="16" font-weight="700" fill="#F7F8FA">Signup is free to the user</text>
    <text x="560" y="678" text-anchor="middle" font-size="12" fill="#B8C2D0">(operator pays the chain ~100 BLURT)</text>
  </g>

  <!-- Arrows: users -> fees (red, money flowing OUT) -->
  <line x1="240" y1="259" x2="418" y2="270" stroke="#DC2626" stroke-width="2.5" marker-end="url(#arrow-red)"/>
  <line x1="240" y1="359" x2="418" y2="320" stroke="#DC2626" stroke-width="2.5" marker-end="url(#arrow-red)"/>
  <line x1="240" y1="459" x2="418" y2="459" stroke="#DC2626" stroke-width="2.5" marker-end="url(#arrow-red)"/>
  <line x1="240" y1="559" x2="418" y2="559" stroke="#DC2626" stroke-width="2.5" marker-end="url(#arrow-red)"/>
  <line x1="240" y1="659" x2="418" y2="659" stroke="#8A96A8" stroke-width="2.5" stroke-dasharray="5 3" marker-end="url(#arrow-neutral)"/>

  <!-- ═══ Column 3: WHERE FEES LAND (middle-right) ═══ -->
  <text x="1020" y="160" text-anchor="middle" font-size="20" font-weight="700" fill="#D9DFE7">Where the fee lands</text>
  <text x="1020" y="184" text-anchor="middle" font-size="13" fill="#8A96A8">(operator + treasury)</text>
  <line x1="880" y1="198" x2="1160" y2="198" stroke="#8A96A8" stroke-width="2"/>

  <g>
    <rect x="880" y="220" width="280" height="180" rx="10" fill="#1A202B" stroke="#8A96A8" stroke-width="2"/>
    <text x="1020" y="248" text-anchor="middle" font-size="15" font-weight="700" fill="#F7F8FA">When paid in BLURT</text>
    <line x1="900" y1="262" x2="1140" y2="262" stroke="#3E4A5C" stroke-dasharray="3 3"/>
    <text x="1020" y="288" text-anchor="middle" font-size="14" fill="#D9DFE7">90% &#8594; Operator's own account</text>
    <text x="1020" y="308" text-anchor="middle" font-size="11" fill="#B8C2D0">(@morphit-relay by default)</text>
    <text x="1020" y="338" text-anchor="middle" font-size="14" fill="#D9DFE7">10% &#8594; Project treasury</text>
    <text x="1020" y="358" text-anchor="middle" font-size="11" fill="#B8C2D0">(@morphit-fees)</text>
    <text x="1020" y="386" text-anchor="middle" font-size="11" fill="#8A96A8" font-style="italic">paid per order, ~10 sec after broadcast</text>
  </g>

  <g>
    <rect x="880" y="420" width="280" height="78" rx="10" fill="#1A202B" stroke="#8A96A8" stroke-width="2"/>
    <text x="1020" y="450" text-anchor="middle" font-size="15" font-weight="700" fill="#F7F8FA">When paid in BTC or XMR</text>
    <text x="1020" y="476" text-anchor="middle" font-size="13" fill="#D9DFE7">100% &#8594; Project treasury</text>
  </g>

  <g>
    <rect x="880" y="520" width="280" height="78" rx="10" fill="#1A202B" stroke="#8A96A8" stroke-width="2"/>
    <text x="1020" y="550" text-anchor="middle" font-size="15" font-weight="700" fill="#F7F8FA">Cold-message + featured bid</text>
    <text x="1020" y="576" text-anchor="middle" font-size="13" fill="#D9DFE7">100% &#8594; Operator</text>
  </g>

  <g>
    <rect x="880" y="620" width="280" height="78" rx="10" fill="#1A202B" stroke="#8A96A8" stroke-width="2" stroke-dasharray="5 3"/>
    <text x="1020" y="650" text-anchor="middle" font-size="15" font-weight="700" fill="#F7F8FA">Operator's cost, not a fee</text>
    <text x="1020" y="676" text-anchor="middle" font-size="11" fill="#B8C2D0">~100 BLURT/account, paid inline at signup</text>
  </g>

  <!-- Arrows: fees -> recipients (neutral, money "landing") -->
  <line x1="700" y1="310" x2="878" y2="310" stroke="#8A96A8" stroke-width="2.5" marker-end="url(#arrow-neutral)"/>
  <line x1="700" y1="459" x2="878" y2="459" stroke="#8A96A8" stroke-width="2.5" marker-end="url(#arrow-neutral)"/>
  <line x1="700" y1="559" x2="878" y2="559" stroke="#8A96A8" stroke-width="2.5" marker-end="url(#arrow-neutral)"/>
  <line x1="700" y1="659" x2="878" y2="659" stroke="#8A96A8" stroke-width="2.5" stroke-dasharray="5 3" marker-end="url(#arrow-neutral)"/>

  <!-- ═══ Column 4: REWARDS IN (right) ═══ -->
  <text x="1440" y="160" text-anchor="middle" font-size="20" font-weight="700" fill="#00DA69">Money in</text>
  <text x="1440" y="184" text-anchor="middle" font-size="13" fill="#8A96A8">(what users receive)</text>
  <line x1="1320" y1="198" x2="1560" y2="198" stroke="#00DA69" stroke-width="2"/>

  <g>
    <rect x="1320" y="220" width="240" height="140" rx="10" fill="#1A202B" stroke="#00DA69" stroke-width="2"/>
    <text x="1440" y="252" text-anchor="middle" font-size="17" font-weight="700" fill="#F7F8FA">Welcome bonus</text>
    <text x="1440" y="280" text-anchor="middle" font-size="15" font-weight="600" fill="#00DA69">20 BLURT</text>
    <text x="1440" y="302" text-anchor="middle" font-size="13" fill="#D9DFE7">10 liquid + 10 Power (BP)</text>
    <text x="1440" y="326" text-anchor="middle" font-size="12" fill="#B8C2D0">paid after your first trade</text>
    <text x="1440" y="346" text-anchor="middle" font-size="12" fill="#B8C2D0">(when you leave feedback)</text>
  </g>

  <g>
    <rect x="1320" y="380" width="240" height="200" rx="10" fill="#1A202B" stroke="#00DA69" stroke-width="2"/>
    <text x="1440" y="412" text-anchor="middle" font-size="17" font-weight="700" fill="#F7F8FA">Loyalty milestones</text>
    <text x="1440" y="434" text-anchor="middle" font-size="13" fill="#D9DFE7">As you keep trading:</text>
    <text x="1440" y="460" text-anchor="middle" font-size="13" fill="#D9DFE7">10 BLURT in fees &#8594; 10 BP</text>
    <text x="1440" y="480" text-anchor="middle" font-size="13" fill="#D9DFE7">50 BLURT in fees &#8594; 50 BP</text>
    <text x="1440" y="500" text-anchor="middle" font-size="13" fill="#D9DFE7">200 BLURT in fees &#8594; 200 BP</text>
    <text x="1440" y="520" text-anchor="middle" font-size="13" fill="#D9DFE7">1000 BLURT in fees &#8594; 1000 BP</text>
    <text x="1440" y="546" text-anchor="middle" font-size="14" font-weight="600" fill="#00DA69">total: 1,260 BP</text>
    <text x="1440" y="568" text-anchor="middle" font-size="11" fill="#B8C2D0">(funded from the fee pool)</text>
  </g>

  <g>
    <rect x="1320" y="600" width="240" height="98" rx="10" fill="#1A202B" stroke="#00DA69" stroke-width="2"/>
    <text x="1440" y="630" text-anchor="middle" font-size="16" font-weight="700" fill="#F7F8FA">Staking earns you more</text>
    <text x="1440" y="654" text-anchor="middle" font-size="13" fill="#D9DFE7">Your BP earns ~7% APR</text>
    <text x="1440" y="676" text-anchor="middle" font-size="12" fill="#B8C2D0">from Blurt chain inflation</text>
  </g>

  <!-- Arrows: fee pool -> rewards (green, money flowing IN to the user) -->
  <line x1="1160" y1="310" x2="1318" y2="290" stroke="#00DA69" stroke-width="2.5" marker-end="url(#arrow-green)"/>
  <line x1="1160" y1="310" x2="1318" y2="480" stroke="#00DA69" stroke-width="2.5" marker-end="url(#arrow-green)"/>

  <!-- ═══ DIVIDER ═══ -->
  <line x1="40" y1="780" x2="1560" y2="780" stroke="#3E4A5C" stroke-width="1" stroke-dasharray="6 4"/>

  <!-- ═══ BOTTOM: PEER-TO-PEER TRADE ═══ -->
  <text x="800" y="820" text-anchor="middle" font-size="22" font-weight="700" fill="#A78BFA">The actual trade — never touches Morphit</text>
  <text x="800" y="850" text-anchor="middle" font-size="14" fill="#8A96A8">Morphit is a bulletin board, not a bank. Buyer and seller settle directly.</text>

  <g>
    <rect x="120" y="890" width="260" height="140" rx="10" fill="#1A202B" stroke="#A78BFA" stroke-width="2"/>
    <text x="250" y="924" text-anchor="middle" font-size="17" font-weight="700" fill="#F7F8FA">Buyer's wallet</text>
    <text x="250" y="952" text-anchor="middle" font-size="13" fill="#D9DFE7">or bank account</text>
    <text x="250" y="980" text-anchor="middle" font-size="13" fill="#D9DFE7">cash, PayPal, Wise,</text>
    <text x="250" y="1000" text-anchor="middle" font-size="13" fill="#D9DFE7">bank transfer, etc.</text>
    <text x="250" y="1020" text-anchor="middle" font-size="11" font-style="italic" fill="#8A96A8">Morphit cannot see this</text>
  </g>

  <g>
    <rect x="1220" y="890" width="260" height="140" rx="10" fill="#1A202B" stroke="#A78BFA" stroke-width="2"/>
    <text x="1350" y="924" text-anchor="middle" font-size="17" font-weight="700" fill="#F7F8FA">Seller's wallet</text>
    <text x="1350" y="952" text-anchor="middle" font-size="13" fill="#D9DFE7">or bank account</text>
    <text x="1350" y="980" text-anchor="middle" font-size="13" fill="#D9DFE7">receives the fiat,</text>
    <text x="1350" y="1000" text-anchor="middle" font-size="13" fill="#D9DFE7">sends BTC/XMR/BLURT</text>
    <text x="1350" y="1020" text-anchor="middle" font-size="11" font-style="italic" fill="#8A96A8">Morphit cannot see this</text>
  </g>

  <g>
    <line x1="380" y1="960" x2="1220" y2="960" stroke="#A78BFA" stroke-width="3" marker-end="url(#arrow-purple)" marker-start="url(#arrow-purple)"/>
    <rect x="540" y="920" width="520" height="80" rx="10" fill="#0B1220" stroke="#A78BFA" stroke-width="1.5" stroke-dasharray="4 3"/>
    <text x="800" y="950" text-anchor="middle" font-size="16" font-weight="700" fill="#F7F8FA">Direct peer-to-peer settlement</text>
    <text x="800" y="976" text-anchor="middle" font-size="13" fill="#D9DFE7">Buyer pays seller in fiat &#8594; seller sends BTC, XMR, or BLURT to buyer</text>
    <text x="800" y="996" text-anchor="middle" font-size="11" font-style="italic" fill="#A78BFA">No escrow. No custody. No middleman.</text>
  </g>

  <!-- ═══ LEGEND ═══ -->
  <g>
    <rect x="40" y="1070" width="1520" height="90" rx="10" fill="#070A10" stroke="#3E4A5C" stroke-width="1"/>

    <text x="60" y="1098" font-size="14" font-weight="700" fill="#F7F8FA">Read the colors:</text>

    <circle cx="220" cy="1118" r="7" fill="#DC2626"/>
    <text x="236" y="1124" font-size="13" fill="#D9DFE7">Money out (you pay)</text>

    <circle cx="450" cy="1118" r="7" fill="#00DA69"/>
    <text x="466" y="1124" font-size="13" fill="#D9DFE7">Money in (you receive)</text>

    <circle cx="690" cy="1118" r="7" fill="#8A96A8"/>
    <text x="706" y="1124" font-size="13" fill="#D9DFE7">Where the fee lands</text>

    <circle cx="930" cy="1118" r="7" fill="#A78BFA"/>
    <text x="946" y="1124" font-size="13" fill="#D9DFE7">Peer-to-peer (Morphit never touches)</text>

    <text x="60" y="1148" font-size="12" font-style="italic" fill="#8A96A8">All amounts are operator-tunable defaults. Your instance's actual values may differ &#8212; see your operator's About page or `docs/FEES-AND-REWARDS.md` for the canonical source.</text>
  </g>
</svg>
