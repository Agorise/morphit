<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1024 1024" role="img" aria-label="Dash logo placeholder">
	<!--
		Morphit DASH placeholder logo (Part 122 cp27).

		Path-based stylized "D" inside a disc filled with Dash
		brand blue (#008CE7).  No <text> elements per
		ADDING-A-COIN.md font-fallback rule (Cyrillic/CJK font
		fallbacks made BCH/LTC text-based logos render
		inconsistently across operator deployments).

		Placeholder pending community-blessed artwork — REVISIT-LIST.md
		§E tracks the swap-in.  Same placeholder posture as
		icon-bch.svg (cp21) and icon-ltc.svg (cp24).

		Stylization: the "D" is rendered as a path with a small
		angular cut at the upper-right (to evoke the Dash
		official logo's two-tone diagonal) while remaining a
		single-color glyph (no Dash trademark mark, no logotype).
	-->
	<circle cx="512" cy="512" r="512" fill="#008CE7"/>
	<path
		d="M 290 280
		   L 540 280
		   C 700 280 820 380 820 512
		   C 820 644 700 744 540 744
		   L 290 744
		   L 290 624
		   L 540 624
		   C 620 624 680 580 680 512
		   C 680 444 620 400 540 400
		   L 410 400
		   L 410 744
		   L 290 744
		   Z"
		fill="#ffffff"
		fill-rule="evenodd"
	/>
</svg>
