<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" role="img" aria-label="Tron (TRC-20)">
	<title>Tron (TRC-20)</title>
	<!-- Tron's brand red.  The "T" inside a stylized triangle is the
	     canonical Tron mark; we use a simpler "T" in a roundel for
	     chip-scale legibility. -->
	<circle cx="12" cy="12" r="12" fill="#FF060A"/>
	<text x="12" y="16" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif" font-size="12" font-weight="700" fill="#FFFFFF">T</text>
</svg>
