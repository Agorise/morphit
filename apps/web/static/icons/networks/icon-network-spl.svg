<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" role="img" aria-label="Solana (SPL)">
	<title>Solana (SPL)</title>
	<!-- Solana's brand purple-magenta gradient is iconic.  Simplified
	     to a single color for chip-scale use. -->
	<defs>
		<linearGradient id="sol-grad" x1="0" y1="0" x2="24" y2="24" gradientUnits="userSpaceOnUse">
			<stop offset="0" stop-color="#9945FF"/>
			<stop offset="1" stop-color="#14F195"/>
		</linearGradient>
	</defs>
	<circle cx="12" cy="12" r="12" fill="url(#sol-grad)"/>
	<text x="12" y="16" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif" font-size="11" font-weight="700" fill="#FFFFFF">S</text>
</svg>
