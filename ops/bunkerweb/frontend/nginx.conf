# Morphit frontend nginx — serves the built SvelteKit static site and
# reverse-proxies the API paths to the relay + indexer running on the
# HOST.  Runs BEHIND BunkerWeb inside the bunkerweb_net Docker network,
# on plain :80.
#
# BunkerWeb (see ../docker-compose.yml + ../bunkerweb.env.example) is
# the public entry point: it terminates TLS, runs the OWASP-CRS WAF,
# rate-limits, sets the real client IP in X-Forwarded-For, and adds the
# security headers (HSTS/CSP/X-Frame-Options/...).  It then proxies
# EVERY path to this container (REVERSE_PROXY_HOST=http://frontend:80).
# So this config intentionally does none of that — no TLS, no security
# headers.  Its only jobs are static-file serving + path routing.
#
# This mirrors the routing in ops/nginx/web.conf (the bare-metal
# single-host vhost) MINUS the TLS + security-header blocks that
# BunkerWeb owns here.  Keep the two in sync when either changes.
#
# UPSTREAMS — host.docker.internal resolves to the host via
# `extra_hosts: ["host.docker.internal:host-gateway"]` in
# docker-compose.yml, so the relay + indexer stay on the host (NOT in a
# container).  Ports are the morphit defaults: relay 8080, indexer 8081
# (MORPHIT_RELAY_LISTEN_PORT / MORPHIT_INDEXER_LISTEN_PORT).  Change
# them here if you bind the services to non-default ports.
#
#   IMPORTANT — the relay + indexer must listen on an address the
#   Docker bridge can reach (NOT 127.0.0.1 only): bind them to the
#   host-gateway address or 0.0.0.0 and firewall those ports so only
#   the bridge can reach them (the UFW rules in
#   ops/ansible/roles/hardening do this).  A loopback-only bind is
#   unreachable from this container and the proxy_pass returns 502.
#
# REAL CLIENT IP (v1.18.0 deep-deep, H1) — this container is reached two ways:
#   1. from BunkerWeb (clearnet). BunkerWeb is the public edge and runs
#      USE_REAL_IP=no, so its $remote_addr is the real client, which it sends
#      to us as X-Real-IP (its reverse-proxy template always sets
#      `X-Real-IP $remote_addr`);
#   2. from Tor/I2P, via the port published on the host's 127.0.0.1, which
#      Docker delivers from the bridge gateway (172.20.0.1).
# The relay keys its per-IP signup limits on X-Forwarded-For, so we never
# pass along anything a visitor typed: for (1) we send BunkerWeb's X-Real-IP
# as the ONLY X-Forwarded-For entry; for (2) — and anything else — we send
# $remote_addr, so every Tor/I2P visitor shares one bucket, as before. (The
# old `$proxy_add_x_forwarded_for` kept the visitor's own X-Forwarded-For on
# the left, and the relay read the leftmost entry: a new address per request.)
# The relay's MORPHIT_RELAY_TRUSTED_PROXY_IPS must cover 172.20.0.0/16. If you
# change the Docker subnet, change it below too — a mismatch fails safe
# (everyone shares one bucket), it never lets a visitor pick their address.
geo $morphit_from_bunkerweb {
    default         0;
    172.20.0.0/16   1;
    172.20.0.1/32   0;  # the bridge gateway = Tor/I2P via the published port
}
map $morphit_from_bunkerweb $morphit_relay_xff {
    1       $http_x_real_ip;
    default $remote_addr;
}

server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # Tell browsers text responses are UTF-8. Without this, a plain-text
    # file like /canary.txt (which contains em-dashes, bullets, box-
    # drawing) is served with no charset, so browsers fall back to
    # windows-1252 and render mojibake (─ → "â”€", — → "â€”"). nginx's
    # default charset_types already covers text/plain, text/html, etc.,
    # so this one line fixes every text asset. (cp432)
    charset utf-8;

    # Keep idle connections for five minutes, and say so in a Keep-Alive
    # header (v1.18.0 review, S5). Every Tor and I2P visitor lands on this
    # server, and that includes other Morphit instances holding a warmed
    # connection open for fast chat: they refresh it every three minutes. With
    # nginx's default of 75 s the connection was always gone by then, so the
    # warm-up paid for a new tunnel each time — the cost it exists to remove.
    # Five minutes is past the warm-up, past the sender's own four-minute
    # idle limit (so the SENDER closes first, never this end mid-message),
    # and well inside Tor's ten-minute circuit idle.
    keepalive_timeout 300s 300s;

    # Serve the SvelteKit build's pre-compressed .gz siblings when the
    # client accepts gzip (zero CPU — the compression happened at build
    # time).  BunkerWeb still does the client-facing gzip/brotli at the
    # edge, so this only saves the frontend->BunkerWeb hop, but it's
    # free.  A plain `gzip on` covers proxied JSON responses too.
    gzip on;
    gzip_types text/plain text/css application/json application/javascript text/xml application/xml application/xml+rss text/javascript image/svg+xml;
    gzip_static on;

    # Never expose dotfiles / editor leftovers if one ever lands in the
    # build dir.  404 (not 403) gives no signal about whether the path
    # exists.  Mirrors ops/nginx/web.conf.
    location ~ /\.(?!well-known) {
        return 404;
    }
    location ~* \.(env|git|sql|bak|old|orig|swp|tmp)$ {
        return 404;
    }

    # ─── Relay — fund-spending endpoints ──────────────────────────
    # The frontend calls same-origin /relay/v1/* (e.g.
    # /relay/v1/account/create); strip the /relay prefix so the relay
    # process sees bare /v1/* (mirrors web.conf's
    # `rewrite ^/relay/(.*)$ /$1`).  The longer /relay/ prefix means
    # /relay/v1/* never falls into the /v1/ block below.
    location /relay/ {
        rewrite ^/relay/(.*)$ /$1 break;
        proxy_pass http://host.docker.internal:8080;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header Host $host;
        # See REAL CLIENT IP at the top: one entry, written by BunkerWeb or by
        # us, never by the visitor. X-Real-IP is cleared so nothing downstream
        # can mistake a visitor-typed value for ours. (v1.18.0 deep-deep, H1)
        proxy_set_header X-Forwarded-For $morphit_relay_xff;
        proxy_set_header X-Real-IP "";
        proxy_set_header X-Forwarded-Proto https;
        client_max_body_size 64k;
    }

    # ─── Broadcast write proxy (/v1/broadcast) — carries an avatar (base64
    #     image) + a signed tx, far larger than a read query. A LONGER prefix
    #     than /v1/, so nginx matches this first and it gets its own generous
    #     body cap while reads stay tight below (the maintainer/timeapp: the 4k /v1/ cap
    #     413'd every avatar upload at THIS proxy, before the indexer — whose
    #     own route-aware bodyCap is the real backstop — ever saw it). ────
    location /v1/broadcast {
        proxy_pass http://host.docker.internal:8081;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
        proxy_set_header X-Morphit-Local-Health "";
        client_max_body_size 128k;
    }

    # ─── Federation chat fast-path intake (/v1/federation/*) ──────
    #     A peer instance pushes a BATCH of signed chat transactions here,
    #     up to BATCH_MAX = 64. Batching is what makes per-peer throughput
    #     viable over a hidden transport, where one connection completes one
    #     round trip at a time. On the 4 KB read cap below, a batch of more
    #     than three messages is 413'd — and batches form precisely when a
    #     peer is already busy, so the fast path would work while idle and
    #     switch itself off under exactly the load it exists for. 256 KB
    #     matches MORPHIT_INDEXER_MAX_FEDERATION_BODY_BYTES; the sender keeps
    #     itself under 200 KB. Longer prefix than /v1/, so matched first. ──
    location /v1/federation {
        proxy_pass http://host.docker.internal:8081;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
        proxy_set_header X-Morphit-Local-Health "";
        client_max_body_size 256k;
    }

    # ─── Indexer — read-only public API (/v1/*), served as-is ─────
    location /v1/ {
        proxy_pass http://host.docker.internal:8081;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
        # Operator-only per-source price-feed health is gated on
        # X-Morphit-Local-Health (sent by the local ops-cli over the
        # bridge). Clear any client-supplied value so a public caller
        # can never forge it and read the per-source block.
        proxy_set_header X-Morphit-Local-Health "";
        client_max_body_size 4k;
    }

    # ─── SSE live-update streams (orderbook / chat / instances) ───
    # The indexer also sends `X-Accel-Buffering: no` on every stream,
    # which every nginx hop (this container + BunkerWeb) honors, so
    # events arrive live through both proxies.  This block is the
    # belt-and-suspenders version: buffering off + a long read timeout.
    # A regex location beats the /v1/ prefix, so .../stream paths land
    # here ahead of the plain /v1/ block above.
    location ~ ^/v1/.*/stream$ {
        proxy_pass http://host.docker.internal:8081;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
        proxy_buffering off;
        proxy_read_timeout 1h;
    }

    # ─── Indexer RSS/Atom orderbook feeds (/rss/*) ────────────────
    location /rss/ {
        proxy_pass http://host.docker.internal:8081;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
    }

    # ─── MCP — read-only AI-agent orderbook surface (/mcp) ────────
    # The host MCP runs the HTTP transport on port 8124.  It is NOT
    # virtual-hosted; it uses the Host header only for DNS-rebinding
    # defense, whose default allowlist includes the loopback form — so
    # present `Host: 127.0.0.1:8124` upstream (forwarding $host would be
    # rejected 403).  Responses can be long-running for federation
    # queries, hence the longer read timeout.
    location /mcp {
        proxy_pass http://host.docker.internal:8124;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header Host 127.0.0.1:8124;
        # One entry, the same one /relay/ gets (see REAL CLIENT IP at the top):
        # an appended header kept the visitor's own claim on the left
        # (v1.18.0 deep-deep).
        proxy_set_header X-Real-IP $morphit_relay_xff;
        proxy_set_header X-Forwarded-For $morphit_relay_xff;
        proxy_set_header X-Forwarded-Proto https;
        client_max_body_size 256k;
        proxy_read_timeout 120s;
    }

    # ─── IPFS gateway — serve THIS instance's pinned signed release ───
    # Lets a clearnet-censored node fetch a release over OUR .onion/.i2p
    # at /ipfs/<cid> (and /ipns/<name>) — no clearnet, no third-party
    # pinning service. The Kubo gateway runs on the host with
    # Gateway.NoFetch=true, so it serves ONLY content this node has
    # pinned (its own ~12 MB release) — never an arbitrary CID, so this
    # is NOT an open IPFS proxy.
    #   Reachable only when the operator sets morphit_ipfs_gateway_expose
    #   =true (roles/ipfs), which binds the gateway to the Docker bridge
    #   the SAME way the relay + indexer bind. When it is loopback-only
    #   (the default), host.docker.internal:8082 refuses the connection
    #   and proxy_intercept_errors turns the 502 into a clean 404 — so
    #   these blocks are inert, never a scary gateway error, on the
    #   default posture. Content addressing makes the release
    #   self-verifying, so no auth/headers are needed here.
    # Host MUST be an IP literal, not the visitor's hostname.
    #
    # `proxy_set_header Host $host` forwarded the CLIENT's hostname
    # (morphitir.com, or the .onion). A kubo gateway treats an unrecognised
    # DNS-style Host as a possible DNSLink domain; on a node with
    # Gateway.NoFetch=true it cannot resolve one, so the request HANGS rather
    # than erroring — nginx then times out and returns its stock 404. That is
    # what silently broke morphitir's clearnet /ipfs/ route while its Tor and
    # I2P paths (which reach nginx by another route) worked fine.
    #
    # An IP literal makes kubo use the plain PATH gateway. Deliberately NOT
    # `localhost`: kubo ships localhost as a SUBDOMAIN gateway, so it would
    # redirect /ipfs/<cid> to <cid>.ipfs.localhost and break the proxy.
    location /ipfs/ {
        proxy_pass http://host.docker.internal:8082;
        proxy_http_version 1.1;
        proxy_set_header Host 127.0.0.1;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_read_timeout 120s;
        proxy_intercept_errors on;
        error_page 502 503 504 = @ipfs_unavailable;
    }
    # Same reasoning as /ipfs/ above: an IP literal, never the client's Host.
    location /ipns/ {
        proxy_pass http://host.docker.internal:8082;
        proxy_http_version 1.1;
        proxy_set_header Host 127.0.0.1;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_read_timeout 120s;
        proxy_intercept_errors on;
        error_page 502 503 504 = @ipfs_unavailable;
    }
    location @ipfs_unavailable {
        return 404;
    }

    # ─── Update surface — never cache ─────────────────────────────
    # /service-worker.js drives update detection: the browser refetches it
    # on every update check (the app registers the worker with
    # updateViaCache:'none'), and a byte-changed worker is what raises the
    # in-app "Load it now" snackbar after a deploy.  verify.json carries
    # this build's version + asset-hash manifest, read by the app's
    # update-version poll and the "About this instance" auto-verify.  If
    # EITHER is served stale — e.g. from BunkerWeb's own edge cache, or any
    # CDN in front — the client never learns a new build is live and the
    # update prompt never appears.  (This is the "no update snackbar on
    # mobile OR PC" bug: ops/nginx/web.conf carried this no-cache block but
    # THIS file did not, and the two configs drifted out of sync.)  Mark
    # both no-cache so BunkerWeb and the browser always revalidate.  No
    # security headers here — BunkerWeb owns those at the edge; this server
    # block sets none to inherit, so the add_header reset footgun that
    # web.conf has to work around does not apply here.
    location = /service-worker.js {
        add_header Cache-Control "no-cache" always;
        try_files $uri =404;
    }
    location = /verify.json {
        add_header Cache-Control "no-cache" always;
        try_files $uri =404;
    }

    # ─── SvelteKit SPA fallback ───────────────────────────────────
    # Longest-prefix match means the proxy blocks above win for their
    # paths; every other request falls here and returns the SPA entry
    # so client-side routing handles the URL.
    #
    # The fallback goes through @spa (NOT a bare `/index.html` in this
    # try_files) so that if index.html is somehow absent, nginx returns a
    # clean 503 instead of rewriting `/index.html → /index.html` forever
    # (an infinite internal-redirect loop that 500s every request and once
    # took an operator's whole site down). The build guard should make a
    # missing index.html impossible; this is the belt-and-suspenders.
    location / {
        try_files $uri $uri.html $uri/index.html @spa;
    }
    location @spa {
        try_files /index.html =503;
    }
}
