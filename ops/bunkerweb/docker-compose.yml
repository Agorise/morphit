# Morphit — canonical BunkerWeb docker-compose.
# See ops/bunkerweb/README.md for usage.
#
# Three services:
#   bunkerweb            — public entry: TLS termination + WAF, proxies
#                          EVERY path to `frontend` (REVERSE_PROXY_HOST)
#   bunkerweb-scheduler  — config management agent
#   frontend             — plain nginx that serves the SvelteKit static
#                          build AND reverse-proxies /v1/, /relay/,
#                          /rss/ + SSE to the relay + indexer on the
#                          host (see frontend/nginx.conf)
#
# Topology:  client ──TLS──> bunkerweb ──> frontend ──> host relay/indexer
#
# Morphit relay + indexer run on the HOST (not in this compose),
# reachable from the `frontend` container via host.docker.internal
# (= this network's gateway, 172.20.0.1).  The relay/indexer must listen on
# an address the Docker bridge can reach (NOT 127.0.0.1 only) — see
# frontend/nginx.conf and OPERATIONS.md §32.

services:
  # One-shot permission init.  BunkerWeb's images do NOT set `user:`
  # here, so the instance + scheduler run as the image-default UID
  # (101).  Two things they must reach are created root-owned:
  #   (a) the `bw-data` named volume — the scheduler writes its config
  #       SQLite DB there; if it can't, it loops on "Database is not
  #       initialized" and never ships a config.
  #   (b) the Let's Encrypt cert — certbot writes it root-only inside a
  #       0700 archive dir, so a UID-101 process can't read the privkey
  #       and BunkerWeb silently serves a self-signed fallback.
  # This root one-shot fixes both, then exits, before anything else
  # starts (the scheduler depends_on it completing).  It runs on every
  # `compose up`, so it also re-asserts perms after a container
  # re-create.  It is idempotent and harmless on an already-correct
  # install (chowning to 101 is a no-op when the target is already 101,
  # and a no-op for a root-run process).  For cert RENEWAL the same fix
  # lives in the certbot deploy-hook (OPERATIONS.md §35); this covers
  # the first `up` and every re-create.
  bw-init:
    image: bunkerity/bunkerweb-scheduler:1.5.10
    container_name: bunkerweb-init
    user: "0:0"
    entrypoint: ["sh", "-c"]
    command:
      - >-
        chown -R 101:101 /data && chmod -R u+rwX /data;
        chgrp -R 101 /etc/letsencrypt/live /etc/letsencrypt/archive 2>/dev/null || true;
        chmod -R g+rX /etc/letsencrypt/live /etc/letsencrypt/archive 2>/dev/null || true
    restart: "no"
    volumes:
      - bw-data:/data
      # Mounted read-WRITE (not :ro) so this init can chgrp/chmod the
      # cert dirs; the long-running services below mount it :ro.
      - /etc/letsencrypt:/etc/letsencrypt
    networks:
      - bunkerweb_net

  bunkerweb:
    image: bunkerity/bunkerweb:1.5.10
    container_name: bunkerweb
    # PRIVACY (v1.20.0, C1): no Docker log for the public edge.  BunkerWeb's
    # access lines (before LOG_FORMAT in bunkerweb.env drops the address), its
    # error lines ("client: <address>"), its ban notices and ModSecurity's audit
    # entries all name visitors, and Docker keeps a container's log on disk with
    # no size limit.  To watch it live while you debug, with nothing stored:
    #   sudo docker attach --no-stdin --sig-proxy=false bunkerweb
    # (Ctrl-C detaches; the container keeps running.)
    # If CrowdSec (or anything else) reads this container's log through
    # Docker, `none` blinds it: use `driver: local` with options
    # max-size: "5m" and max-file: "1" instead, and keep LOG_FORMAT's
    # $remote_addr (morphit-ops upgrade does exactly that when it finds one).
    logging:
      driver: none
    restart: unless-stopped
    ports:
      - "80:8080"
      - "443:8443"
    env_file:
      - ./bunkerweb.env
    volumes:
      - bw-data:/data
      # Let's Encrypt certs from the host (per OPERATIONS.md §35).
      - /etc/letsencrypt:/etc/letsencrypt:ro
    extra_hosts:
      # So BunkerWeb can reach the host-resident relay + indexer.
      # host.docker.internal = THIS network's gateway (172.20.0.1, the first
      # address of the pinned subnet below), i.e. the host as seen from
      # bunkerweb_net.  `host-gateway` resolved to docker0 (172.17.0.1), a
      # different bridge that only worked because the host routes between
      # them, and does not exist at all when Docker runs without docker0.
      # (v1.20.0, B11)
      - "host.docker.internal:172.20.0.1"
    networks:
      - bunkerweb_net
    depends_on:
      - bunkerweb-scheduler

  bunkerweb-scheduler:
    image: bunkerity/bunkerweb-scheduler:1.5.10
    container_name: bunkerweb-scheduler
    restart: unless-stopped
    env_file:
      - ./bunkerweb.env
    volumes:
      - bw-data:/data
      # The scheduler (not just the instance) reads CUSTOM_SSL_CERT to
      # validate and ship the cert; without this mount it logs "not a valid
      # file" and the instance falls back to a self-signed cert.
      - /etc/letsencrypt:/etc/letsencrypt:ro
      # BunkerWeb 1.5's scheduler finds the instance through the Docker API
      # (the image's bunkerweb.INSTANCE label); without the socket it never
      # finds one and never pushes a config.  Read-only bind, as in the
      # Ansible template.
      - /var/run/docker.sock:/var/run/docker.sock:ro
      # Nothing from the internet: BunkerWeb's own GeoIP (db-ip.com), release
      # check (api.github.com) and Pro-plugin (assets.bunkerity.com) jobs run
      # whatever the settings, so the scheduler gets Morphit's job lists
      # instead. The GeoIP files come from the image (mmdb-local.py).  Adjust
      # the path if you cloned morphit somewhere other than /opt/morphit.
      - /opt/morphit/ops/bunkerweb/scheduler/jobs-plugin.json:/usr/share/bunkerweb/core/jobs/plugin.json:ro
      - /opt/morphit/ops/bunkerweb/scheduler/mmdb-local.py:/usr/share/bunkerweb/core/jobs/jobs/mmdb-local.py:ro
      - /opt/morphit/ops/bunkerweb/scheduler/pro-plugin.json:/usr/share/bunkerweb/core/pro/plugin.json:ro
    # The socket is root:docker mode 660 and the scheduler runs as UID 101, so
    # it needs the host's docker group.  Put the GID in /etc/bunkerweb/.env
    # (Compose reads that file):  echo "DOCKER_GID=$(getent group docker | cut -d: -f3)" | sudo tee /etc/bunkerweb/.env
    group_add:
      - "${DOCKER_GID:?set DOCKER_GID in /etc/bunkerweb/.env (getent group docker | cut -d: -f3)}"
    networks:
      - bunkerweb_net
    depends_on:
      # Wait for bw-init to fix bw-data + cert perms before the
      # scheduler tries to write its config DB / read the cert.  The
      # instance (bunkerweb) depends_on the scheduler, so it waits
      # transitively.
      bw-init:
        condition: service_completed_successfully

  # Serves the built SvelteKit site + reverse-proxies the API paths to
  # the relay + indexer on the host.  BunkerWeb proxies everything here
  # (REVERSE_PROXY_HOST=http://frontend:8088).  See frontend/nginx.conf.
  frontend:
    build:
      context: ./frontend
    container_name: morphit-frontend
    # No visitor address reaches this log (the frontend's access log is off
    # and its error lines name BunkerWeb or the bridge gateway), so keep it —
    # bounded, so it can never fill the disk.  (v1.20.0, C1)
    logging:
      driver: local
      options:
        max-size: "1m"
        max-file: "2"
    restart: unless-stopped
    # Published on a HOST LOOPBACK port so the Tor and I2P hidden services
    # reach the frontend directly (they cannot go through BunkerWeb, which
    # redirects http to https).  Loopback only: never reachable from outside.
    ports:
      - "127.0.0.1:8090:80"
    volumes:
      # The SvelteKit production build from the host, read-only.  Ship
      # new frontend bytes by rebuilding the web app (`npm run build`
      # in apps/web) — no need to rebuild this image.  Adjust the path
      # if you cloned morphit somewhere other than /opt/morphit.
      - /opt/morphit/apps/web/build:/usr/share/nginx/html:ro
      # nginx.conf from the host repo, read-only.  Bind-mounting it (in
      # addition to the COPY in the Dockerfile, which stays as a baked
      # fallback) means a shipped config change — e.g. the no-cache
      # blocks for /service-worker.js + /verify.json that drive the
      # update snackbar — deploys the SAME way a build change does: pull
      # the new source, then RESTART the container (which re-reads this
      # mount).  `morphit-ops upgrade` already `docker restart`s this
      # container, so config changes now ride along on a normal upgrade
      # with NO image rebuild.  Adjust the path if you cloned morphit
      # somewhere other than /opt/morphit.
      - /opt/morphit/ops/bunkerweb/frontend/nginx.conf:/etc/nginx/conf.d/morphit.conf:ro
    extra_hosts:
      # So the frontend nginx can reach the relay + indexer on the
      # host (see the host.docker.internal note on the bunkerweb service).
      - "host.docker.internal:172.20.0.1"
    networks:
      - bunkerweb_net
    healthcheck:
      # nginx:alpine ships busybox wget (no curl), so use wget.
      test: ["CMD-SHELL", "wget -q -O /dev/null http://127.0.0.1/ || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 3

volumes:
  bw-data:

networks:
  bunkerweb_net:
    name: bunkerweb_net
    driver: bridge
    ipam:
      config:
        # Pin the CIDR so the operator hard-codes it in
        # MORPHIT_RELAY_TRUSTED_PROXY_IPS without re-inspecting
        # after rebuilds.  See OPERATIONS.md §32 + the README in
        # this directory for the trusted-proxy CIDR rationale.
        # The gateway is not listed: Docker gives a pinned subnet's first
        # address (172.20.0.1) to the gateway by default, and adding a key
        # to an EXISTING network's config would make compose want to
        # recreate the network on installed boxes.  host.docker.internal
        # above relies on it being 172.20.0.1; `morphit-ops upgrade` reads
        # the real gateway before it relies on it.
        - subnet: 172.20.0.0/16
