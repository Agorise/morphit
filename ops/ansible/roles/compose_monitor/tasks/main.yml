# roles/compose_monitor/tasks/main.yml
#
# Deploy the morphit-compose-monitor sidecar.  Watches Docker
# Compose service health + restart loops.  Does NOT install
# docker — that's the bunkerweb role's job.
#
# Optional variables:
#   compose_restart_threshold     : default 5
#   compose_projects              : default /opt/morphit/ops/bunkerweb
#                                   (space-separated for multiple stacks)
#
# References: docs/OPERATIONS.md §16 "Extended monitoring sidecars".

---
- name: Assert docker is available (run bunkerweb role first if missing)
  ansible.builtin.command:
    cmd: docker compose version
  register: compose_monitor_docker_check
  changed_when: false
  failed_when: compose_monitor_docker_check.rc != 0

- name: Write compose-monitor env file (optional)
  ansible.builtin.template:
    src: compose-monitor.env.j2
    dest: /etc/morphit/compose-monitor.env
    owner: root
    group: root
    mode: '0644'
  when:
    - compose_restart_threshold is defined or compose_projects is defined
  notify: Restart morphit-compose-monitor-timer

- name: Install compose-monitor systemd service unit
  ansible.builtin.copy:
    src: /opt/morphit/ops/systemd/morphit-compose-monitor.service
    dest: /etc/systemd/system/morphit-compose-monitor.service
    owner: root
    group: root
    mode: '0644'
    remote_src: true
  notify: Reload systemd

- name: Install compose-monitor systemd timer
  ansible.builtin.copy:
    src: /opt/morphit/ops/systemd/morphit-compose-monitor.timer
    dest: /etc/systemd/system/morphit-compose-monitor.timer
    owner: root
    group: root
    mode: '0644'
    remote_src: true
  notify: Reload systemd

- name: Enable + start morphit-compose-monitor.timer
  ansible.builtin.systemd:
    name: morphit-compose-monitor.timer
    enabled: true
    state: started
    daemon_reload: true
