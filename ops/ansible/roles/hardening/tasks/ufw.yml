# §34 — UFW firewall.
---
# SSH: this run owns the SSH rules only when the firewall was off before it
# (or let everything in). When it was already on with its own SSH rules (an
# office IP, a VPN interface, SSH over Tor only), those are the operator's:
# adding a rule open to everyone widened them to the whole internet (review,
# 2026-10-12). And the rules go on the port(s) sshd really listens on, not a
# fixed 22: a server on 2222 was locked out by the firewall it just enabled.
- name: Read the firewall state and the SSH port(s) before this run changes them
  ansible.builtin.shell: |
    set -o pipefail
    active=no
    if LC_ALL=C ufw status 2>/dev/null | grep -q "^Status: active"; then active=yes; fi
    policy="$(sed -n 's/^DEFAULT_INPUT_POLICY="*\([A-Z]*\)"*.*$/\1/p' /etc/default/ufw 2>/dev/null | tail -1)"
    mkdir -p /run/sshd
    conf="$(sshd -T 2>/dev/null || true)"
    # Where sshd listens: its listenaddress lines, which carry the real port.
    # Its port line is not it when a ListenAddress has a port of its own.
    listen="$(printf '%s\n' "$conf" | awk '/^listenaddress /{print $2}')"
    if [ -n "$listen" ]; then
      fromconf="$(printf '%s\n' "$listen" | grep -Ev '^(127[.]|[[]::1[]]:)' | sed 's/.*://' || true)"
    else
      fromconf="$(printf '%s\n' "$conf" | awk '/^port /{print $2}')"
    fi
    sock="$(systemctl show ssh.socket -p Listen 2>/dev/null | grep -o '^Listen=.* (Stream)' || true)"
    fromsock="$(printf '%s\n' "$sock" | grep -Ev '^Listen=(127[.]|[[]::1[]]:)' | grep -o '[0-9]\{1,5\} (Stream)' | cut -d' ' -f1 || true)"
    ports="$(printf '%s\n%s\n' "$fromconf" "$fromsock" | grep -E '^[0-9]+$' | sort -un | tr '\n' ' ' || true)"
    # It said where it listens, and every place is loopback (SSH over Tor).
    if [ -z "$ports" ] && [ -n "$listen$sock" ]; then ports=none; fi
    echo "active=${active} policy=${policy:-DROP} ports=${ports:-22}"
  args:
    executable: /bin/bash
  register: morphit_ufw_before
  changed_when: false
  failed_when: false

- name: Decide which SSH firewall rules this run sets
  ansible.builtin.set_fact:
    # ports=none: sshd listens on loopback only (SSH over Tor), no port to open.
    morphit_ssh_ports: >-
      {{ [] if ('ports=none' in (morphit_ufw_before.stdout | default(''))) else
         ((((morphit_ufw_before.stdout | default('')) | regex_findall('ports=([0-9 ]*)')
          or [''])[0] | trim).split() | select('match', '^[0-9]{1,5}$') | list or ['22']) }}
    morphit_ssh_rules_ours: >-
      {{ ('active=yes' not in (morphit_ufw_before.stdout | default('')))
         or ('policy=ACCEPT' in (morphit_ufw_before.stdout | default(''))) }}

- name: NOTE — the firewall was already on, so its SSH rules are left as they are
  ansible.builtin.debug:
    msg: >-
      The firewall was already on before this run, so its SSH rules are yours and
      are left exactly as they were (nothing is opened wider). Make sure they still
      let you in (sudo ufw status) before you close this session; sudo morphit-ops
      health warns when no rule lets SSH in, with the command that does.
  when: not (morphit_ssh_rules_ours | bool)

- name: Set UFW default deny inbound
  community.general.ufw:
    direction: incoming
    policy: deny

- name: Set UFW default allow outbound
  community.general.ufw:
    direction: outgoing
    policy: allow

- name: Allow inbound on required ports
  # A Tor-only node has NO clearnet listener, so opening 80/443 on it is pure
  # attack surface (nothing answers, but the ports advertise the box). Any
  # operator-added port stays open; the clearnet web ports are opened only
  # when this node actually serves clearnet (review B7). ufw_allowed_inbound_ports
  # lives in group_vars, so gate here rather than editing that shared list.
  # SSH (22 in that list) is set by the SSH tasks below, on the real port(s).
  community.general.ufw:
    rule: allow
    port: "{{ item }}"
    proto: tcp
  loop: "{{ ufw_allowed_inbound_ports }}"
  when:
    - (item | string) != '22'
    - not (morphit_tor_only | default(false) | bool) or (item | string) not in ['80', '443']

- name: Allow SSH on the port(s) sshd listens on (when this run owns the SSH rules)
  community.general.ufw:
    rule: allow
    port: "{{ item }}"
    proto: tcp
  loop: "{{ morphit_ssh_ports }}"
  when: morphit_ssh_rules_ours | bool

# An IPFS origin host must accept inbound swarm connections on 4001, or public
# gateways can't dial in to fetch the seeded release and the on-chain CID never
# resolves. Stock ufw only opens 22/80/443, so a fresh IPFS-hosting install went
# publicly-silent on IPFS until the operator opened 4001 by hand (morphit.io
# v1.17.0). Open it automatically — BOTH tcp and udp (Kubo uses QUIC on udp/4001)
# — whenever this box hosts IPFS.
- name: Allow the IPFS swarm port (4001 tcp+udp) when this box hosts IPFS
  # NOT on a Tor-only node: it runs Kubo with Addresses.Swarm=[] (no public swarm
  # — the privacy heal enforces that), so opening 4001 there advertises a port
  # nothing listens on (review B7).
  community.general.ufw:
    rule: allow
    port: "4001"
    proto: "{{ item }}"
  loop:
    - tcp
    - udp
  when:
    - enable_ipfs | default(true) | bool
    - not (morphit_tor_only | default(false) | bool)

- name: Rate-limit SSH (auto-block brute-force from same source)
  community.general.ufw:
    rule: limit
    port: "{{ item }}"
    proto: tcp
  loop: "{{ morphit_ssh_ports }}"
  when: morphit_ssh_rules_ours | bool

- name: Enable UFW
  community.general.ufw:
    state: enabled

# ── Docker firewall re-assertion (the "site dark after harden" fix) ──
# Enabling/reloading UFW FLUSHES nftables, which wipes the DOCKER / DOCKER-FORWARD
# chains Docker installs for container port-publishing. Without rebuilding them,
# external traffic reaches the box but the DNAT-forward to the frontend container
# is DROPPED — the public site goes dark while the box looks perfectly healthy to
# itself (local curl works; the world times out). Docker rebuilds ALL its chains
# on daemon restart, so restart it AFTER UFW settles whenever Docker is present,
# then VERIFY the NAT rules actually came back rather than assuming (morphit.io).
- name: Detect whether Docker is managing container firewall rules
  ansible.builtin.command: systemctl is-active docker
  register: morphit_docker_active
  changed_when: false
  failed_when: false

- name: Re-assert Docker's firewall chains after the UFW change
  ansible.builtin.systemd:
    name: docker
    state: restarted
  when: (morphit_docker_active.stdout | default('') | trim) == 'active'

- name: Wait for the Docker daemon to come back
  ansible.builtin.command: systemctl is-active docker
  register: morphit_docker_recheck
  changed_when: false
  failed_when: false
  retries: 12
  delay: 5
  until: (morphit_docker_recheck.stdout | default('') | trim) == 'active'
  when: (morphit_docker_active.stdout | default('') | trim) == 'active'

- name: Verify Docker re-created its NAT/port-forwarding rules
  ansible.builtin.shell: |
    set -o pipefail
    iptables -t nat -S DOCKER 2>/dev/null | grep -c 'DNAT' || echo 0
  register: morphit_docker_dnat
  changed_when: false
  failed_when: false
  when: (morphit_docker_active.stdout | default('') | trim) == 'active'

- name: FAIL LOUDLY if Docker's port-forwarding did not come back (site would be dark)
  ansible.builtin.fail:
    msg: >-
      Docker's NAT/port-forwarding rules are empty after the firewall change, which
      means the public site is unreachable from the internet even though the box
      looks healthy locally. Recover with:  sudo systemctl restart docker  then
      confirm from OUTSIDE the box:  curl -skI https://YOUR_DOMAIN/  . This is a
      hard stop so harden never silently leaves the site dark.
  when:
    - (morphit_docker_active.stdout | default('') | trim) == 'active'
    - (morphit_docker_dnat.stdout | default('0') | trim | int) == 0
