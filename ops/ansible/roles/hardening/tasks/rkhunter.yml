# §37.15 — rkhunter rootkit scanner.
---
- name: Configure rkhunter for weekly automatic checks
  ansible.builtin.lineinfile:
    path: /etc/default/rkhunter
    regexp: "^{{ item.key }}="
    line: '{{ item.key }}="{{ item.value }}"'
    state: present
  loop:
    - { key: "CRON_DAILY_RUN", value: "false" }
    # No data-file update from the internet on any node: Ubuntu's rkhunter
    # cannot fetch one anyway (its rkhunter.conf has WEB_CMD="/bin/false"), and
    # its data files come with the apt package.
    - { key: "CRON_DB_UPDATE", value: "false" }
    - { key: "APT_AUTOGEN", value: "true" }
    - { key: "REPORT_EMAIL", value: "{{ morphit_alert_email_to if (morphit_alert_mail_enabled | bool) else '' }}" }

- name: Schedule weekly rkhunter check
  ansible.builtin.copy:
    dest: /etc/cron.weekly/rkhunter-check
    owner: root
    group: root
    mode: '0755'
    content: |
      #!/bin/sh
      # The latest result stays on this server in
      # /var/log/morphit/rkhunter-check.log{{ ' and is mailed to the operator' if (morphit_alert_mail_enabled | bool) else '' }}.
      # Its data files come with the apt package; nothing is downloaded.
      mkdir -p /var/log/morphit
      rkhunter --check --sk --rwo > /var/log/morphit/rkhunter-check.log.new 2>&1
      mv /var/log/morphit/rkhunter-check.log.new /var/log/morphit/rkhunter-check.log
      {% if morphit_alert_mail_enabled | bool %}
      mail -s "[morphit] rkhunter weekly $(date +%F)" {{ morphit_alert_email_to | quote }} < /var/log/morphit/rkhunter-check.log
      {% endif %}
