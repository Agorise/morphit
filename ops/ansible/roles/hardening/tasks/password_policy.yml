# §37.17 — Operator account password policy via pam_pwquality.
---
- name: Ensure the pwquality drop-in directory exists
  # libpam-pwquality installs /etc/security/pwquality.conf but does NOT create
  # the pwquality.conf.d/ drop-in directory, so writing into it fails on a box
  # that has never had it made.  Ensure it (root:root 0755, the standard).
  ansible.builtin.file:
    path: /etc/security/pwquality.conf.d
    state: directory
    owner: root
    group: root
    mode: '0755'

- name: Configure pam_pwquality
  ansible.builtin.copy:
    dest: /etc/security/pwquality.conf.d/99-morphit.conf
    owner: root
    group: root
    mode: '0644'
    content: |
      # Managed by Ansible — see OPERATIONS.md §37.17.
      minlen = 14
      minclass = 4
      maxrepeat = 3
      maxclassrepeat = 4
      dcredit = -1
      ucredit = -1
      lcredit = -1
      ocredit = -1
      enforce_for_root
