# Role: bunkerweb
#
# Deploy Docker Engine + BunkerWeb in front of the morphit
# indexer + relay per OPERATIONS.md §32 + §38.6 (network-layer
# squatter defense).
#
# Caveat: BunkerWeb's env-var names change between major versions.
# Verify against https://docs.bunkerweb.io at deploy time.  This
# role targets the 1.5.x line.

---
- name: Install Docker prerequisites
  ansible.builtin.apt:
    name:
      - apt-transport-https
      - ca-certificates
      - curl
      - gnupg
      - lsb-release
    state: present

- name: Ensure /etc/apt/keyrings exists
  # /etc/apt/keyrings is not present by default on Ubuntu 24.04; the morphit
  # role's nodejs task also makes it, but ensuring it here removes the ordering
  # dependency so bunkerweb is self-contained.
  ansible.builtin.file:
    path: /etc/apt/keyrings
    state: directory
    owner: root
    group: root
    mode: '0755'

- name: Add Docker GPG key
  # Skipped on a self-contained offline install: docker-ce/cli/containerd/buildx/
  # compose all come from the bundled apt closure, so there is no need (and no way)
  # to fetch Docker's repo key from the internet.  The offline apt override ignores
  # sources.list.d anyway, so the repo add below is moot offline too.
  ansible.builtin.get_url:
    url: https://download.docker.com/linux/ubuntu/gpg
    dest: /etc/apt/keyrings/docker.asc
    mode: '0644'
    force: false
  when: not morphit_offline_install

- name: Check the Docker key is the pinned one (one key, this fingerprint)
  ansible.builtin.shell:
    cmd: >-
      set -o pipefail;
      gpg --show-keys --with-colons /etc/apt/keyrings/docker.asc 2>/dev/null
      | awk -F: '/^pub:/ {n++} /^fpr:/ && f == "" {f = $10} END {print n " " f}'
    executable: /bin/bash
  register: morphit_docker_fpr
  changed_when: false
  failed_when: false
  when: not morphit_offline_install

- name: Stop when it is not (the key file is removed; nothing from Docker is trusted)
  when:
    - (morphit_docker_fpr.stdout | default('') | trim) != ('1 ' ~ docker_apt_key_fingerprint)
    - not morphit_offline_install
  block:
    - name: Remove the unexpected Docker key
      ansible.builtin.file:
        path: /etc/apt/keyrings/docker.asc
        state: absent
    - name: Explain
      ansible.builtin.fail:
        msg: >-
          Docker's apt signing key is not the one Morphit expects
          (got: {{ morphit_docker_fpr.stdout | default('') | trim }}), so nothing from that
          repository was trusted. Re-run later, or install from the offline bundle.

- name: Add Docker apt repo
  ansible.builtin.apt_repository:
    repo: "deb [arch={{ ansible_architecture | replace('x86_64', 'amd64') | replace('aarch64', 'arm64') }} signed-by=/etc/apt/keyrings/docker.asc] https://download.docker.com/linux/ubuntu {{ morphit_ubuntu_codename | default(ansible_distribution_release) }} stable"
    filename: docker
    state: present
  when: not morphit_offline_install

- name: Install Docker Engine + compose plugin
  ansible.builtin.apt:
    name:
      - docker-ce
      - docker-ce-cli
      - containerd.io
      - docker-buildx-plugin
      - docker-compose-plugin
    state: present
    update_cache: true

- name: Enable + start Docker
  ansible.builtin.systemd:
    name: docker
    enabled: true
    state: started

# the scheduler needs the Docker socket (root:docker 660);
# resolve the host's docker-group GID so the compose can group_add it to
# the scheduler container.  The GID varies per host, so it must not be
# hard-coded.
- name: Resolve the host docker-group GID (for the scheduler's socket access)
  ansible.builtin.getent:
    database: group
    key: docker

- name: Set bunkerweb_docker_gid
  ansible.builtin.set_fact:
    bunkerweb_docker_gid: "{{ getent_group['docker'][1] }}"

# ── Offline appliance: load bundled Docker images so compose doesn't pull. ──
# When the self-contained bundle ships saved images under vendor/docker, load
# them now (Docker is up, before compose) so "Bring BunkerWeb up" finds them
# locally and needs no Docker Hub.  Gated on the bundle → a no-op online.
- name: Detect bundled Docker images
  ansible.builtin.find:
    paths: "{{ morphit_repo_path }}/vendor/docker"
    patterns: "*.tar.gz"
  register: morphit_vendor_docker
  failed_when: false
  changed_when: false

# Each image must load WITH its name (an image saved by name:tag@digest loads
# with none, and nothing finds it). The frontend base, found by its pinned
# reference (containerd image store), must also be complete: a layer whose
# bytes do not match is dropped by docker load, which still exits 0, and the
# build would then fetch it from the registry.
- name: Load bundled Docker images (offline)
  ansible.builtin.shell:
    cmd: |
      set -o pipefail
      file={{ item.path | quote }}
      name={{ item.path | basename | quote }}
      out="$(gzip -dc "$file" | docker load)"
      printf '%s\n' "$out"
      case "$out" in
        *"Loaded image ID:"*)
          echo "$name holds an image saved without a name, so nothing can use it. Rebuild the bundle with this release of scripts/build-offline-bundle.sh." >&2
          exit 1 ;;
      esac
      ref="$(awk '/^FROM /{print $2; exit}' {{ (morphit_repo_path ~ '/ops/bunkerweb/frontend/Dockerfile') | quote }})"
      if [ -n "$ref" ] && [ "$name" = "$(printf '%s' "$ref" | tr '/:' '__').tar.gz" ] \
        && docker image inspect "$ref" >/dev/null 2>&1; then
        docker rm -f morphit-base-check >/dev/null 2>&1 || true
        if ! docker create --pull never --network none --name morphit-base-check "$ref" true >/dev/null; then
          echo "The frontend base $ref in $name did not load completely (a layer is missing or damaged). Rebuild the bundle." >&2
          exit 1
        fi
        docker rm -f morphit-base-check >/dev/null
      fi
  args:
    executable: /bin/bash
  loop: "{{ morphit_vendor_docker.files | default([]) }}"
  loop_control:
    label: "{{ item.path | basename }}"
  when: (morphit_vendor_docker.files | default([]) | length) > 0
  changed_when: true

- name: Create BunkerWeb config directory
  ansible.builtin.file:
    path: /etc/bunkerweb
    state: directory
    owner: root
    group: root
    mode: '0750'

- name: Deploy BunkerWeb docker-compose file
  ansible.builtin.template:
    src: docker-compose.yml.j2
    dest: /etc/bunkerweb/docker-compose.yml
    owner: root
    group: root
    mode: '0640'
  register: bunkerweb_compose

- name: Deploy BunkerWeb environment file
  ansible.builtin.template:
    src: bunkerweb.env.j2
    dest: /etc/bunkerweb/bunkerweb.env
    owner: root
    group: root
    mode: '0640'
  register: bunkerweb_env

- name: Deploy frontend build context (serves the SvelteKit build + proxies the API)
  ansible.builtin.copy:
    src: "{{ morphit_repo_path }}/ops/bunkerweb/frontend/"
    dest: /etc/bunkerweb/frontend/
    remote_src: true
    owner: root
    group: root
    mode: '0640'
    directory_mode: '0750'
  register: bunkerweb_frontend

# §32 — the frontend container reaches the host-resident relay +
# indexer from the Docker bridge, but UFW's default-deny (hardening
# role) blocks that traffic.  Allow ONLY the bunkerweb_net CIDR to the
# service ports; the public stays blocked.  Keep this CIDR in sync
# with the docker-compose subnet (172.20.0.0/16).
- name: Allow the bunkerweb Docker network to reach the relay + indexer
  community.general.ufw:
    rule: allow
    src: 172.20.0.0/16
    port: "{{ item }}"
    proto: tcp
  loop:
    - "{{ morphit_relay_bind_port }}"
    - "{{ morphit_indexer_bind_port }}"

# §45 — same as above, for the MCP HTTP transport, but only when the MCP
# is enabled (it's the most exposed surface, so don't open the port for
# a service that isn't running).  The frontend nginx proxies /mcp here.
- name: Allow the bunkerweb Docker network to reach the MCP
  community.general.ufw:
    rule: allow
    src: 172.20.0.0/16
    port: "{{ morphit_mcp_bind_port }}"
    proto: tcp
  when: morphit_mcp_enabled | bool

# The frontend nginx proxies /ipfs/ + /ipns/ to the IPFS gateway on the host
# (host.docker.internal:8082). Without this rule UFW's default-deny DROPS that
# container-to-host connect, nginx times out and returns its stock 404 — so every
# hidden (.onion/.b32.i2p) release fetch fails and hidden-only nodes can never
# upgrade from this peer (morphit.io, diagnosed 2026-09-11: morphitlat was
# stranded for weeks by exactly this). The gateway is read-only and serves only
# pinned releases (NoFetch), and this opens it ONLY to the pinned bunkerweb CIDR —
# never the public. Same shape as the relay/indexer/MCP rules above, gated on this
# box actually hosting IPFS.
- name: Allow the bunkerweb Docker network to reach the IPFS gateway (hidden release seeding)
  community.general.ufw:
    rule: allow
    src: 172.20.0.0/16
    port: "{{ (morphit_ipfs_gateway_expose_addr | default('/ip4/0.0.0.0/tcp/8082')).split('/') | last }}"
    proto: tcp
  when:
    - enable_ipfs | default(true) | bool
    - morphit_ipfs_gateway_expose | default(true) | bool

# Docker classic image store (a box whose Docker predates 29): a base loaded
# from the offline bundle has no digest there, so a FROM name:tag@digest build
# would ask the registry. When the tag is proven to be the pinned image (its ID
# is a config the pinned index names, read from the bundle hash by hash) and
# all of it is here, the build names the tag; the label keeps the pinned value.
- name: Build the frontend from the bundled base by its tag (classic image store)
  ansible.builtin.shell:
    cmd: |
      set -o pipefail
      df=/etc/bunkerweb/frontend/Dockerfile
      repo={{ morphit_repo_path | quote }}
      ref="$(awk '/^FROM /{print $2; exit}' "$df")"
      case "$ref" in *@sha256:*) ;; *) exit 0 ;; esac
      docker image inspect "$ref" >/dev/null 2>&1 && exit 0
      bundle="$repo/vendor/docker/$(printf '%s' "$ref" | tr '/:' '__').tar.gz"
      [ -f "$bundle" ] || exit 0
      id="$(docker image inspect "${ref%@*}" | python3 -c 'import json, sys; print(json.load(sys.stdin)[0]["Id"])')" || exit 0
      python3 - "$bundle" "${ref##*@}" "$id" <<'PY' || exit 0
      import hashlib, json, sys, tarfile
      bundle, pinned, image_id = sys.argv[1:]
      tar = tarfile.open(bundle, 'r:gz')
      def doc(d):
          try:
              b = tar.extractfile('blobs/sha256/' + d.split(':', 1)[1]).read()
          except Exception:
              return None
          return json.loads(b) if 'sha256:' + hashlib.sha256(b).hexdigest() == d else None
      top = doc(pinned) or {}
      entries = top.get('manifests')
      mans = [doc(e.get('digest', '')) for e in entries if (e.get('platform') or {}).get('os') != 'unknown'] if entries else [top]
      configs = [((m or {}).get('config') or {}).get('digest') for m in mans]
      sys.exit(0 if image_id in configs else 1)
      PY
      docker rm -f morphit-base-check >/dev/null 2>&1 || true
      docker create --pull never --network none --name morphit-base-check "${ref%@*}" true >/dev/null || exit 0
      docker rm -f morphit-base-check >/dev/null
      sed -i "s#^FROM ${ref}\$#FROM ${ref%@*}#" "$df"
      echo changed
  args:
    executable: /bin/bash
  register: bunkerweb_frontend_tagbase
  changed_when: "'changed' in bunkerweb_frontend_tagbase.stdout"

- name: Build the BunkerWeb frontend image
  # `docker_compose_v2` with build: always surfaces Docker's build progress
  # (e.g. "image bunkerweb-frontend: Built") as Ansible WARNINGs — which reads
  # like a problem even though it's a success. Building here with `docker compose
  # build` keeps that output captured in the task result (not printed to the
  # operator), and the up step below runs with build: never so it has nothing to
  # warn about.
  ansible.builtin.command:
    cmd: docker compose build
    chdir: /etc/bunkerweb
  register: bunkerweb_build
  changed_when: >-
    ('Built' in (bunkerweb_build.stdout | default('')))
    or ('Built' in (bunkerweb_build.stderr | default('')))
  when: >-
    bunkerweb_compose.changed or bunkerweb_env.changed or bunkerweb_frontend.changed
    or bunkerweb_frontend_tagbase is changed

- name: Bring BunkerWeb up
  # Call the `docker compose` v2 CLI plugin directly rather than
  # community.docker.docker_compose_v2 — that module only exists in
  # community.docker 3.x, which needs ansible-core >= 2.15, so it fails to
  # resolve on Ubuntu 22.04's default Ansible (2.10). The compose v2 CLI is
  # present on every box that has Docker, so this works with NO Ansible upgrade.
  # The image was built by the previous task; `up -d` reuses the existing image
  # (it only builds if one is missing), matching the old `build: never` intent.
  ansible.builtin.command:
    cmd: docker compose up -d
    chdir: /etc/bunkerweb
  register: bunkerweb_up
  changed_when: >-
    ('Started' in (bunkerweb_up.stderr | default('')))
    or ('Recreated' in (bunkerweb_up.stderr | default('')))
    or ('Created' in (bunkerweb_up.stderr | default('')))
    or ('Started' in (bunkerweb_up.stdout | default('')))
  when: >-
    bunkerweb_compose.changed or bunkerweb_env.changed or bunkerweb_frontend.changed
    or bunkerweb_frontend_tagbase is changed

- name: Verify the update surface is served no-cache (stale-worker guard)
  # A missing no-cache header on /service-worker.js + /verify.json lets an edge
  # cache pin a stale service worker on visitors' devices, so they stop receiving
  # deploys until they hard-refresh. The shipped frontend config sets no-cache;
  # this confirms it actually reached the wire. The retry loop lives INSIDE the
  # shell (not Ansible's until/retries) on purpose: Ansible's retry prints a
  # "FAILED - RETRYING ... (N retries left)" line per attempt, which reads like
  # ten failures to a new operator. Doing it in-shell means Ansible sees one
  # task that reports a single calm result. Always exits 0 (non-fatal — a
  # not-yet-ready site shouldn't abort the run); the outcome is in stdout.
  ansible.builtin.shell: |
    set -o pipefail
    for _ in $(seq 1 10); do
      if curl -fsSI "https://{{ morphit_domain }}/verify.json" \
         | grep -i '^cache-control:' | grep -qi 'no-cache'; then
        echo fresh
        exit 0
      fi
      sleep 6
    done
    echo pending
    exit 0
  args:
    executable: /bin/bash
  register: morphit_nocache_check
  changed_when: false
  # Tor-only: no clearnet https://<domain> to curl — the same no-cache frontend
  # config is served via the onion; skip the clearnet verification.
  # Offline/air-gapped install: the box has no network (and no DNS for its own
  # domain), so this curl can only fail — skip it rather than wait, and report a
  # calm deferred note instead. morphit-first-online re-checks it.
  when: >-
    (bunkerweb_compose.changed or bunkerweb_env.changed or bunkerweb_frontend.changed)
    and not (morphit_tor_only | default(false))
    and not (morphit_offline_install | default(false))

- name: Report update-surface no-cache result
  ansible.builtin.debug:
    msg: >-
      {{ 'Update surface is fresh — /verify.json is served no-cache, so visitors auto-receive new deploys.'
         if 'fresh' in (morphit_nocache_check.stdout | default(''))
         else 'The site is still coming up — the update-surface freshness check will pass once it is fully live (nothing to do now). You can re-check any time with:  curl -sI https://' ~ morphit_domain ~ '/verify.json | grep -i cache-control' }}
  when: >-
    (bunkerweb_compose.changed or bunkerweb_env.changed or bunkerweb_frontend.changed)
    and not (morphit_tor_only | default(false))
    and not (morphit_offline_install | default(false))

- name: Note the no-cache check is deferred on an offline install
  ansible.builtin.debug:
    msg: >-
      Offline install — the served-page freshness check runs automatically once
      this box is online. Nothing to do now.
  when: >-
    (bunkerweb_compose.changed or bunkerweb_env.changed or bunkerweb_frontend.changed)
    and not (morphit_tor_only | default(false))
    and (morphit_offline_install | default(false))

# The certificate was issued with certbot's standalone server, which
# cannot renew while BunkerWeb holds port 80.  Renew through BunkerWeb instead:
# Let's Encrypt's request reaches the frontend, which serves /.well-known/ from
# the web build.  `certbot reconfigure` (certbot 2.3+) runs a real test renewal
# against Let's Encrypt's staging server and saves the new settings only when it
# passes; the result is read back from the renewal file.  Older certbot: a real
# renewal through the web build (once; it saves the webroot settings only on
# success).  `morphit-ops upgrade` does the same on installed servers.
- name: Renew the TLS certificate through BunkerWeb (webroot)
  when:
    - not (morphit_tor_only | default(false))
    - not (morphit_offline_install | default(false))
  vars:
    tls_renewal_conf: "/etc/letsencrypt/renewal/{{ morphit_domain }}.conf"
    tls_webroot: "{{ morphit_repo_path }}/apps/web/build"
  block:
    - name: Read how the certificate renews
      ansible.builtin.command: "grep -E '^authenticator *= *' {{ tls_renewal_conf | quote }}"
      register: tls_renew_auth
      changed_when: false
      failed_when: false

    - name: Read certbot's version
      ansible.builtin.command: certbot --version
      register: tls_certbot_version
      changed_when: false
      failed_when: false
      when: tls_renew_auth.stdout is search('standalone')

    - name: Switch the renewal to the web build (certbot reconfigure runs a test renewal first)
      ansible.builtin.command:
        cmd: >-
          certbot reconfigure --non-interactive --cert-name {{ morphit_domain }}
          --webroot --webroot-path {{ tls_webroot | quote }}
      register: tls_reconfigure
      changed_when: tls_reconfigure.rc == 0
      failed_when: false
      when:
        - tls_renew_auth.stdout is search('standalone')
        - (tls_certbot_version.stdout | default('') | regex_search('[0-9]+\.[0-9]+') | default('0.0', true)) is version('2.3', '>=')

    - name: Renew once through the web build (certbot older than 2.3)
      ansible.builtin.command:
        cmd: >-
          certbot certonly --non-interactive --force-renewal --cert-name {{ morphit_domain }}
          --webroot --webroot-path {{ tls_webroot | quote }} -d {{ morphit_domain }}
      register: tls_webroot_renew
      changed_when: tls_webroot_renew.rc == 0
      failed_when: false
      when:
        - tls_renew_auth.stdout is search('standalone')
        - (tls_certbot_version.stdout | default('') | regex_search('[0-9]+\.[0-9]+') | default('0.0', true)) is version('2.3', '<')

    - name: Read how the certificate renews now
      ansible.builtin.command: "grep -E '^authenticator *= *' {{ tls_renewal_conf | quote }}"
      register: tls_renew_auth_after
      changed_when: false
      failed_when: false
      when: tls_renew_auth.stdout is search('standalone')

    - name: Report how the certificate renews
      ansible.builtin.debug:
        msg: >-
          {{ "The TLS certificate now renews through BunkerWeb (a test renewal with Let's Encrypt passed; settings read back)."
             if tls_renew_auth_after.stdout | default('') is search('webroot')
             else "The TLS certificate could not be switched to renew through BunkerWeb yet (the domain may not point at this server). Nothing is broken now; `sudo morphit-ops upgrade` tries again, or on this server run: sudo certbot reconfigure --cert-name " ~ morphit_domain ~ " --webroot --webroot-path " ~ tls_webroot }}
      when: tls_renew_auth.stdout is search('standalone')

- name: Print BunkerWeb verification reminder
  ansible.builtin.debug:
    msg: |
      BunkerWeb is up and fronting your site.

      If you'd like to confirm everything's wired up:

        docker ps | grep -E 'bunkerweb|morphit-frontend'
        curl -v https://{{ morphit_domain }}/             # SvelteKit app
        curl -v https://{{ morphit_domain }}/v1/instance  # indexer JSON

      One thing worth a glance later: the relay identifies real
      visitors by trusting BunkerWeb's forwarded IP.  If rate
      limits ever look off (every visitor appearing as the
      BunkerWeb Docker IP), make sure MORPHIT_RELAY_TRUSTED_PROXY_IPS
      in /etc/morphit/relay.env includes the Docker network CIDR:

        docker network inspect bunkerweb_net --format \
          '{% raw %}{{ range .IPAM.Config }}{{ .Subnet }}{{ end }}{% endraw %}'

