# roles/certbot_monitor/tasks/main.yml
#
# Deploy the morphit-certbot-monitor sidecar.  Does NOT install
# certbot itself — that's done by the `tls` role (or operator
# manually).  This role just adds the monitor.
#
# Optional variables:
#   certbot_expiry_critical_days  : default 7
#   certbot_expiry_warn_days      : default 30
#   certbot_renewal_stall_days    : default 14
#
# References: docs/OPERATIONS.md §16 "Extended monitoring sidecars".

---
- name: Assert openssl exists (needed to read cert expiry)
  ansible.builtin.command:
    cmd: which openssl
  register: certbot_monitor_openssl_check
  changed_when: false
  failed_when: certbot_monitor_openssl_check.rc != 0

- name: Write certbot-monitor env file (optional thresholds)
  ansible.builtin.template:
    src: certbot-monitor.env.j2
    dest: /etc/morphit/certbot-monitor.env
    owner: root
    group: root
    mode: '0644'
  when:
    - certbot_expiry_critical_days is defined or
      certbot_expiry_warn_days is defined or
      certbot_renewal_stall_days is defined
  notify: Restart morphit-certbot-monitor-timer

- name: Install certbot-monitor systemd service unit
  ansible.builtin.copy:
    src: /opt/morphit/ops/systemd/morphit-certbot-monitor.service
    dest: /etc/systemd/system/morphit-certbot-monitor.service
    owner: root
    group: root
    mode: '0644'
    remote_src: true
  notify: Reload systemd

- name: Install certbot-monitor systemd timer
  ansible.builtin.copy:
    src: /opt/morphit/ops/systemd/morphit-certbot-monitor.timer
    dest: /etc/systemd/system/morphit-certbot-monitor.timer
    owner: root
    group: root
    mode: '0644'
    remote_src: true
  notify: Reload systemd

- name: Enable + start morphit-certbot-monitor.timer
  ansible.builtin.systemd:
    name: morphit-certbot-monitor.timer
    enabled: true
    state: started
    daemon_reload: true
