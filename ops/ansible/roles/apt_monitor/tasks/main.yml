# roles/apt_monitor/tasks/main.yml
#
# Deploy the morphit-apt-monitor sidecar.  Counts pending
# security updates daily.  Debian/Ubuntu only.
#
# Optional variables:
#   apt_security_critical   : default 10 (pending security updates)
#   apt_security_warn       : default 1
#
# References: docs/OPERATIONS.md §16 "Extended monitoring sidecars".

---
- name: Write apt-monitor env file (optional thresholds)
  ansible.builtin.template:
    src: apt-monitor.env.j2
    dest: /etc/morphit/apt-monitor.env
    owner: root
    group: root
    mode: '0644'
  when:
    - apt_security_critical is defined or apt_security_warn is defined
  notify: Restart morphit-apt-monitor-timer

- name: Install apt-monitor systemd service unit
  ansible.builtin.copy:
    src: /opt/morphit/ops/systemd/morphit-apt-monitor.service
    dest: /etc/systemd/system/morphit-apt-monitor.service
    owner: root
    group: root
    mode: '0644'
    remote_src: true
  notify: Reload systemd

- name: Install apt-monitor systemd timer
  ansible.builtin.copy:
    src: /opt/morphit/ops/systemd/morphit-apt-monitor.timer
    dest: /etc/systemd/system/morphit-apt-monitor.timer
    owner: root
    group: root
    mode: '0644'
    remote_src: true
  notify: Reload systemd

- name: Enable + start morphit-apt-monitor.timer
  ansible.builtin.systemd:
    name: morphit-apt-monitor.timer
    enabled: true
    state: started
    daemon_reload: true
