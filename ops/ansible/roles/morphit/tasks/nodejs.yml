# Install Node.js from NodeSource apt repo.
#
# AUDIT-ANSIBLE-1 (cp18 deep-deep): pre-cp18 this role downloaded
# `setup_X.x` from deb.nodesource.com and executed it as root via
# bash.  That recipe is the NodeSource-official one but it runs
# arbitrary shell as root with no signature verification — any
# NodeSource compromise or MITM would install attacker-controlled
# software on every Morphit node.
#
# Post-cp18 we replicate what the setup script DOES (add the
# NodeSource GPG key + apt repo, then install nodejs) without
# running the script.  Same install outcome, smaller attack surface.
# Matches the pattern used in roles/bunkerweb (docker) and
# roles/trivy_monitor.
---
- name: Ensure /etc/apt/keyrings exists
  ansible.builtin.file:
    path: /etc/apt/keyrings
    state: directory
    mode: '0755'

- name: Add NodeSource apt signing key
  ansible.builtin.get_url:
    url: https://deb.nodesource.com/gpgkey/nodesource-repo.gpg.key
    dest: /etc/apt/keyrings/nodesource.asc
    owner: root
    group: root
    mode: '0644'

- name: Add NodeSource apt repo
  # The repo path uses `nodistro` because NodeSource publishes a
  # single multi-distro repo (the same packages work on Debian
  # bullseye/bookworm and Ubuntu 22.04/24.04).  `node_{{ X }}.x`
  # is the major-version selector.
  ansible.builtin.apt_repository:
    repo: "deb [signed-by=/etc/apt/keyrings/nodesource.asc] https://deb.nodesource.com/node_{{ morphit_node_version }}.x nodistro main"
    filename: nodesource
    state: present
    update_cache: true

- name: Install Node.js
  ansible.builtin.apt:
    name: nodejs
    state: present
