# Clone the repo + npm install + build.
#
# The install tree stays ROOT-OWNED, from the first file to the last: root
# units execute code from it (the indexer's tsx, ops/scripts/*, `npm exec
# morphit-ops`) and source config from it, so any other owner could turn a
# write into root.  npm runs as root WITH --ignore-scripts: no dependency's
# install script runs at all (the two the Matrix bot needs are fetched below and
# checked against pinned SHA-256 sums).  Running npm as an unprivileged user
# would not help here: the service user is in the docker group on a
# containerized-DB box (root-equivalent), and root runs the built output anyway.
---
# Silence npm's noise for EVERY npm/npx call on this box (all users) — not just
# the workspace install below. The per-command env we set on the workspace
# install doesn't cover the MCP-deploy `npm install` or `npx morphit-ops`, so the
# "New major version of npm available!" update-notifier still leaked (it
# must be gone on fresh installs AND upgrades). Writing the GLOBAL npmrc fixes
# it system-wide, including future `morphit-ops upgrade` runs.
- name: Silence npm update-notifier + fund globally (all npm/npx calls)
  ansible.builtin.command:
    cmd: "npm config set {{ item }} --location=global"
  loop:
    - "update-notifier false"
    - "fund false"
  changed_when: false
  become: true

# `npm config set --location=global` leaves the global npmrc world-writable
# (npm chmods it 0666 after saving). Any local account could then add
# `script-shell=` / `node-options=` and run code as root the next time root runs
# npm. Make it root-owned 0644 again.
- name: Find the global npmrc
  ansible.builtin.command:
    cmd: npm config get globalconfig
    chdir: /
  register: morphit_global_npmrc
  changed_when: false
  become: true

- name: Keep the global npmrc root-owned and not world-writable
  ansible.builtin.file:
    path: "{{ morphit_global_npmrc.stdout | trim }}"
    owner: root
    group: root
    mode: "0644"
  become: true

- name: Clone morphit repo (remote install — no local source given)
  ansible.builtin.git:
    repo: "{{ morphit_repo_url }}"
    dest: "{{ morphit_repo_path }}"
    version: "{{ morphit_repo_ref }}"
    update: true
    force: false
  become: true
  when: (morphit_local_source_path | default('')) | length == 0


- name: Ensure the repo dir exists (local install — copying the downloaded release)
  ansible.builtin.file:
    path: "{{ morphit_repo_path }}"
    state: directory
    owner: root
    group: root
    mode: "0755"
  when:
    - (morphit_local_source_path | default('')) | length > 0
    - morphit_local_source_path != morphit_repo_path

- name: Detect a bundled node_modules in the downloaded release (offline install)
  # A self-contained offline tarball ships a prebuilt node_modules carrying this
  # marker in the SOURCE.  When present we COPY node_modules into place (next task)
  # and skip the workspace npm install — the one step that would otherwise reach
  # the npm registry.  When absent (an ordinary online install) node_modules is
  # excluded from the copy and rebuilt in place by npm install.
  ansible.builtin.stat:
    path: "{{ morphit_local_source_path }}/node_modules/.morphit-bundle-complete"
  register: morphit_source_bundle_marker

- name: Copy the downloaded release into place (local install)
  # tar-pipe rather than `cp -a`: tar is always present, no rsync dependency.
  # node_modules is EXCLUDED for an online install (npm install rebuilds it in
  # place — avoids duplicating the extract's dev-install), but INCLUDED for a
  # self-contained offline bundle: there is no registry to rebuild from, so the
  # prebuilt node_modules must come along.  Runs as root; ownership fixed below.
  #
  # CRITICAL: --no-wildcards-match-slash + ANCHORED (./…) excludes.  Without the
  # flag GNU tar lets `*` cross `/`, so `./apps/*/dist` (and a bare `--exclude=dist`)
  # also match node_modules/vite/dist, node_modules/@beblurt/*/dist, esbuild,
  # @modelcontextprotocol/sdk, AND nested apps/web/node_modules/jspdf|dompurify/dist
  # — stripping the prebuilt package output and making the offline build fail with
  # "Cannot find module …/dist/…".  With the flag the excludes hit ONLY the project's
  # own build dirs (which the source tree doesn't even carry — build-offline-bundle.sh
  # never builds before packaging), and every package's dist/ survives intact.
  # `--exclude=node_modules` (online only) has no wildcard, so it still drops every
  # node_modules (root + nested) for the npm rebuild. ./private (the maintainer's
  # private handoff, gitignored) never belongs on a server.
  ansible.builtin.shell:
    cmd: >-
      tar --no-wildcards-match-slash -C {{ morphit_local_source_path | quote }}
      {{ '' if (morphit_source_bundle_marker.stat.exists | default(false)) else '--exclude=node_modules' }}
      --exclude=./.git --exclude=./translator-output --exclude=./private
      --exclude=./apps/*/.svelte-kit
      --exclude=./apps/*/dist --exclude=./packages/*/dist
      -cf - . | tar -C {{ morphit_repo_path | quote }} -xf -
  when:
    - (morphit_local_source_path | default('')) | length > 0
    - morphit_local_source_path != morphit_repo_path
  changed_when: true

- name: Keep the install tree root-owned and writable by root only
  # Also takes back a tree an earlier version of this role handed to the
  # service user.  (The env files the services read are put back to
  # root:{{ morphit_service_group }} 0640 by the morphit role's template tasks.)
  ansible.builtin.file:
    path: "{{ morphit_repo_path }}"
    state: directory
    owner: root
    group: root
    mode: "go-w"
    recurse: true

- name: Detect a bundled (complete) node_modules
  # A self-contained offline tarball ships a prebuilt node_modules carrying this
  # marker; the copy task above brings it into place for an offline bundle.  When
  # present we skip the workspace `npm install` entirely — it is the one step here
  # that would otherwise reach the npm registry.
  ansible.builtin.stat:
    path: "{{ morphit_repo_path }}/node_modules/.morphit-bundle-complete"
  register: morphit_bundle_marker

- name: npm install (workspace root, no dependency install scripts)
  ansible.builtin.command:
    cmd: npm install --workspaces --include-workspace-root --ignore-scripts
    chdir: "{{ morphit_repo_path }}"
  environment:
    # Keep npm's cache in the (root-owned) repo instead of $HOME/.npm.
    npm_config_cache: "{{ morphit_repo_path }}/.npm-cache"
    # Silence npm's "New major version of npm available!" update-notifier
    # banner — it prints at the end of the run and looks like scary noise to
    # a new operator finishing the wizard. Nothing here should ever act on it.
    npm_config_update_notifier: "false"
  become: true
  register: morphit_npm_install_result
  changed_when: "'changed' in morphit_npm_install_result.stdout or 'added' in morphit_npm_install_result.stdout"
  when: not morphit_bundle_marker.stat.exists

- name: Fetch and check the Matrix bot's two native binaries (bot enabled only)
  # matrix-bot-sdk needs @matrix-org/matrix-sdk-crypto-nodejs (E2EE) and
  # better-sqlite3 (its store), both NATIVE.  Their own install scripts would
  # download them from GitHub unverified; with --ignore-scripts above nothing ran,
  # so they are fetched here — only when the bot is on — and each is checked
  # against the SHA-256 pinned below (the GitHub release assets for exactly the
  # versions in package-lock.json, Node 22 / ABI 127).  A file that does not
  # match is replaced by a download that is itself checked before it is put in
  # place; a download that does not match stops the install loudly.  An offline
  # bundle already carries them: they are checked the same way.  A tor-only
  # box never downloads them (GitHub is clearnet): it needs the offline bundle.
  when: enable_matrix_bot | default(false)
  vars:
    morphit_matrix_crypto_dir: "{{ morphit_repo_path }}/node_modules/@matrix-org/matrix-sdk-crypto-nodejs"
    morphit_native_arch: "{{ 'arm64' if ansible_architecture in ['aarch64', 'arm64'] else 'x64' }}"
    morphit_matrix_crypto_file: "matrix-sdk-crypto.linux-{{ morphit_native_arch }}-gnu.node"
    morphit_matrix_crypto_sha256:
      x64: f9b8ca0350a2085d189e06b19ffada5689ef843a394705e473a1106893d9f483
      arm64: c1c166690787b12a6bd97070871e8c729082b7d3d3038e15d100612df15e2881
    morphit_sqlite_dir: "{{ morphit_repo_path }}/node_modules/better-sqlite3"
    morphit_sqlite_tarball_sha256:
      x64: ea6a09d12d43cca31782ab0e09ecf442b8e2a49f5a02b219f5f117a6601ed306
      arm64: 7bdf1d50d7ba21f91a4d3c31da7b1acc1c10d7ef51dd887a6e07d851a75388da
    # …and of the better_sqlite3.node inside each tarball.
    morphit_sqlite_node_sha256:
      x64: d7d9272b12d11c1dc2bb787741b1b7c4037d336155f316ace3420410c28fda37
      arm64: 2bdcfde76d902d1b83aa957fc359aa37b98e7291d6103f57da4a802ee1cb1aef
  block:
    - name: Read the versions package-lock.json installed
      ansible.builtin.command:
        cmd: >-
          node -p "require('{{ morphit_matrix_crypto_dir }}/package.json').version + ' ' +
          require('{{ morphit_sqlite_dir }}/package.json').version + ' ' + process.versions.modules"
      register: morphit_native_versions
      changed_when: false

    - name: Stop when the pinned sums do not cover these versions
      ansible.builtin.fail:
        msg: >-
          The Matrix bot's native binaries are pinned for matrix-sdk-crypto-nodejs
          0.1.0-beta.6 and better-sqlite3 11.10.0 on Node 22, but this tree has
          {{ morphit_native_versions.stdout }} (versions, Node ABI). Update the pinned
          sums in roles/morphit/tasks/clone_and_build.yml together with
          package-lock.json. The rest of the node runs fine; alerts stay off.
      when: morphit_native_versions.stdout | trim != '0.1.0-beta.6 11.10.0 127'

    - name: Check the Matrix crypto binary already present
      ansible.builtin.stat:
        path: "{{ morphit_matrix_crypto_dir }}/{{ morphit_matrix_crypto_file }}"
        checksum_algorithm: sha256
      register: morphit_matrix_crypto_bin

    - name: Download the Matrix crypto binary (pinned SHA-256)
      ansible.builtin.get_url:
        url: "https://github.com/matrix-org/matrix-rust-sdk/releases/download/matrix-sdk-crypto-nodejs-v0.1.0-beta.6/{{ morphit_matrix_crypto_file }}"
        dest: "{{ morphit_matrix_crypto_dir }}/{{ morphit_matrix_crypto_file }}"
        checksum: "sha256:{{ morphit_matrix_crypto_sha256[morphit_native_arch] }}"
        owner: root
        group: root
        mode: "0644"
        force: true
      when:
        - (morphit_matrix_crypto_bin.stat.checksum | default('')) != morphit_matrix_crypto_sha256[morphit_native_arch]
        - not (morphit_tor_only | default(false))

    - name: Stop when the Matrix crypto binary is not the pinned one (tor-only, no download)
      ansible.builtin.fail:
        msg: >-
          {{ morphit_matrix_crypto_dir }}/{{ morphit_matrix_crypto_file }} is not the pinned
          build, and a tor-only node does not download it from GitHub. Install from the
          offline bundle (it carries both add-ons), or turn the Matrix bot off.
      when:
        - (morphit_matrix_crypto_bin.stat.checksum | default('')) != morphit_matrix_crypto_sha256[morphit_native_arch]
        - morphit_tor_only | default(false)

    - name: Check the better-sqlite3 binary already present
      ansible.builtin.stat:
        path: "{{ morphit_sqlite_dir }}/build/Release/better_sqlite3.node"
        checksum_algorithm: sha256
      register: morphit_sqlite_bin

    - name: Download the better-sqlite3 prebuilt (pinned SHA-256)
      ansible.builtin.get_url:
        url: "https://github.com/WiseLibs/better-sqlite3/releases/download/v11.10.0/better-sqlite3-v11.10.0-node-v127-linux-{{ morphit_native_arch }}.tar.gz"
        dest: "{{ morphit_repo_path }}/.npm-cache/better-sqlite3-v11.10.0-node-v127-linux-{{ morphit_native_arch }}.tar.gz"
        checksum: "sha256:{{ morphit_sqlite_tarball_sha256[morphit_native_arch] }}"
        mode: "0644"
      register: morphit_sqlite_tarball
      when:
        - (morphit_sqlite_bin.stat.checksum | default('')) != morphit_sqlite_node_sha256[morphit_native_arch]
        - not (morphit_tor_only | default(false))

    - name: Unpack the better-sqlite3 prebuilt
      ansible.builtin.unarchive:
        src: "{{ morphit_sqlite_tarball.dest }}"
        dest: "{{ morphit_sqlite_dir }}"
        remote_src: true
        owner: root
        group: root
      when:
        - (morphit_sqlite_bin.stat.checksum | default('')) != morphit_sqlite_node_sha256[morphit_native_arch]
        - not (morphit_tor_only | default(false))

    - name: Re-check the better-sqlite3 binary
      ansible.builtin.stat:
        path: "{{ morphit_sqlite_dir }}/build/Release/better_sqlite3.node"
        checksum_algorithm: sha256
      register: morphit_sqlite_bin2

    - name: Stop when the better-sqlite3 binary is not the pinned one
      ansible.builtin.fail:
        msg: >-
          {{ morphit_sqlite_dir }}/build/Release/better_sqlite3.node is not the pinned
          better-sqlite3 11.10.0 build for this machine (a tor-only node does not
          download it: use the offline bundle). The rest of the node runs fine
          without it — Matrix alerts just stay off until it is in place.
      when: (morphit_sqlite_bin2.stat.checksum | default('')) != morphit_sqlite_node_sha256[morphit_native_arch]

- name: Preserve the CANONICAL prebuilt web frontend (shipped in the release tarball)
  # A federated operator must serve @morphit's EXACT frontend bytes to pass the
  # on-chain build-integrity check — a local rebuild isn't byte-reproducible and
  # trips the tamper banner. The tarball ships apps/web/build; the workspace build
  # below would overwrite it with a local rebuild, so stash it first and restore it
  # after. If nothing was shipped (older tarball / source checkout), there's nothing
  # to stash and the local rebuild stands — no regression.
  ansible.builtin.shell: |
    set -eu
    if [ -f apps/web/build/index.html ]; then
      rm -rf apps/web/.build-shipped
      cp -a apps/web/build apps/web/.build-shipped
    fi
  args:
    chdir: "{{ morphit_repo_path }}"
    executable: /bin/bash
  become: true
  changed_when: false

- name: Build workspaces (relay + indexer + ops-cli + indexer-client + asset-registry)
  ansible.builtin.command:
    cmd: npm run build --workspaces --if-present
    chdir: "{{ morphit_repo_path }}"
  environment:
    npm_config_cache: "{{ morphit_repo_path }}/.npm-cache"
    # Silence npm's "New major version of npm available!" update-notifier
    # banner — it prints at the end of the run and looks like scary noise to
    # a new operator finishing the wizard. Nothing here should ever act on it.
    npm_config_update_notifier: "false"
  become: true
  register: npm_build_result
  changed_when: true
  # ops-cli now HAS a `build` script (esbuild bundle →
  # dist/main.js), so `--if-present` builds it here.  The
  # published bin is a launcher shim that runs the compiled
  # dist/main.js under plain `node` when present (no tsx), and
  # falls back to the tsx source only if dist is absent.  Because
  # this task runs AFTER the full `npm install` above (dev deps
  # present, incl. esbuild), the bundle builds cleanly.  The next
  # task verifies the result is runnable.

- name: Restore the canonical prebuilt web frontend over the local rebuild
  # Put @morphit's exact shipped bytes back (the workspace build above rebuilt
  # apps/web locally). If nothing was stashed, the local rebuild stands — fallback.
  ansible.builtin.shell: |
    set -eu
    if [ -d apps/web/.build-shipped ]; then
      rm -rf apps/web/build
      mv apps/web/.build-shipped apps/web/build
    fi
  args:
    chdir: "{{ morphit_repo_path }}"
    executable: /bin/bash
  become: true
  changed_when: false

- name: Verify the web frontend has a root entry point (index.html)
  # Final guard against a silently-incomplete frontend, checked on the FINAL
  # build (after the shipped-bytes restore). A build/ with every per-locale page
  # but no index.html deploys a site that 500-loops on every request (nginx
  # try_files rewrites /index.html → /index.html forever). The build guard should
  # make this impossible, but assert it here too so ANY cause (a corrupt shipped
  # build, an OOM mid-build, a later step removing the file) STOPS the install
  # loudly instead of handing the operator a dark site.
  ansible.builtin.stat:
    path: "{{ morphit_repo_path }}/apps/web/build/index.html"
  register: morphit_web_index
  become: true

- name: Fail loudly if the web frontend is missing its root entry point
  ansible.builtin.fail:
    msg: >-
      apps/web/build/index.html is missing after the frontend build. The site
      would return HTTP 500 on every request (nginx SPA fallback loop). This
      usually means the frontend build was incomplete (out-of-memory mid-build,
      a prerender error on the root route, or a corrupt shipped build). Re-run
      `sudo morphit-ops` and choose upgrade; if it persists, check `free -h` and
      the build output for errors.
  when: not morphit_web_index.stat.exists

- name: Verify morphit-ops CLI is runnable (catches missing bin symlink / missing tsx)
  ansible.builtin.command:
    cmd: npm exec --offline --workspace apps/ops-cli morphit-ops -- --help
    chdir: "{{ morphit_repo_path }}"
  environment:
    npm_config_cache: "{{ morphit_repo_path }}/.npm-cache"
    # Silence npm's "New major version of npm available!" update-notifier
    # banner — it prints at the end of the run and looks like scary noise to
    # a new operator finishing the wizard. Nothing here should ever act on it.
    npm_config_update_notifier: "false"
  become: true
  register: morphit_ops_smoke
  changed_when: false
  # `npm exec --offline --workspace` resolves the ops-cli bin
  # purely from the local workspace and forbids any registry
  # access — if `npm install` didn't wire up the tool, or tsx
  # (a production dep since an earlier release) is absent, this fails the play
  # with a clear error instead of letting the operator hit
  # "command not found" at their first `morphit-ops init`.
  # NOTE: we use `npm exec --offline`, NOT `npx --no-install` —
  # the latter still performs a registry lookup before erroring,
  # so it is not a reliable offline guarantee on hardened/air-
  # gapped hosts.  `--offline` forbids network access outright.
  # The ops-cli bin runs from TS source via tsx, so this exercises
  # the full resolve→tsx→execute path the operator will use.

- name: Install the global `morphit-ops` launcher on PATH
  ansible.builtin.template:
    src: morphit-ops.j2
    dest: /usr/local/bin/morphit-ops
    owner: root
    group: root
    mode: "0755"
  become: true
  # Without this, `morphit-ops` was only reachable as `npx morphit-ops` from
  # inside the checkout — so the wizard's `sudo morphit-ops register` (and every
  # other doc that says `morphit-ops <cmd>`) died with "command not found".
