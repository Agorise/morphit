# Role: morphit
#
# Deploys the morphit relay + indexer + backup as
# systemd units per ops/systemd/ in the repo.  Diamond-hardened
# squatter defense env vars per §38.7 baked into relay.env.

---
- name: Install Node.js via NodeSource (apt)
  ansible.builtin.import_tasks: nodejs.yml

- name: Clone + build morphit repo
  ansible.builtin.import_tasks: clone_and_build.yml

- name: Deploy indexer env file
  ansible.builtin.template:
    src: indexer.env.j2
    dest: /etc/morphit/indexer.env
    owner: root
    group: "{{ morphit_service_group }}"
    mode: '0640'
  notify: Restart morphit-indexer

- name: Deploy relay env file
  ansible.builtin.template:
    src: relay.env.j2
    dest: /etc/morphit/relay.env
    owner: root
    group: "{{ morphit_service_group }}"
    mode: '0640'
  notify: Restart morphit-relay

- name: Deploy backup env file
  ansible.builtin.template:
    src: backup.env.j2
    dest: /etc/morphit/backup.env
    owner: root
    group: "{{ morphit_service_group }}"
    mode: '0640'

# cp631 — register-by-hand env layout.  `sudo morphit-ops register` (plus edit /
# doctor) read {{ morphit_repo_path }}/morphit.config.env + morphit.env through
# loadInstanceEnv — NOT the per-service /etc/morphit/*.env the systemd units use.
# Without these two files a manual register after a grandma install could not
# find its identity vars (instance name / public origin / operator tag, and the
# relay account + active-key path).  Writing them here makes `register` work the
# same for VPS-over-SSH, a local raspi / old laptop, and register-by-hand.
# cp663 #14 — Tor + i2pd run AFTER this role (playbook order), so the
# post_tasks capture writes the .onion + .b32.i2p into morphit.config.env only
# AFTER this template first renders them empty.  On a re-converge this template
# would clobber them, so read the current values back first and feed them to
# the template (it emits the lines only when non-empty).  First install: no
# file yet -> both stay empty and the capture step fills them.
- name: Read existing onion address from morphit.config.env (preserve on re-converge)
  ansible.builtin.shell:
    cmd: "grep -E '^MORPHIT_INSTANCE_TOR_ADDRESS=' {{ morphit_repo_path }}/morphit.config.env 2>/dev/null | tail -1 | cut -d= -f2-"
  register: morphit_existing_onion
  changed_when: false
  failed_when: false

- name: Read existing i2p b32 address from morphit.config.env (preserve on re-converge)
  ansible.builtin.shell:
    cmd: "grep -E '^MORPHIT_INSTANCE_I2P_B32_ADDRESS=' {{ morphit_repo_path }}/morphit.config.env 2>/dev/null | tail -1 | cut -d= -f2-"
  register: morphit_existing_i2p
  changed_when: false
  failed_when: false

- name: Preserve current tor/i2p addresses (default empty on first install)
  ansible.builtin.set_fact:
    morphit_instance_tor_address: "{{ morphit_existing_onion.stdout | trim if (morphit_existing_onion.stdout | default('') | trim | length > 0) else (morphit_instance_tor_address | default('')) }}"
    morphit_instance_i2p_b32_address: "{{ morphit_existing_i2p.stdout | trim if (morphit_existing_i2p.stdout | default('') | trim | length > 0) else (morphit_instance_i2p_b32_address | default('')) }}"

- name: Deploy operator-config env for register-by-hand (allowlisted identity vars)
  ansible.builtin.template:
    src: morphit.config.env.j2
    dest: "{{ morphit_repo_path }}/morphit.config.env"
    owner: root
    group: "{{ morphit_service_group }}"
    mode: '0640'

- name: Deploy infra env for register-by-hand (relay account + active-key path)
  ansible.builtin.template:
    src: morphit.env.j2
    dest: "{{ morphit_repo_path }}/morphit.env"
    owner: root
    group: "{{ morphit_service_group }}"
    mode: '0640'

# cp514 — the shipped unit's ExecStart is a HARDCODED
# /usr/local/lib/morphit/morphit-backup.sh (deliberately decoupled from
# wherever the operator checked out the repo).  This role used to drop the
# script in /usr/local/bin instead, so systemd could not find it and every
# Ansible-provisioned node's backup died 203/EXEC — silently, nightly.  The
# path now matches the unit, OPERATIONS.md and the init wizard; a parity
# smoke pins all four together.
- name: Ensure /usr/local/lib/morphit exists (backup script install dir)
  ansible.builtin.file:
    path: /usr/local/lib/morphit
    state: directory
    owner: root
    group: root
    mode: '0755'

- name: Deploy morphit-backup.sh
  ansible.builtin.copy:
    src: "{{ morphit_repo_path }}/ops/backup/morphit-backup.sh"
    dest: /usr/local/lib/morphit/morphit-backup.sh
    remote_src: true
    owner: root
    group: root
    mode: '0755'

# The backup DATA dir must EXIST before morphit-backup.service runs: the unit's
# ProtectSystem=strict + ReadWritePaths=<dir> builds a mount namespace BEFORE
# ExecStart, and a missing path fails that setup with 226/NAMESPACE — the script
# (which would mkdir it) never even runs. Create it here, owned by the service
# user, so the very first backup succeeds on a fresh node.
- name: Ensure the backup directory exists (systemd ReadWritePaths needs it)
  ansible.builtin.file:
    path: "{{ morphit_service_home }}/backups"
    state: directory
    owner: "{{ morphit_service_user }}"
    group: "{{ morphit_service_group }}"
    mode: '0700'

# ── first-online: the deferred-completion subsystem ──
# Finishes the network-dependent tail of the install (real TLS cert, Blurt RPC
# connect, opt-in on-chain registration) the moment this box first sees the
# internet — so a node installed offline, in a bad-connectivity area, still
# provisions itself unattended when a link appears.
- name: Deploy morphit-first-online.sh
  ansible.builtin.copy:
    src: "{{ morphit_repo_path }}/ops/first-online/morphit-first-online.sh"
    dest: /usr/local/lib/morphit/morphit-first-online.sh
    remote_src: true
    owner: root
    group: root
    mode: '0755'

- name: Deploy first-online env (domain + acme email + auto-register opt-in)
  ansible.builtin.template:
    src: first-online.env.j2
    dest: /etc/morphit/first-online.env
    owner: root
    group: root
    mode: '0644'

- name: Ensure the first-online state directory exists
  ansible.builtin.file:
    path: /var/lib/morphit/first-online
    state: directory
    owner: root
    group: root
    mode: '0755'

# cp514 — on a containerized Postgres the backup dumps THROUGH
# `docker exec <container> pg_dump`, and the unit runs as
# {{ morphit_service_user }}.  Without docker-group membership the script
# loud-fails and the node has no backups at all — and this role's OWN
# bunkerweb path provisions exactly that topology.  Docker-group membership
# is root-equivalent, so it is granted ONLY when a container is configured.
- name: Allow the morphit service user to reach docker (containerized DB only)
  ansible.builtin.user:
    name: "{{ morphit_service_user }}"
    groups: docker
    append: true
  when: morphit_db_container | default('') | length > 0

- name: Install systemd unit files from repo
  ansible.builtin.copy:
    src: "{{ morphit_repo_path }}/ops/systemd/{{ item }}"
    dest: /etc/systemd/system/{{ item }}
    remote_src: true
    owner: root
    group: root
    mode: '0644'
  loop:
    - morphit-indexer.service
    - morphit-relay.service
    - morphit-backup.service
    - morphit-backup.timer
    - morphit-first-online.service
    - morphit-first-online.timer
  notify: Reload systemd

- name: Ensure morphit-backup.timer drop-in directory exists
  # Found at cp52 deep-deep on ansible playbook readiness: writing
  # to /etc/systemd/system/morphit-backup.timer.d/schedule.conf
  # without first creating the .d/ drop-in directory would cause
  # the next task's `ansible.builtin.copy` to fail.  Systemd does
  # NOT auto-create unit drop-in directories — only the unit files
  # themselves are auto-installed under /etc/systemd/system/.
  ansible.builtin.file:
    path: /etc/systemd/system/morphit-backup.timer.d
    state: directory
    owner: root
    group: root
    mode: '0755'

- name: Deploy backup-timer OnCalendar override
  ansible.builtin.copy:
    dest: /etc/systemd/system/morphit-backup.timer.d/schedule.conf
    owner: root
    group: root
    mode: '0644'
    content: |
      # Managed by Ansible — overrides repo's default schedule.
      [Timer]
      OnCalendar=
      OnCalendar={{ morphit_backup_schedule }}
  notify: Reload systemd

- name: Ensure morphit-backup.service drop-in directory exists
  ansible.builtin.file:
    path: /etc/systemd/system/morphit-backup.service.d
    state: directory
    owner: root
    group: root
    mode: '0755'

- name: Point the backup service's writable path at the ACTUAL backup dir
  # The shipped unit hardcodes ReadWritePaths=/home/morphit/backups (the
  # manual-install home). This Ansible install uses morphit_service_home
  # (/var/lib/morphit), so without this drop-in the service's mount namespace
  # binds a path that doesn't exist → 226/NAMESPACE and the backup never runs.
  # The empty ReadWritePaths= first RESETS the shipped default (so the missing
  # /home/morphit/backups is no longer required), then we add the real one.
  ansible.builtin.copy:
    dest: /etc/systemd/system/morphit-backup.service.d/paths.conf
    owner: root
    group: root
    mode: '0644'
    content: |
      # Managed by Ansible — aligns ReadWritePaths with BACKUP_DIR.
      [Service]
      ReadWritePaths=
      ReadWritePaths={{ morphit_service_home }}/backups
  notify: Reload systemd

- name: Enable + start morphit-indexer
  ansible.builtin.systemd:
    name: morphit-indexer
    enabled: true
    state: started
    daemon_reload: true

- name: Enable + start morphit-relay
  ansible.builtin.systemd:
    name: morphit-relay
    enabled: true
    state: started
    daemon_reload: true

- name: Enable morphit-backup.timer (daily backup per §31)
  # daemon_reload ensures the ReadWritePaths drop-in above is loaded before the
  # timer's OnActiveSec first run. That run then produces a real dump a couple of
  # minutes after this enable — once Postgres has settled — instead of racing DB
  # readiness at install time.
  ansible.builtin.systemd:
    name: morphit-backup.timer
    enabled: true
    state: started
    daemon_reload: true

- name: Clear any stale failed state on morphit-backup.service (idempotent)
  # If a previous run/attempt left the service failed, clear it so health reads
  # cleanly; the OnActiveSec first run then produces the real dump.
  ansible.builtin.command: systemctl reset-failed morphit-backup.service
  changed_when: false

- name: Wait for the indexer HTTP port (schema is migrated by the time it listens)
  # The first backup should capture a real schema, not race DB readiness. Once the
  # indexer is listening it has already run its migrations, so a dump now is
  # meaningful. Best-effort: a slow indexer must not fail the whole install — the
  # timer's OnActiveSec=2min is the safety net.
  ansible.builtin.wait_for:
    host: 127.0.0.1
    port: "{{ morphit_indexer_port | default(8081) }}"
    timeout: 120
  failed_when: false

- name: Take the first DB backup now, retrying until the schema has migrated
  # Without this, a fresh node's first dump waits on the timer's OnActiveSec +
  # RandomizedDelaySec (up to ~32 min), so the operator sees "no backup yet" long
  # after install. We trigger it explicitly — but on a fresh node the indexer can
  # take a couple of minutes to finish migrations (slow first PG connection; no
  # network to help an offline install settle). The backup script correctly SKIPS
  # a not-yet-migrated (schemaless) DB rather than banking a useless fragment, so
  # a single early trigger writes nothing. Loop until a REAL dump lands (or give
  # up after ~5min — the daily timer is the final safety net). Idempotent.
  ansible.builtin.shell: |
    systemctl start morphit-backup.service
    ls {{ morphit_service_home }}/backups/*.sql.gz >/dev/null 2>&1
  args:
    executable: /bin/bash
  register: morphit_first_backup
  until: morphit_first_backup.rc == 0
  retries: 20
  delay: 15
  changed_when: true
  failed_when: false

# first-online: enable the service so it fires the moment the box next reaches
# network-online.target, and start the timer so it also retries on a cadence
# (and takes a first shot right away — if the installer HAS internet, the box
# finishes its TLS/RPC/registration immediately; if not, it keeps trying).  We
# enable-but-don't-start the service so the install itself never blocks on
# certbot/registration.
- name: Enable morphit-first-online.service (fires when the box next sees the network)
  ansible.builtin.systemd:
    name: morphit-first-online.service
    enabled: true
    daemon_reload: true

- name: Enable + start morphit-first-online.timer (retries until deferred steps finish)
  ansible.builtin.systemd:
    name: morphit-first-online.timer
    enabled: true
    state: started

# ─── Web Push — VAPID keypair (generate-once, §46) ──────────────
# Web push is a relay feature gated on a VAPID keypair (RFC 8292).
# Generate it ONCE into /etc/morphit/relay-vapid.env, which the
# relay unit sources if present.  `creates:` makes this idempotent:
# the keypair is NEVER regenerated on a re-converge, because rotating
# the public key invalidates every existing push subscription.  ON by
# default (morphit_enable_web_push).
- name: Ensure /etc/morphit exists
  ansible.builtin.file:
    path: /etc/morphit
    state: directory
  when: morphit_enable_web_push | bool

- name: Generate Web Push VAPID keypair (once)
  ansible.builtin.shell:
    cmd: >-
      bash {{ morphit_repo_path }}/scripts/generate-vapid-keys.sh
      --bare --subject {{ morphit_vapid_subject | quote }}
      > /etc/morphit/relay-vapid.env
    creates: /etc/morphit/relay-vapid.env
  when: morphit_enable_web_push | bool
  notify: Restart morphit-relay

- name: Lock down the VAPID env file (holds the private key)
  ansible.builtin.file:
    path: /etc/morphit/relay-vapid.env
    owner: root
    group: "{{ morphit_service_group }}"
    mode: '0640'
  when: morphit_enable_web_push | bool

# cp663 #4 — the relay unit runs User=root with an EMPTY CapabilityBoundingSet
# (no DAC_OVERRIDE), so root can read the keystore ONLY via the owner bit.  The
# wizard writes the keystore before this run; if it ran as a non-root service
# user the file is unreadable by the relay (EACCES).  Force root:root here as
# the guarantee (the wizard also attempts it).
- name: Check the relay keystore exists
  ansible.builtin.stat:
    path: "{{ morphit_relay_keystore_path }}"
  register: morphit_keystore_stat
  when: morphit_relay_keystore_path is defined

- name: Lock down the relay keystore (root-only — the relay unit drops DAC_OVERRIDE)
  ansible.builtin.file:
    path: "{{ morphit_relay_keystore_path }}"
    owner: root
    group: root
    mode: '0600'
  when:
    - morphit_relay_keystore_path is defined
    - morphit_keystore_stat.stat.exists | default(false)

# ─── MCP server — isolated deploy + enable (§45) ────────────────
# MCP runs ISOLATED on purpose: its own low-privilege user from its
# own directory (/opt/morphit-mcp) with ReadOnlyPaths locked, so the
# MCP process CANNOT read the main install's DB password or relay
# keys.  We deploy it as a self-contained tree (the two pure
# @morphit/* workspace deps are vendored by deploy-mcp.sh), install
# the unit, and enable+start it.  ALL gated on morphit_mcp_enabled
# (default true): set it false to skip the deploy + service entirely,
# or disable at runtime with `morphit-ops mcp`.
- name: Create morphit-mcp group
  ansible.builtin.group:
    name: morphit-mcp
    system: true
  when: morphit_mcp_enabled | bool

- name: Create morphit-mcp service user (no login, isolated)
  ansible.builtin.user:
    name: morphit-mcp
    group: morphit-mcp
    system: true
    shell: /usr/sbin/nologin
    home: /opt/morphit-mcp
    create_home: false
  when: morphit_mcp_enabled | bool

- name: Ensure /opt/morphit-mcp exists (owned by the service user)
  ansible.builtin.file:
    path: /opt/morphit-mcp
    state: directory
    owner: morphit-mcp
    group: morphit-mcp
    mode: '0750'
  when: morphit_mcp_enabled | bool

- name: Deploy MCP env file (points the MCP at THIS instance, not morphit.io)
  ansible.builtin.template:
    src: mcp.env.j2
    dest: /etc/morphit/mcp.env
    owner: root
    group: root
    mode: '0644'
  when: morphit_mcp_enabled | bool
  notify: Restart morphit-mcp

- name: Deploy morphit-mcp as a self-contained tree
  ansible.builtin.command:
    cmd: >-
      bash {{ morphit_repo_path }}/ops/scripts/deploy-mcp.sh
      {{ morphit_repo_path }} /opt/morphit-mcp morphit-mcp
  register: morphit_mcp_deploy
  changed_when: "'deployed to' in morphit_mcp_deploy.stdout"
  when: morphit_mcp_enabled | bool
  notify: Restart morphit-mcp

- name: Install morphit-mcp.service unit
  ansible.builtin.copy:
    src: "{{ morphit_repo_path }}/ops/systemd/morphit-mcp.service"
    dest: /etc/systemd/system/morphit-mcp.service
    remote_src: true
    owner: root
    group: root
    mode: '0644'
  when: morphit_mcp_enabled | bool
  notify: Reload systemd

- name: Enable + start morphit-mcp
  ansible.builtin.systemd:
    name: morphit-mcp
    enabled: true
    state: started
    daemon_reload: true
  when: morphit_mcp_enabled | bool
