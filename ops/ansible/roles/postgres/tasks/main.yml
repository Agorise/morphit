# Role: postgres
#
# Install Postgres, bind to loopback only (§37.8), provision the
# morphit_indexer database and user (the relay uses the same ones) and
# give that role its session defaults.  The schema comes from the
# indexer's own migrations when it starts, not from here.
#
# Uses the Ubuntu-shipped postgresql package (Ubuntu 24.04 ships
# PG 16 by default).

---
- name: Install PostgreSQL + Python adapter
  ansible.builtin.apt:
    name:
      - postgresql
      - postgresql-contrib
      - python3-psycopg2
    state: present
    update_cache: true

# The version-dir expressions below read `ansible_facts.packages` to find the
# Ubuntu-shipped /etc/postgresql/<major>/main directory.  Normal fact-gathering
# does NOT populate `ansible_facts.packages` — only package_facts does — so
# WITHOUT this task every one of those expressions (including its own
# `'postgresql' in ansible_facts.packages` guard) raised
# "object of type 'dict' has no attribute 'packages'" and the install died the
# moment it reached postgres..
- name: Gather installed-package facts (populates ansible_facts.packages)
  ansible.builtin.package_facts:
    manager: auto

- name: Ensure postgresql listens on loopback only
  ansible.builtin.lineinfile:
    path: /etc/postgresql/{{ postgres_version_dir }}/main/postgresql.conf
    regexp: "^#?listen_addresses\\s*="
    line: "listen_addresses = '{{ postgres_listen_addresses }}'"
  vars:
    # Detect the Ubuntu-shipped version dir
    postgres_version_dir: "{{ ansible_facts.packages['postgresql'][0].version.split('+')[0].split('.')[0] if 'postgresql' in ansible_facts.packages else '16' }}"
  notify: Restart postgresql

- name: Ensure postgresql port is the configured one
  ansible.builtin.lineinfile:
    path: /etc/postgresql/{{ postgres_version_dir }}/main/postgresql.conf
    regexp: "^#?port\\s*="
    line: "port = {{ postgres_port }}"
  vars:
    postgres_version_dir: "{{ ansible_facts.packages['postgresql'][0].version.split('+')[0].split('.')[0] if 'postgresql' in ansible_facts.packages else '16' }}"
  notify: Restart postgresql

- name: Remove the permissive host-all-all loopback rule (hardening)
  # We do NOT want a blanket "any user, any DB over 127.0.0.1" rule. But we MUST
  # still let the ONE user the indexer + relay use in (both connect via
  # localhost:PORT = loopback TCP, sharing the morphit_indexer DB/user) — the
  # scoped rule below does exactly that. previously this task removed the
  # blanket rule and added NOTHING, so the indexer's TCP login had no matching
  # pg_hba entry and died with 'no pg_hba.conf entry for host "127.0.0.1"' the
  # first time Postgres reloaded pg_hba.conf (i.e. the next restart/reboot).
  ansible.builtin.lineinfile:
    path: /etc/postgresql/{{ postgres_version_dir }}/main/pg_hba.conf
    regexp: '^host\s+all\s+all\s+'
    state: absent
  vars:
    postgres_version_dir: "{{ ansible_facts.packages['postgresql'][0].version.split('+')[0].split('.')[0] if 'postgresql' in ansible_facts.packages else '16' }}"
  notify: Restart postgresql

- name: Allow ONLY the morphit_indexer user in over loopback TCP (indexer + relay)
  # scram-sha-256 matches the password encoding the postgresql_user task writes on
  # PG 14+ (Ubuntu 24 ships PG 16). Both IPv4 and IPv6 loopback are covered because
  # `localhost` in the DATABASE_URL can resolve to either 127.0.0.1 or ::1.
  ansible.builtin.lineinfile:
    path: /etc/postgresql/{{ postgres_version_dir }}/main/pg_hba.conf
    line: "{{ item }}"
    insertafter: EOF
    state: present
  loop:
    - "host    {{ postgres_indexer_db }}    {{ postgres_indexer_user }}    127.0.0.1/32    scram-sha-256"
    - "host    {{ postgres_indexer_db }}    {{ postgres_indexer_user }}    ::1/128    scram-sha-256"
  vars:
    postgres_version_dir: "{{ ansible_facts.packages['postgresql'][0].version.split('+')[0].split('.')[0] if 'postgresql' in ansible_facts.packages else '16' }}"
  notify: Restart postgresql

- name: Enable + start PostgreSQL
  ansible.builtin.systemd:
    name: postgresql
    enabled: true
    state: started

- name: Create morphit_indexer user
  community.postgresql.postgresql_user:
    name: "{{ postgres_indexer_user }}"
    password: "{{ postgres_indexer_password }}"
    role_attr_flags: NOSUPERUSER,NOCREATEROLE,NOCREATEDB
    state: present
  become: true
  become_user: postgres

# The relay and indexer SHARE this database and role: the relay's tables are
# part of the indexer's single migration set.

- name: Create morphit_indexer database
  community.postgresql.postgresql_db:
    name: "{{ postgres_indexer_db }}"
    owner: "{{ postgres_indexer_user }}"
    encoding: UTF8
    lc_collate: en_US.UTF-8
    lc_ctype: en_US.UTF-8
    template: template0
    state: present
  become: true
  become_user: postgres

- name: Give the indexer role its session defaults (JIT off, idle-transaction cap)
  # JIT compiled the featured-strip query on an inflated row estimate: ~2 s
  # of CPU per request for a query that runs in under a millisecond.  A
  # connection left inside an open transaction is closed after 5 minutes
  # instead of holding its locks and a pool slot.  The indexer asks for both
  # (and tighter limits for its API) on its own connections; these defaults
  # cover the relay, which logs in as the same role, and any script.
  # (ops/postgres/init.sql, a manual install's script, is not run here: it
  # creates the role and database, which the tasks above already did.)
  ansible.builtin.shell:
    cmd: |
      set -eu
      want="jit=off idle_in_transaction_session_timeout=300s"
      have=$(psql -X -At -d postgres -c "SELECT array_to_string(setconfig, ' ') FROM pg_db_role_setting WHERE setdatabase = 0 AND setrole = '{{ postgres_indexer_user }}'::regrole")
      missing=""
      for kv in $want; do
        case " $have " in *" $kv "*) ;; *) missing="$missing $kv" ;; esac
      done
      [ -z "$missing" ] && { echo unchanged; exit 0; }
      for kv in $missing; do
        psql -X -v ON_ERROR_STOP=1 -d postgres -c "ALTER ROLE \"{{ postgres_indexer_user }}\" SET ${kv%%=*} = '${kv#*=}'"
      done
      echo "set:$missing"
  become: true
  become_user: postgres
  register: morphit_pg_role_defaults
  changed_when: "'set:' in morphit_pg_role_defaults.stdout"

- name: Read the indexer role's defaults back
  ansible.builtin.command:
    cmd: >-
      psql -X -At -d postgres -c "SELECT array_to_string(setconfig, ' ')
      FROM pg_db_role_setting WHERE setdatabase = 0
      AND setrole = '{{ postgres_indexer_user }}'::regrole"
  become: true
  become_user: postgres
  register: morphit_pg_role_defaults_now
  changed_when: false
  failed_when: >-
    'jit=off' not in morphit_pg_role_defaults_now.stdout.split(' ')
    or 'idle_in_transaction_session_timeout=300s' not in morphit_pg_role_defaults_now.stdout.split(' ')
