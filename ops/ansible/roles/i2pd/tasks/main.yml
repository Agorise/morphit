---
- name: Add the purplei2p PPA for a current i2pd (online installs)
  # The Ubuntu distro i2pd (2.49.0) crash-loops on startup (corrupt-netDb SIGABRT
  # loop — see REVISIT); the maintained purplei2p build (2.61.0+) is stable. An
  # OFFLINE install skips this and gets the current i2pd from the vendored bundle
  # instead (build-offline-bundle.sh downloads it from this same PPA).
  when: not morphit_offline_install | default(false)
  block:
    - name: Ensure add-apt-repository is available (for the PPA)
      ansible.builtin.apt:
        name: software-properties-common
        state: present
        update_cache: true
        cache_valid_time: 3600

    - name: Add ppa:purplei2p/i2pd
      ansible.builtin.apt_repository:
        repo: ppa:purplei2p/i2pd
        filename: purplei2p-i2pd
        state: present
        update_cache: true

- name: Install i2pd (current build — from the PPA online, or the bundle offline)
  # state=latest is deliberate here: it UPGRADES a pre-existing broken distro
  # 2.49.0 to the maintained build. i2pd is the I2P transport for hidden RPC and
  # a stale one crash-loops, so "newest available" is exactly what we want.
  ansible.builtin.apt:  # noqa: package-latest
    name: i2pd
    state: latest
    update_cache: true
    cache_valid_time: 3600
  notify: Restart i2pd

- name: Check whether the server already has an operable keyfile (to preserve it)
  ansible.builtin.stat:
    path: "{{ morphit_i2pd_datadir }}/{{ morphit_i2pd_keyfile }}"
  register: morphit_i2pd_dest_key_stat

- name: Check for a wizard-generated keyfile on the control node
  ansible.builtin.stat:
    path: "{{ morphit_i2pd_key_src }}/{{ morphit_i2pd_keyfile }}"
  delegate_to: localhost
  become: false
  register: morphit_i2pd_key_stat
  when: morphit_i2pd_key_src | length > 0

# Install the wizard keyfile ONLY when the server has none — Ken's rule: an
# existing operable b32 is preserved, never regenerated/overwritten.
- name: Install the wizard-generated keyfile (serve the advertised address)
  ansible.builtin.copy:
    src: "{{ morphit_i2pd_key_src }}/{{ morphit_i2pd_keyfile }}"
    dest: "{{ morphit_i2pd_datadir }}/{{ morphit_i2pd_keyfile }}"
    owner: "{{ morphit_i2pd_user }}"
    group: "{{ morphit_i2pd_user }}"
    mode: "0600"
  when:
    - morphit_i2pd_key_src | length > 0
    - morphit_i2pd_key_stat.stat.exists | default(false)
    - not (morphit_i2pd_dest_key_stat.stat.exists | default(false))
  notify: Restart i2pd

- name: Note that i2pd will create its own .b32.i2p address (fresh install, no pre-seeded key)
  ansible.builtin.debug:
    msg: >-
      i2pd will create its own .b32.i2p address the first time it starts —
      that's expected on a fresh install. It appears once i2pd has finished
      building its tunnels (give it a few minutes), and  sudo morphit-ops
      shows it.
  when: >-
    not (morphit_i2pd_dest_key_stat.stat.exists | default(false))
    and (morphit_i2pd_key_src | length == 0
         or not (morphit_i2pd_key_stat.stat.exists | default(false)))

- name: Configure the morphit server tunnel in i2pd tunnels.conf
  ansible.builtin.blockinfile:
    path: "{{ morphit_i2pd_tunnels_conf }}"
    marker: "# {mark} MORPHIT SERVER TUNNEL (managed by Ansible)"
    block: |
      [morphit-web]
      type = http
      host = {{ morphit_i2pd_local_host }}
      port = {{ morphit_i2pd_local_port }}
      signaturetype = 7
      keys = {{ morphit_i2pd_keyfile }}
    create: true
    owner: root
    group: root
    mode: "0644"
  notify: Restart i2pd

- name: Ensure the i2pd systemd drop-in directory exists
  ansible.builtin.file:
    path: /etc/systemd/system/i2pd.service.d
    state: directory
    owner: root
    group: root
    mode: "0755"

- name: Install a restart-policy drop-in for i2pd (self-heal transient crashes)
  # i2pd is the I2P transport for hidden RPC. A crash (e.g. a first-run reseed
  # abort) must not silently take the hidden layer down — restart it, with a
  # bounded retry budget so a PERSISTENT failure slow-retries rather than
  # busy-loops. When it's down, the RPC card shows a calm "requires Tor/I2P"
  # rather than a red error (transport_off).
  ansible.builtin.copy:
    dest: /etc/systemd/system/i2pd.service.d/restart.conf
    content: |
      # Managed by Morphit Ansible — do not edit by hand.
      [Unit]
      StartLimitIntervalSec=300
      StartLimitBurst=10
      [Service]
      Restart=on-failure
      RestartSec=10
    owner: root
    group: root
    mode: "0644"
  notify: Restart i2pd

- name: Ensure i2pd is enabled and running
  ansible.builtin.systemd:
    name: i2pd
    state: started
    enabled: true
    daemon_reload: true
