---
# i2pd is the I2P transport for hidden-service RPC and for reaching this instance
# from censored networks — so it has to install reliably exactly where the
# network is most hostile.  Order of preference, most robust first:
#
#   1. the bundled purplei2p .deb (an offline appliance, OR any box that carries
#      the offline bundle) — no PPA, no keyserver, no Launchpad.  This is the
#      censored-network path: keyserver.ubuntu.com and launchpad.net are commonly
#      blocked, and the deprecated `apt-key --recv-keys` the PPA add uses fails
#      outright there, so we never go near them when the .deb is already on disk.
#   2. the purplei2p PPA (online, no bundle).  The distro i2pd 2.49.0 crash-loops
#      on startup (see REVISIT), so the maintained PPA build is preferred.  This
#      path is non-fatal: if the PPA or its signing key can't be reached, we fall
#      back to the distribution's own i2pd rather than stopping the whole install
#      with a wall of red.

- name: Detect a bundled purplei2p i2pd .deb (offline appliance / bundle-carrying box)
  ansible.builtin.find:
    paths: "{{ morphit_local_source_path }}/vendor/apt"
    patterns: "i2pd_*.deb"
  register: morphit_i2pd_bundled_deb
  failed_when: false

- name: Install i2pd from the bundled .deb (no PPA, no keyserver — censored-network safe)
  # apt resolves the .deb's own dependencies from whatever sources are active
  # (the online mirrors when online, or the vendor-redirected bundle when
  # air-gapped), so this one path covers both.  This is the path the operator (and any
  # operator on a filtered connection who downloaded the offline tarball) takes.
  ansible.builtin.apt:
    deb: "{{ morphit_i2pd_bundled_deb.files | map(attribute='path') | list | sort | first }}"
    state: present
  when: (morphit_i2pd_bundled_deb.files | default([]) | length) > 0
  notify: Restart i2pd

- name: Install a current i2pd from the purplei2p PPA (online, no bundle present)
  when: (morphit_i2pd_bundled_deb.files | default([]) | length) == 0
  block:
    - name: Ensure add-apt-repository is available (for the PPA)
      ansible.builtin.apt:
        name: software-properties-common
        state: present
        update_cache: true
        cache_valid_time: 3600

    - name: Add ppa:purplei2p/i2pd
      # Retry the PPA add: it fetches the repo signing key from a keyserver, which
      # is often slow or intermittently blocked on filtered networks. A few
      # retries clears the transient case before we fall through to the distro
      # i2pd in the rescue below.
      ansible.builtin.apt_repository:
        repo: ppa:purplei2p/i2pd
        filename: purplei2p-i2pd
        state: present
        update_cache: true
      register: morphit_i2pd_ppa_add
      until: morphit_i2pd_ppa_add is success
      retries: 3
      delay: 5

    - name: Install i2pd (maintained build from the PPA)
      # state=latest is deliberate: it UPGRADES a pre-existing broken distro
      # 2.49.0 to the maintained build.
      ansible.builtin.apt:  # noqa: package-latest
        name: i2pd
        state: latest
        update_cache: true
        cache_valid_time: 3600
      notify: Restart i2pd
  rescue:
    - name: Couldn't reach the purplei2p PPA — falling back to the distribution's i2pd
      ansible.builtin.debug:
        msg: >-
          Couldn't reach the purplei2p PPA or its signing key. This is normal on a
          filtered or censored network that blocks launchpad.net or
          keyserver.ubuntu.com — nothing is wrong with your server. Installing the
          i2pd that ships in the distribution instead. (For the newest, most
          stable i2pd on a network like this, install from the offline bundle,
          which carries it — see docs/RUN-A-MORPHIT-NODE.md.)

    - name: Install i2pd from the distribution (Ubuntu universe — reachable where the PPA isn't)
      ansible.builtin.apt:
        name: i2pd
        state: present
        update_cache: true
        cache_valid_time: 3600
      notify: Restart i2pd

- name: Check whether the server already has an operable keyfile (to preserve it)
  ansible.builtin.stat:
    path: "{{ morphit_i2pd_datadir }}/{{ morphit_i2pd_keyfile }}"
  register: morphit_i2pd_dest_key_stat

- name: Check for a wizard-generated keyfile on the control node
  ansible.builtin.stat:
    path: "{{ morphit_i2pd_key_src }}/{{ morphit_i2pd_keyfile }}"
  delegate_to: localhost
  become: false
  register: morphit_i2pd_key_stat
  when: morphit_i2pd_key_src | length > 0

# Install the wizard keyfile ONLY when the server has none — the maintainer's rule: an
# existing operable b32 is preserved, never regenerated/overwritten.
- name: Install the wizard-generated keyfile (serve the advertised address)
  ansible.builtin.copy:
    src: "{{ morphit_i2pd_key_src }}/{{ morphit_i2pd_keyfile }}"
    dest: "{{ morphit_i2pd_datadir }}/{{ morphit_i2pd_keyfile }}"
    owner: "{{ morphit_i2pd_user }}"
    group: "{{ morphit_i2pd_user }}"
    mode: "0600"
  when:
    - morphit_i2pd_key_src | length > 0
    - morphit_i2pd_key_stat.stat.exists | default(false)
    - not (morphit_i2pd_dest_key_stat.stat.exists | default(false))
  notify: Restart i2pd

- name: Note that i2pd will create its own .b32.i2p address (fresh install, no pre-seeded key)
  ansible.builtin.debug:
    msg: >-
      i2pd will create its own .b32.i2p address the first time it starts —
      that's expected on a fresh install. It appears once i2pd has finished
      building its tunnels (give it a few minutes), and  sudo morphit-ops
      shows it.
  when: >-
    not (morphit_i2pd_dest_key_stat.stat.exists | default(false))
    and (morphit_i2pd_key_src | length == 0
         or not (morphit_i2pd_key_stat.stat.exists | default(false)))

- name: Configure the morphit server tunnel in i2pd tunnels.conf
  ansible.builtin.blockinfile:
    path: "{{ morphit_i2pd_tunnels_conf }}"
    marker: "# {mark} MORPHIT SERVER TUNNEL (managed by Ansible)"
    block: |
      [morphit-web]
      type = http
      host = {{ morphit_i2pd_local_host }}
      port = {{ morphit_i2pd_local_port }}
      signaturetype = 7
      keys = {{ morphit_i2pd_keyfile }}
    create: true
    owner: root
    group: root
    mode: "0644"
  notify: Restart i2pd

- name: Ensure the i2pd systemd drop-in directory exists
  ansible.builtin.file:
    path: /etc/systemd/system/i2pd.service.d
    state: directory
    owner: root
    group: root
    mode: "0755"

- name: Install a restart-policy drop-in for i2pd (self-heal transient crashes)
  # i2pd is the I2P transport for hidden RPC. A crash (e.g. a first-run reseed
  # abort) must not silently take the hidden layer down — restart it, with a
  # bounded retry budget so a PERSISTENT failure slow-retries rather than
  # busy-loops. When it's down, the RPC card shows a calm "requires Tor/I2P"
  # rather than a red error (transport_off).
  ansible.builtin.copy:
    dest: /etc/systemd/system/i2pd.service.d/restart.conf
    content: |
      # Managed by Morphit Ansible — do not edit by hand.
      [Unit]
      StartLimitIntervalSec=300
      StartLimitBurst=10
      [Service]
      Restart=on-failure
      RestartSec=10
    owner: root
    group: root
    mode: "0644"
  notify: Restart i2pd

- name: Ensure i2pd is enabled and running
  ansible.builtin.systemd:
    name: i2pd
    state: started
    enabled: true
    daemon_reload: true
