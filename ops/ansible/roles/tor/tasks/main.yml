---
- name: Install Tor
  ansible.builtin.apt:
    name: tor
    state: present
    update_cache: true
    cache_valid_time: 3600
  notify: Restart tor

- name: Ensure the hidden-service directory exists (Tor-owned, 0700)
  ansible.builtin.file:
    path: "{{ morphit_tor_hs_dir }}"
    state: directory
    owner: "{{ morphit_tor_user }}"
    group: "{{ morphit_tor_user }}"
    mode: "0700"

- name: Check for wizard-generated onion keys on the control node
  ansible.builtin.stat:
    path: "{{ morphit_tor_key_src }}/hs_ed25519_secret_key"
  delegate_to: localhost
  become: false
  register: morphit_tor_key_stat
  when: morphit_tor_key_src | length > 0

- name: Install the wizard-generated onion keys (serve the advertised address)
  ansible.builtin.copy:
    src: "{{ morphit_tor_key_src }}/{{ item.name }}"
    dest: "{{ morphit_tor_hs_dir }}/{{ item.name }}"
    owner: "{{ morphit_tor_user }}"
    group: "{{ morphit_tor_user }}"
    mode: "{{ item.mode }}"
  loop:
    - { name: hs_ed25519_secret_key, mode: "0600" }
    - { name: hs_ed25519_public_key, mode: "0600" }
    - { name: hostname, mode: "0644" }
  loop_control:
    label: "{{ item.name }}"
  when:
    - morphit_tor_key_src | length > 0
    - morphit_tor_key_stat.stat.exists | default(false)
  notify: Restart tor

- name: Note that Tor will create its own onion address (fresh install, no pre-seeded key)
  ansible.builtin.debug:
    msg: >-
      Tor will create its own .onion address the first time it starts — that's
      expected on a fresh install. Once Tor is up (about a minute), your onion
      address is shown by  sudo morphit-ops  and stored at
      /var/lib/tor/morphit/hostname.
  when: >-
    morphit_tor_key_src | length == 0
    or not (morphit_tor_key_stat.stat.exists | default(false))

- name: Configure the hidden service in torrc
  ansible.builtin.blockinfile:
    path: /etc/tor/torrc
    marker: "# {mark} MORPHIT HIDDEN SERVICE (managed by Ansible)"
    block: |
      HiddenServiceDir {{ morphit_tor_hs_dir }}
      HiddenServicePort 80 {{ morphit_tor_local_host }}:{{ morphit_tor_local_port }}
    create: false
  notify: Restart tor

- name: Ensure the Tor systemd drop-in directory exists
  ansible.builtin.file:
    path: /etc/systemd/system/tor.service.d
    state: directory
    owner: root
    group: root
    mode: "0755"

- name: Install a restart-policy drop-in for Tor (self-heal transient crashes)
  # Tor is the .onion transport for hidden RPC (and serves this node's own
  # onion). A crash must not silently take the hidden layer down.
  ansible.builtin.copy:
    dest: /etc/systemd/system/tor.service.d/restart.conf
    content: |
      # Managed by Morphit Ansible — do not edit by hand.
      [Unit]
      StartLimitIntervalSec=300
      StartLimitBurst=10
      [Service]
      Restart=on-failure
      RestartSec=10
    owner: root
    group: root
    mode: "0644"
  notify: Restart tor

- name: Ensure Tor is enabled and running
  ansible.builtin.systemd:
    name: tor
    state: started
    enabled: true
    daemon_reload: true
