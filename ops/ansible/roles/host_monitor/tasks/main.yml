# roles/host_monitor/tasks/main.yml
#
# Deploy the morphit-host-monitor sidecar (disk/mem/swap/CPU).
#
# Optional variables (all have safe defaults in the script):
#   host_monitor_disk_paths    : space-separated mount points
#                                (default "/").
#   host_monitor_disk_*        : disk thresholds
#   host_monitor_mem_*         : memory thresholds
#   host_monitor_swap_*        : swap thresholds
#   host_monitor_cpu_*         : CPU thresholds
#
# References: docs/OPERATIONS.md §16 "Host-resource monitoring
# sidecar".

---
- name: Create morphit-host-monitor system user
  ansible.builtin.user:
    name: morphit-host-monitor
    system: true
    home: /var/lib/morphit-host-monitor
    create_home: false
    shell: /usr/sbin/nologin

- name: Create host-monitor state directory
  ansible.builtin.file:
    path: /var/lib/morphit-host-monitor
    state: directory
    owner: morphit-host-monitor
    group: morphit-host-monitor
    mode: '0750'

- name: Write host-monitor env file (optional thresholds)
  ansible.builtin.template:
    src: host-monitor.env.j2
    dest: /etc/morphit/host-monitor.env
    owner: root
    group: root
    mode: '0644'
  when:
    - host_monitor_disk_critical is defined or
      host_monitor_mem_critical is defined or
      host_monitor_swap_critical is defined or
      host_monitor_cpu_critical is defined or
      host_monitor_disk_paths is defined
  notify: Restart morphit-host-monitor-timer

- name: Install host-monitor systemd service unit
  ansible.builtin.copy:
    src: /opt/morphit/ops/systemd/morphit-host-monitor.service
    dest: /etc/systemd/system/morphit-host-monitor.service
    owner: root
    group: root
    mode: '0644'
    remote_src: true
  notify: Reload systemd

- name: Install host-monitor systemd timer
  ansible.builtin.copy:
    src: /opt/morphit/ops/systemd/morphit-host-monitor.timer
    dest: /etc/systemd/system/morphit-host-monitor.timer
    owner: root
    group: root
    mode: '0644'
    remote_src: true
  notify: Reload systemd

- name: Enable + start morphit-host-monitor.timer
  ansible.builtin.systemd:
    name: morphit-host-monitor.timer
    enabled: true
    state: started
    daemon_reload: true
