# roles/matrix_bot/tasks/main.yml
#
# Deploy the morphit-matrix-bot sidecar.  Assumes the `morphit`
# role has already cloned the repo to /opt/morphit and run
# `npm ci` (which builds better-sqlite3's native bindings).
#
# Variables (set in group_vars/vault.yml):
#   matrix_bot_homeserver     : e.g. "https://matrix.org"
#   matrix_bot_access_token   : bot-account access token (SECRET)
#   matrix_bot_alert_mxid     : comma-separated MXIDs (one per recipient)
#   matrix_bot_digest_time    : daily digest send time (default 09:00 UTC)
#   matrix_bot_dry_run        : default false (set true for staging)
#   matrix_bot_extra_units    : optional comma-separated extra
#                               journalctl units to tail (additive
#                               to the bot's built-in default list)
#
# References: docs/OPERATIONS.md §16 "Canonical Matrix routing".

---
# morphit-ops writes the recipient MXID into the operator config (morphit.config.env)
# and the secret access token into /etc/morphit/matrix-bot.env (0600). On a re-render
# we must PRESERVE both so `morphit-ops matrix` stays the source of truth with no
# hand-editing. The token is read back from the 0600 live env (NOT the 0640
# group-readable config — the token must never be group-readable), the MXID from the
# config. Shell grep, robust across the Ansible floor (2.10+).
- name: Read morphit-ops-managed Matrix creds (MXID from config; token preserved from the 0600 live env)
  ansible.builtin.shell: |
    set -o pipefail
    cfg="{{ morphit_config_env_path | default('/opt/morphit/morphit.config.env') }}"
    live="/etc/morphit/matrix-bot.env"
    mxid=$(grep -E '^MORPHIT_MATRIX_BOT_ALERT_MXID=' "$cfg" 2>/dev/null | tail -1 | cut -d= -f2-)
    tok=$(grep -E '^MORPHIT_MATRIX_BOT_ACCESS_TOKEN=' "$live" 2>/dev/null | tail -1 | cut -d= -f2-)
    printf 'TOKEN=%s\nMXID=%s\n' "$tok" "$mxid"
  args:
    executable: /bin/bash
  register: morphit_cfg_matrix
  changed_when: false
  failed_when: false

- name: Prefer morphit-ops-managed Matrix creds (preserve on re-render) over the vault
  ansible.builtin.set_fact:
    matrix_bot_access_token: "{{ _tok if (_tok | length) > 0 else (matrix_bot_access_token | default('')) }}"
    matrix_bot_alert_mxid: "{{ _mxid if (_mxid | length) > 0 else (matrix_bot_alert_mxid | default('')) }}"
  vars:
    _lines: "{{ morphit_cfg_matrix.stdout_lines | default([]) }}"
    _tok: "{{ (_lines | select('match', '^TOKEN=') | map('regex_replace', '^TOKEN=', '') | first | default('')) | trim }}"
    _mxid: "{{ (_lines | select('match', '^MXID=') | map('regex_replace', '^MXID=', '') | first | default('')) | trim }}"

# A token means the operator wants the bot RUNNING now; without one we still
# install the unit + its deps so it's ready the moment they add a token via
# `morphit-ops matrix` (health then reads "token needed", not "not installed").
- name: Determine whether a bot token was provided
  ansible.builtin.set_fact:
    matrix_bot_has_token: "{{ (matrix_bot_access_token | default('') | length) > 0 }}"

- name: Assert the other matrix-bot vars are set when a token is provided
  ansible.builtin.assert:
    that:
      - matrix_bot_homeserver is defined
      - matrix_bot_alert_mxid is defined
    fail_msg: >
      A matrix-bot access token was provided but
      matrix_bot_homeserver / matrix_bot_alert_mxid is missing.
      Set them in group_vars/vault.yml.
  when: matrix_bot_has_token

- name: Create morphit-matrix-bot system user
  ansible.builtin.user:
    name: morphit-matrix-bot
    system: true
    home: /var/lib/morphit-matrix-bot
    create_home: false
    shell: /usr/sbin/nologin
    groups: systemd-journal
    append: true

- name: Create matrix-bot state directory
  ansible.builtin.file:
    path: /var/lib/morphit-matrix-bot
    state: directory
    owner: morphit-matrix-bot
    group: morphit-matrix-bot
    mode: '0750'

- name: Write matrix-bot env file
  ansible.builtin.template:
    src: matrix-bot.env.j2
    dest: /etc/morphit/matrix-bot.env
    owner: root
    group: morphit-matrix-bot
    mode: '0640'
  notify: Restart morphit-matrix-bot

- name: Install matrix-bot systemd unit
  ansible.builtin.copy:
    src: /opt/morphit/ops/systemd/morphit-matrix-bot.service
    dest: /etc/systemd/system/morphit-matrix-bot.service
    owner: root
    group: root
    mode: '0644'
    remote_src: true
  notify:
    - Reload systemd
    - Restart morphit-matrix-bot

- name: Verify better-sqlite3 native bindings built
  # better-sqlite3 compiles at npm-install time.  If the morphit
  # role's `npm ci` ran while the deploy box couldn't reach
  # nodejs.org, the build silently produces no .node binary and
  # the bot crashes at startup.
  ansible.builtin.stat:
    path: /opt/morphit/node_modules/better-sqlite3/build/Release/better_sqlite3.node
  register: matrix_bot_bs3_build

- name: Verify the better-sqlite3 native binding is present
  ansible.builtin.fail:
    msg: |
      better-sqlite3 native bindings are not built at
      /opt/morphit/node_modules/better-sqlite3/build/Release/.
      The matrix-bot will crash on startup without them.

      Fix on the target host:
        cd /opt/morphit
        sudo -u morphit npm rebuild better-sqlite3

      Common causes:
        - build-essential / python3 not installed
        - outbound HTTPS to nodejs.org sealed off by firewall
        - npm install previously ran with --ignore-scripts

      See docs/OPERATIONS.md §16 "matrix-bot setup" for details.
  when: not matrix_bot_bs3_build.stat.exists

- name: Register the matrix-bot unit (daemon-reload) — always, so it's ready
  ansible.builtin.systemd:
    name: morphit-matrix-bot
    daemon_reload: true

- name: Start + enable morphit-matrix-bot (a token is configured)
  ansible.builtin.systemd:
    name: morphit-matrix-bot
    enabled: true
    state: started
  when: matrix_bot_has_token

- name: Leave matrix-bot installed-but-stopped (no token yet — add it via morphit-ops)
  # The unit + crypto/sqlite deps are in place; it just needs a token. Health
  # reports "token needed", and `morphit-ops matrix` starts it once one is set.
  ansible.builtin.systemd:
    name: morphit-matrix-bot
    enabled: false
    state: stopped
  when: not matrix_bot_has_token
