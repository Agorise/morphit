# roles/smartctl_monitor/tasks/main.yml
#
# Deploy the morphit-smartctl-monitor sidecar (disk SMART
# health).  Needs smartmontools package installed.  Runs as
# root since smartctl needs raw block-device access.
#
# Optional variables:
#   smartctl_temp_critical   : default 60 (°C)
#   smartctl_temp_warn       : default 50 (°C)
#
# References: docs/OPERATIONS.md §16 "Extended monitoring sidecars".

---
- name: Install smartmontools
  ansible.builtin.apt:
    name: smartmontools
    state: present
    update_cache: true
    cache_valid_time: 3600

- name: Write smartctl-monitor env file (optional thresholds)
  ansible.builtin.template:
    src: smartctl-monitor.env.j2
    dest: /etc/morphit/smartctl-monitor.env
    owner: root
    group: root
    mode: '0644'
  when:
    - smartctl_temp_critical is defined or smartctl_temp_warn is defined
  notify: Restart morphit-smartctl-monitor-timer

- name: Install smartctl-monitor systemd service unit
  ansible.builtin.copy:
    src: /opt/morphit/ops/systemd/morphit-smartctl-monitor.service
    dest: /etc/systemd/system/morphit-smartctl-monitor.service
    owner: root
    group: root
    mode: '0644'
    remote_src: true
  notify: Reload systemd

- name: Install smartctl-monitor systemd timer
  ansible.builtin.copy:
    src: /opt/morphit/ops/systemd/morphit-smartctl-monitor.timer
    dest: /etc/systemd/system/morphit-smartctl-monitor.timer
    owner: root
    group: root
    mode: '0644'
    remote_src: true
  notify: Reload systemd

- name: Enable + start morphit-smartctl-monitor.timer
  ansible.builtin.systemd:
    name: morphit-smartctl-monitor.timer
    enabled: true
    state: started
    daemon_reload: true
