# roles/systemd_monitor/tasks/main.yml
#
# Deploy the morphit-systemd-monitor sidecar (watches morphit-*
# unit health + restart loops).
#
# Optional variables:
#   systemd_monitor_restart_threshold : default 10
#   systemd_monitor_extra_watch       : space-separated extra
#                                       unit names to watch
#
# References: docs/OPERATIONS.md §16 "Extended monitoring sidecars".

---
- name: Write systemd-monitor env file (optional)
  ansible.builtin.template:
    src: systemd-monitor.env.j2
    dest: /etc/morphit/systemd-monitor.env
    owner: root
    group: root
    mode: '0644'
  when:
    - systemd_monitor_restart_threshold is defined or
      systemd_monitor_extra_watch is defined
  notify: Restart morphit-systemd-monitor-timer

- name: Install systemd-monitor systemd service unit
  ansible.builtin.copy:
    src: /opt/morphit/ops/systemd/morphit-systemd-monitor.service
    dest: /etc/systemd/system/morphit-systemd-monitor.service
    owner: root
    group: root
    mode: '0644'
    remote_src: true
  notify: Reload systemd

- name: Install systemd-monitor systemd timer
  ansible.builtin.copy:
    src: /opt/morphit/ops/systemd/morphit-systemd-monitor.timer
    dest: /etc/systemd/system/morphit-systemd-monitor.timer
    owner: root
    group: root
    mode: '0644'
    remote_src: true
  notify: Reload systemd

- name: Enable + start morphit-systemd-monitor.timer
  ansible.builtin.systemd:
    name: morphit-systemd-monitor.timer
    enabled: true
    state: started
    daemon_reload: true
