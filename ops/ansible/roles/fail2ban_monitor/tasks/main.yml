# roles/fail2ban_monitor/tasks/main.yml
#
# Deploy the morphit-fail2ban-monitor sidecar.  Assumes fail2ban
# itself is already installed by the `hardening` role.
#
# Optional variables:
#   fail2ban_ban_critical    : default 50 (currently-banned IPs)
#   fail2ban_ban_warn        : default 15
#   fail2ban_per_jail        : dict of {jail_name: {critical: N, warn: M}}
#                              for per-jail overrides.  Useful when
#                              one jail (sshd) is loud and another
#                              (postfix-sasl) is quiet.
#
# References: docs/OPERATIONS.md §16 "Extended monitoring sidecars".

---
- name: Assert fail2ban is installed (from hardening role)
  ansible.builtin.command:
    cmd: which fail2ban-client
  register: f2bclient
  changed_when: false
  failed_when: f2bclient.rc != 0

- name: Create morphit-fail2ban-monitor state directory
  ansible.builtin.file:
    path: /var/lib/morphit-fail2ban-monitor
    state: directory
    owner: root
    group: root
    mode: '0750'

- name: Write fail2ban-monitor env file (optional thresholds)
  ansible.builtin.template:
    src: fail2ban-monitor.env.j2
    dest: /etc/morphit/fail2ban-monitor.env
    owner: root
    group: root
    mode: '0644'
  when:
    - fail2ban_ban_critical is defined or
      fail2ban_ban_warn is defined or
      fail2ban_per_jail is defined
  notify: restart morphit-fail2ban-monitor-timer

- name: Install fail2ban-monitor systemd service unit
  ansible.builtin.copy:
    src: /opt/morphit/ops/systemd/morphit-fail2ban-monitor.service
    dest: /etc/systemd/system/morphit-fail2ban-monitor.service
    owner: root
    group: root
    mode: '0644'
    remote_src: true
  notify: reload systemd

- name: Install fail2ban-monitor systemd timer
  ansible.builtin.copy:
    src: /opt/morphit/ops/systemd/morphit-fail2ban-monitor.timer
    dest: /etc/systemd/system/morphit-fail2ban-monitor.timer
    owner: root
    group: root
    mode: '0644'
    remote_src: true
  notify: reload systemd

- name: Enable + start morphit-fail2ban-monitor.timer
  ansible.builtin.systemd:
    name: morphit-fail2ban-monitor.timer
    enabled: true
    state: started
    daemon_reload: true
