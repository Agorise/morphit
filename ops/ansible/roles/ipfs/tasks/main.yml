---
# Every Morphit instance runs a small Kubo node that pins the signed release.

- name: Create the ipfs group
  ansible.builtin.group:
    name: "{{ morphit_ipfs_group }}"
    system: true

- name: Create the unprivileged ipfs user
  ansible.builtin.user:
    name: "{{ morphit_ipfs_user }}"
    group: "{{ morphit_ipfs_group }}"
    home: "{{ morphit_ipfs_home }}"
    shell: /usr/sbin/nologin
    system: true
    create_home: true

- name: Check the currently-installed Kubo version (idempotent install)
  ansible.builtin.command: ipfs --version
  register: morphit_ipfs_have
  changed_when: false
  failed_when: false

- name: Install Kubo (download + verify + place binary)
  when: morphit_kubo_version | regex_replace('^v', '') not in (morphit_ipfs_have.stdout | default(''))
  block:
    - name: Make a scratch dir for the Kubo download
      ansible.builtin.tempfile:
        state: directory
        suffix: kubo
      register: morphit_kubo_tmp

    - name: Detect a bundled Kubo tarball (offline appliance)
      ansible.builtin.stat:
        path: "{{ morphit_repo_path }}/vendor/kubo/kubo_{{ morphit_kubo_version }}_{{ morphit_kubo_arch }}.tar.gz"
      register: morphit_kubo_vendor

    - name: Use the bundled Kubo tarball (offline — still SHA-512 verified below)
      ansible.builtin.copy:
        src: "{{ morphit_repo_path }}/vendor/kubo/kubo_{{ morphit_kubo_version }}_{{ morphit_kubo_arch }}.tar.gz"
        dest: "{{ morphit_kubo_tmp.path }}/kubo.tar.gz"
        remote_src: true
        mode: "0644"
      when: morphit_kubo_vendor.stat.exists

    - name: Download the Kubo tarball
      ansible.builtin.get_url:
        url: "{{ morphit_kubo_dist_base }}/{{ morphit_kubo_version }}/kubo_{{ morphit_kubo_version }}_{{ morphit_kubo_arch }}.tar.gz"
        dest: "{{ morphit_kubo_tmp.path }}/kubo.tar.gz"
        mode: "0644"
      when: not morphit_kubo_vendor.stat.exists

    - name: Download the official Kubo checksum (used when no explicit pin is set)
      ansible.builtin.get_url:
        url: "{{ morphit_kubo_dist_base }}/{{ morphit_kubo_version }}/kubo_{{ morphit_kubo_version }}_{{ morphit_kubo_arch }}.tar.gz.sha512"
        dest: "{{ morphit_kubo_tmp.path }}/kubo.tar.gz.sha512"
        mode: "0644"
      when: morphit_kubo_sha512 | length == 0

    - name: Compute the download's SHA-512
      ansible.builtin.stat:
        path: "{{ morphit_kubo_tmp.path }}/kubo.tar.gz"
        checksum_algorithm: sha512
        get_checksum: true
      register: morphit_kubo_dl

    - name: Verify against the operator-pinned SHA-512 (strong pin)
      ansible.builtin.assert:
        that:
          - morphit_kubo_dl.stat.checksum | lower == morphit_kubo_sha512 | lower
        fail_msg: >-
          Kubo tarball SHA-512 mismatch — expected the pinned {{ morphit_kubo_sha512 }},
          got {{ morphit_kubo_dl.stat.checksum }}. Refusing to install.
      when: morphit_kubo_sha512 | length > 0

    - name: Verify against the official published SHA-512
      ansible.builtin.assert:
        that:
          - morphit_kubo_dl.stat.checksum | lower
            == (lookup('file', morphit_kubo_tmp.path + '/kubo.tar.gz.sha512') | regex_search('[0-9a-fA-F]{128}')) | lower
        fail_msg: "Kubo tarball did not match its published .sha512 — refusing to install."
      when: morphit_kubo_sha512 | length == 0

    - name: Extract Kubo
      ansible.builtin.unarchive:
        src: "{{ morphit_kubo_tmp.path }}/kubo.tar.gz"
        dest: "{{ morphit_kubo_tmp.path }}"
        remote_src: true

    - name: Install the ipfs binary
      ansible.builtin.copy:
        src: "{{ morphit_kubo_tmp.path }}/kubo/ipfs"
        dest: /usr/local/bin/ipfs
        remote_src: true
        owner: root
        group: root
        mode: "0755"
      notify: Restart ipfs

    - name: Remove the scratch dir
      ansible.builtin.file:
        path: "{{ morphit_kubo_tmp.path }}"
        state: absent

- name: Initialise the Kubo repo (once; applies the low-footprint profile)
  ansible.builtin.command:
    cmd: "ipfs init --profile {{ morphit_ipfs_profile }}"
    creates: "{{ morphit_ipfs_repo }}/config"
  become: true
  become_user: "{{ morphit_ipfs_user }}"
  environment:
    IPFS_PATH: "{{ morphit_ipfs_repo }}"

# Check, then set only what differs, and report THAT as the change. (v1.20.0,
# C12: this used to set every value with changed_when false, so its notify never
# fired and a changed bind waited for some unrelated restart of Kubo.)
- name: Keep the node small — bind API loopback, cap connections, serve-only-pinned
  ansible.builtin.shell:
    cmd: |
      set -eu
      have="$(ipfs config {{ item.key }} 2>/dev/null | tr -d ' \t\r\n"')" || have=""
      want="$(printf '%s' {{ item.value }} | tr -d ' \t\r\n"')"
      if [ "$have" != "$want" ]; then
        ipfs config --json {{ item.key }} {{ item.value }}
        echo CHANGED
      fi
    executable: /bin/sh
  register: morphit_ipfs_small
  become: true
  become_user: "{{ morphit_ipfs_user }}"
  environment:
    IPFS_PATH: "{{ morphit_ipfs_repo }}"
  loop:
    - { key: "Addresses.API", value: "'\"{{ morphit_ipfs_api_addr }}\"'" }
    # Gateway binds loopback by default; when morphit_ipfs_gateway_expose is
    # true it binds all-interfaces so the frontend can reach it over the Docker
    # bridge (see defaults/main.yml). Paired with Gateway.NoFetch below.
    - key: "Addresses.Gateway"
      value: "'\"{{ (morphit_ipfs_gateway_expose | bool) | ternary(morphit_ipfs_gateway_expose_addr, morphit_ipfs_gateway_addr) }}\"'"
    # Serve ONLY content this node has pinned (its own signed release) — a
    # gateway request for any other CID 404s instead of fetching it from the
    # wider IPFS network. This is what makes exposing the gateway over our
    # .onion/.i2p safe (not an open proxy) AND keeps a hidden-only node from
    # ever reaching out to clearnet IPFS peers to satisfy a gateway request.
    - { key: "Gateway.NoFetch", value: "true" }
    - { key: "Swarm.ConnMgr.HighWater", value: "{{ morphit_ipfs_connmgr_high }}" }
    - { key: "Swarm.ConnMgr.LowWater", value: "{{ morphit_ipfs_connmgr_low }}" }
    # A tor-only node takes no part in the public IPFS network (v1.18.0
    # deep-deep, H3): see the privacy task below for the rest of that posture.
    # Setting "auto" here and "none" there on every run would flap the config.
    - key: "Routing.Type"
      value: "'\"{{ (morphit_tor_only | default(false) | bool) | ternary('none', 'auto') }}\"'"
  changed_when: "'CHANGED' in morphit_ipfs_small.stdout"
  notify: Restart ipfs

- name: Ensure /etc/morphit exists (env dir)
  ansible.builtin.file:
    path: /etc/morphit
    state: directory
    owner: root
    group: root
    mode: "0755"

- name: Install /usr/local/lib/morphit (script dir)
  ansible.builtin.file:
    path: /usr/local/lib/morphit
    state: directory
    owner: root
    group: root
    mode: "0755"

- name: Install the release-pinning script
  ansible.builtin.copy:
    src: "{{ playbook_dir }}/../ipfs/morphit-ipfs-pin.sh"
    dest: /usr/local/lib/morphit/morphit-ipfs-pin.sh
    owner: root
    group: root
    mode: "0755"

- name: Install the IPNS-rebroadcast script
  # Re-announces @morphit's on-chain signed IPNS record to the public DHT from
  # this box (no key required), so ipns://<name> stays resolvable as long as ANY
  # instance is alive. The hand-managed path (morphit-ipfs-setup.sh) installs the
  # same script + timer; this wires it for Ansible/wizard installs too.
  ansible.builtin.copy:
    src: "{{ playbook_dir }}/../ipfs/morphit-ipns-rebroadcast.sh"
    dest: /usr/local/lib/morphit/morphit-ipns-rebroadcast.sh
    owner: root
    group: root
    mode: "0755"

- name: Install the Kubo privacy script (one list of settings, shared with morphit-ops upgrade)
  ansible.builtin.copy:
    src: "{{ playbook_dir }}/../ipfs/morphit-ipfs-privacy.sh"
    dest: /usr/local/lib/morphit/morphit-ipfs-privacy.sh
    owner: root
    group: root
    mode: "0755"

# v1.18.0 deep-deep, H3. Every node: Kubo's telemetry off (it POSTs to a third
# party by default). A TOR-ONLY node additionally leaves the public IPFS network
# entirely: no DHT, no bootstrap peers, no swarm listener, no UPnP, no mDNS, no
# AutoConf/AutoTLS phone-home, no provider records, and DNSLink lookups that
# cannot leave the box. It still serves its pinned release by CID from its own
# gateway, which is how hidden-only peers upgrade from it over Tor/I2P. The list
# lives in the script so `morphit-ops upgrade` heals existing nodes with the
# exact same settings. Check first, so a re-run changes (and restarts) nothing.
- name: Check Kubo's privacy settings
  ansible.builtin.command:
    cmd: "sh /usr/local/lib/morphit/morphit-ipfs-privacy.sh check-{{ (morphit_tor_only | default(false) | bool) | ternary('hidden', 'base') }}"
  become: true
  become_user: "{{ morphit_ipfs_user }}"
  environment:
    IPFS_PATH: "{{ morphit_ipfs_repo }}"
  register: morphit_ipfs_privacy_check
  changed_when: false
  failed_when: false

- name: Apply Kubo's privacy settings
  ansible.builtin.command:
    cmd: "sh /usr/local/lib/morphit/morphit-ipfs-privacy.sh apply-{{ (morphit_tor_only | default(false) | bool) | ternary('hidden', 'base') }}"
  become: true
  become_user: "{{ morphit_ipfs_user }}"
  environment:
    IPFS_PATH: "{{ morphit_ipfs_repo }}"
  when: morphit_ipfs_privacy_check.rc != 0
  notify: Restart ipfs

- name: Install the IPFS clean-up script (unpins superseded releases + snapshots)
  # v1.20.0 (C16). A root-owned copy: its weekly unit runs as root. `morphit-ops
  # upgrade` refreshes it (and installs it on nodes that predate it).
  ansible.builtin.copy:
    src: "{{ playbook_dir }}/../ipfs/morphit-ipfs-gc.sh"
    dest: /usr/local/lib/morphit/morphit-ipfs-gc.sh
    owner: root
    group: root
    mode: "0755"

- name: Install the pin service env file
  ansible.builtin.template:
    src: ipfs-pin.env.j2
    dest: /etc/morphit/ipfs-pin.env
    owner: root
    group: "{{ morphit_ipfs_group }}"
    mode: "0640"

- name: Install the Kubo daemon unit
  ansible.builtin.template:
    src: ipfs.service.j2
    dest: /etc/systemd/system/ipfs.service
    owner: root
    group: root
    mode: "0644"
  notify:
    - Reload systemd
    - Restart ipfs

- name: Install the release-pinning + IPNS-rebroadcast services + timers
  ansible.builtin.template:
    src: "{{ item.src }}"
    dest: "/etc/systemd/system/{{ item.dest }}"
    owner: root
    group: root
    mode: "0644"
  loop:
    - { src: "morphit-ipfs-pin.service.j2", dest: "morphit-ipfs-pin.service" }
    - { src: "morphit-ipfs-pin.timer.j2", dest: "morphit-ipfs-pin.timer" }
    - { src: "morphit-ipns-rebroadcast.service.j2", dest: "morphit-ipns-rebroadcast.service" }
    - { src: "morphit-ipns-rebroadcast.timer.j2", dest: "morphit-ipns-rebroadcast.timer" }
  notify: Reload systemd

- name: Flush handlers so the daemon is running before we enable the timer
  ansible.builtin.meta: flush_handlers

- name: Enable + start the Kubo daemon (best-effort — enabled always, started if it can)
  ansible.builtin.systemd:
    name: ipfs
    state: started
    enabled: true
  # Same rationale as the handler: keep it ENABLED so it persists + retries, but
  # don't let an offline-Phase-1 box (no network yet) fail the whole install here.
  register: morphit_ipfs_started
  failed_when: false

- name: Note that IPFS release-hosting is deferred if the daemon isn't up yet
  ansible.builtin.debug:
    msg: >-
      The IPFS (Kubo) daemon didn't start just now — this is expected on an
      offline/first-boot box. It's enabled with Restart=on-failure, so it comes up
      once this machine has network (or on the next reboot); `sudo systemctl status
      ipfs` shows why if it's still down after you're online.
  when: morphit_ipfs_started is failed or (morphit_ipfs_started.status is defined and morphit_ipfs_started.status.ActiveState | default('') != 'active')

- name: Enable + start the release-pinning timer
  ansible.builtin.systemd:
    name: morphit-ipfs-pin.timer
    state: started
    enabled: true

- name: Enable + start the IPNS-rebroadcast timer
  # Same best-effort posture as the daemon: a fresh offline box may not have the
  # DHT reachable yet, but the timer stays enabled and fires once it's online, so
  # ipns://<name> gets re-announced from this instance without operator action.
  ansible.builtin.systemd:
    name: morphit-ipns-rebroadcast.timer
    state: started
    enabled: true
  failed_when: false

# ─── Federation snapshot: mirror (every instance) ────────────────────
# Fast-sync is what gets a brand-new node from an empty database to a live
# orderbook in minutes instead of days, and it depends on one small (~600 kB)
# artifact: the indexer snapshot @morphit anchors on-chain. Until now nothing
# installed a job to keep that artifact reachable from anywhere but the canonical
# box and a few public clearnet IPFS gateways — which made morphit.io a single
# point of failure for every new instance, and made fast-sync impossible for the
# zero-clearnet nodes we most want more of.
#
# This box pins the anchored CID and re-serves it. Serving is free: the frontend
# already proxies /ipfs/, so a pinned snapshot is immediately reachable over this
# instance's clearnet origin AND its .onion AND its .b32.i2p. Mirroring is not a
# trust claim — a newcomer proves every byte against the signed on-chain sha256 —
# so every instance can do it without being vetted.
- name: Install the federation snapshot-mirror systemd service
  ansible.builtin.copy:
    src: "{{ morphit_repo_path | default('/opt/morphit') }}/ops/systemd/morphit-snapshot-mirror.service"
    dest: /etc/systemd/system/morphit-snapshot-mirror.service
    owner: root
    group: root
    mode: '0644'
    remote_src: true
  notify: Reload systemd

- name: Install the federation snapshot-mirror systemd timer
  ansible.builtin.copy:
    src: "{{ morphit_repo_path | default('/opt/morphit') }}/ops/systemd/morphit-snapshot-mirror.timer"
    dest: /etc/systemd/system/morphit-snapshot-mirror.timer
    owner: root
    group: root
    mode: '0644'
    remote_src: true
  notify: Reload systemd

- name: Enable + start the federation snapshot-mirror timer
  # Best-effort, exactly like the pin + rebroadcast timers above: a fresh or
  # offline box has no chain to read yet, but the timer stays enabled and the job
  # self-heals on its next run once the node is online.
  ansible.builtin.systemd:
    name: morphit-snapshot-mirror.timer
    state: started
    enabled: true
    daemon_reload: true
  failed_when: false

# ─── Federation snapshot: publish (canonical publisher only) ─────────
# Only the canonical box EXPORTS its own indexer DB and ANCHORS the result
# on-chain, so there is exactly one signature and no new trust decision for any
# operator to make. Everyone else mirrors the result (above). Off by default:
# an ordinary instance must never start publishing snapshots under its own
# account just because it was installed with defaults.
- name: Install the snapshot-publish systemd service (canonical publisher)
  ansible.builtin.copy:
    src: "{{ morphit_repo_path | default('/opt/morphit') }}/ops/systemd/morphit-snapshot-publish.service"
    dest: /etc/systemd/system/morphit-snapshot-publish.service
    owner: root
    group: root
    mode: '0644'
    remote_src: true
  notify: Reload systemd
  when: morphit_snapshot_publisher | default(false) | bool

- name: Install the snapshot-publish systemd timer (canonical publisher)
  ansible.builtin.copy:
    src: "{{ morphit_repo_path | default('/opt/morphit') }}/ops/systemd/morphit-snapshot-publish.timer"
    dest: /etc/systemd/system/morphit-snapshot-publish.timer
    owner: root
    group: root
    mode: '0644'
    remote_src: true
  notify: Reload systemd
  when: morphit_snapshot_publisher | default(false) | bool

- name: Enable + start the snapshot-publish timer (canonical publisher)
  ansible.builtin.systemd:
    name: morphit-snapshot-publish.timer
    state: started
    enabled: true
    daemon_reload: true
  failed_when: false
  when: morphit_snapshot_publisher | default(false) | bool

# ─── IPFS clean-up (every instance) — v1.20.0, C16 ───────────────────
# Every upgrade adds a ~35 MB release and the publisher adds a snapshot a day;
# nothing let go of the old ones. This weekly job unpins what is superseded —
# keeping the anchored release, the previous one, anything newer and the one
# running; the anchored snapshot, anything newer and two older ones — then
# reclaims the space. It decides from this node's own state (no network), so it
# is the same on a tor-only node. See ops/ipfs/morphit-ipfs-gc.sh.
- name: Install the IPFS clean-up service + weekly timer
  ansible.builtin.copy:
    src: "{{ morphit_repo_path | default('/opt/morphit') }}/ops/systemd/{{ item }}"
    dest: "/etc/systemd/system/{{ item }}"
    owner: root
    group: root
    mode: '0644'
    remote_src: true
  loop:
    - morphit-ipfs-gc.service
    - morphit-ipfs-gc.timer
  notify: Reload systemd

- name: Enable + start the weekly IPFS clean-up timer
  ansible.builtin.systemd:
    name: morphit-ipfs-gc.timer
    state: started
    enabled: true
    daemon_reload: true
  failed_when: false
