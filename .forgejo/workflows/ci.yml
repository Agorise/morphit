# Morphit CI — runs on every push and pull request.
#
# Six gates, in order of cheapness:
#   1. supply-chain-audit — `npm audit` against the triaged allowlist
#      (scripts/audit-allowlist.json); fails on a new high/critical advisory
#   2. typecheck-sweep — fast, catches type errors across all
#      backend + library workspaces (apps/web excluded — it
#      extends the generated .svelte-kit/tsconfig.json, which
#      this sweep doesn't materialize)
#   3. web-check       — fast, runs `svelte-kit sync` then
#      `svelte-check` against apps/web; catches Svelte-template
#      + .svelte-aware TypeScript errors the workspace sweep
#      can't see
#   4. ansible-lint    — fast, catches playbook quality drift
#   5. integration     — the indexer integration suite (vitest)
#      against a REAL Postgres 16, so cross-table SQL + migration
#      regressions surface in CI instead of only in manual runs.
#   6. run-smokes      — the full smoke suite, triple-pulsed for flakes
#
# If any gate fails, the run fails.  Gates 1–5 run in parallel;
# the smokes gate is the longest-running and effectively serial.
# The web-check job intentionally runs `svelte-kit sync &&
# svelte-check` directly (not via run-smokes →
# workspace-typecheck-smoke) so the protection is legible in
# the CI surface and a broken smoke runner can't hide
# behind a SKIP exit code.
#
# Forgejo Actions has GitHub-Actions-compatible syntax; this
# workflow runs unchanged on either as long as the runner is a
# Debian/Ubuntu host.
#
# AUDIT-CI-2: third-party actions are SHA-pinned,
# not tag-pinned.  Tags like `@v4` can be re-pointed at attacker-
# controlled commits if an action repo is compromised; SHAs are
# immutable.  The version comment after each SHA (`# v4.2.2`) lets
# Dependabot/Renovate auto-suggest updates.  When bumping, ALSO
# audit the diff from the previous SHA before merging.

name: morphit-ci

on:
  push:
    branches:
      - main
  pull_request:

# Newer pushes to the same branch cancel any still-running CI on
# that branch.  Saves CI minutes on rapid-fire commit + amend.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  supply-chain-audit:
    name: Supply-chain audit gate (every advisory triaged, none fixable in range)
    runs-on: ubuntu-24.04
    # Fails on a moderate/high/critical advisory not triaged in
    # scripts/audit-allowlist.json (each entry carries its reason and review date), on
    # an allowlist entry npm no longer reports, on an advisory an in-range
    # update fixes, and when the audit cannot run (registry unreachable): no
    # information is not a pass.
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Install Node.js 22 LTS
        uses: actions/setup-node@1e60f620b9541d16bece96c5465dc8ee9832be0b # v4.0.3
        with:
          node-version: 22

      - name: Install workspace dependencies
        run: npm ci --ignore-scripts --no-audit --no-fund

      - name: Run supply-chain audit gate
        run: node scripts/audit-gate.mjs

  typecheck:
    name: TypeScript typecheck (sweep all workspaces)
    runs-on: ubuntu-24.04
    # every job gets an explicit wall-clock ceiling.
    # put a per-smoke timeout inside scripts/run-smokes.sh;
    # this job-level timeout is the complement for the other CI
    # steps (npm ci, tsc invocations) that no smoke wraps.
    # Current runtime is <2 minutes; 10× headroom for slow runners.
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Install Node.js 22 LTS
        uses: actions/setup-node@1e60f620b9541d16bece96c5465dc8ee9832be0b # v4.0.3
        with:
          node-version: 22

      - name: Install workspace dependencies
        # --ignore-scripts skips native-build steps (better-sqlite3
        # needs nodejs.org headers which may be restricted).  The
        # typecheck doesn't actually run any binaries so this is
        # fine here — but the run-smokes job needs a full install.
        run: npm ci --ignore-scripts --no-audit --no-fund

      - name: Run typecheck-sweep
        run: bash scripts/typecheck-sweep.sh

  web-check:
    name: apps/web svelte-check (svelte-kit sync + svelte-aware tsc)
    runs-on: ubuntu-24.04
    # current runtime is ~3 minutes; 10 minutes is roomy.
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Install Node.js 22 LTS
        uses: actions/setup-node@1e60f620b9541d16bece96c5465dc8ee9832be0b # v4.0.3
        with:
          node-version: 22

      - name: Install workspace dependencies
        # --ignore-scripts is safe here — svelte-check doesn't
        # need any native postinstall steps.  Workspace links
        # to @morphit/* must materialize, which they do under
        # the standard `npm ci` workspace install.
        run: npm ci --ignore-scripts --no-audit --no-fund

      - name: svelte-kit sync (generate .svelte-kit/tsconfig.json)
        working-directory: apps/web
        # The web tsconfig extends `.svelte-kit/tsconfig.json`,
        # generated by svelte-kit sync from the project config.
        # Without this step, svelte-check would run against a
        # stale or missing extended tsconfig.
        run: npx svelte-kit sync

      - name: svelte-check (strict, errors fail the build)
        working-directory: apps/web
        # `--threshold error` excludes warnings from the fail
        # signal; `--fail-on-warnings false` is the documented
        # default but stated explicitly here for clarity.
        # The script in apps/web/package.json (`npm run check`)
        # does the same thing; invoking the binary directly
        # keeps the CI step legible without an indirection.
        run: npx svelte-check --tsconfig ./tsconfig.json --threshold error

  integration:
    name: Integration tests (real Postgres 16)
    runs-on: ubuntu-24.04
    # explicit wall-clock ceiling. The indexer integration
    # suite is ~10 files / ~92 tests and runs in well under a minute
    # against a warm DB; 15 minutes is generous headroom for the
    # postgres service to become healthy + npm ci on a cold cache.
    timeout-minutes: 15
    # Postgres runs as a SERVICE SIDECAR — container-executor-native. The runner
    # starts it on the job's network; the job reaches it at host `postgres:5432`.
    # (Previously this used an in-job `docker run`, which only worked on the old
    # HOST-executor runner; a container-executor job has no in-job docker CLI.)
    # The harness CREATEs a random schema per suite, runs the production migration
    # path, and DROPs it on teardown — an empty DB is all we need. Tests SKIP unless
    # TEST_DATABASE_URL is set (that env is what turns them on).
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: morphit_test
          POSTGRES_PASSWORD: test
          POSTGRES_DB: morphit_test
        options: >-
          --health-cmd "pg_isready -U morphit_test -d morphit_test"
          --health-interval 2s
          --health-timeout 5s
          --health-retries 20
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Install Node.js 22 LTS
        uses: actions/setup-node@1e60f620b9541d16bece96c5465dc8ee9832be0b # v4.0.3
        with:
          node-version: 22

      - name: Install workspace dependencies
        # --ignore-scripts is SAFE here: the indexer integration tests use
        # `pg`, not better-sqlite3, so no native build is required — and
        # skipping postinstall dodges the better-sqlite3 native build (which
        # the smokes job needs build-essential for) entirely. The @morphit/*
        # workspace links still materialize under the standard workspace ci.
        run: npm ci --ignore-scripts --no-audit --no-fund

      - name: Install the PostgreSQL 16 client tools (pg_dump / psql with \restrict)
        # The snapshot suites run the REAL export (pg_dump + psql \copy) and the
        # REAL restore, which refuses a psql without `\restrict` (added in the
        # August 2025 client releases: 16.10 and later). The job container's own
        # client is not that, so the tests died with "psql is too old". The PGDG
        # repository carries the current 16.x; its signing key is checked by
        # fingerprint before apt trusts it. pg_dump must also be at least the
        # server's major (the postgres:16 service).
        run: |
          set -eu
          for i in 1 2 3; do
            apt-get update -qq && break
            echo "apt-get update attempt $i failed; retrying in 5s..."
            sleep 5
          done
          apt-get install -y --no-install-recommends ca-certificates curl gnupg
          install -d /usr/share/postgresql-common/pgdg
          curl -fsSL --retry 3 https://www.postgresql.org/media/keys/ACCC4CF8.asc \
            -o /usr/share/postgresql-common/pgdg/apt.postgresql.org.asc
          fpr=$(gpg --show-keys --with-colons /usr/share/postgresql-common/pgdg/apt.postgresql.org.asc | awk -F: '$1=="fpr"{print $10; exit}')
          if [ "$fpr" != "B97B0AFCAA1A47F044F244A07FCC7D46ACCC4CF8" ]; then
            echo "PGDG signing key fingerprint is '$fpr', not the expected one; refusing to trust it" >&2
            exit 1
          fi
          . /etc/os-release
          echo "deb [signed-by=/usr/share/postgresql-common/pgdg/apt.postgresql.org.asc] https://apt.postgresql.org/pub/repos/apt ${VERSION_CODENAME}-pgdg main" \
            > /etc/apt/sources.list.d/pgdg.list
          for i in 1 2 3; do
            apt-get update -qq && break
            echo "apt-get update attempt $i failed; retrying in 5s..."
            sleep 5
          done
          apt-get install -y --no-install-recommends postgresql-client-16

      - name: Check the client tools the snapshot suites depend on
        env:
          TEST_DATABASE_URL: postgres://morphit_test:test@postgres:5432/morphit_test
        run: |
          set -eu
          command -v psql && psql --version
          command -v pg_dump && pg_dump --version
          psql --version | grep -Eq ' 16\.' || { echo "psql is not the 16.x client" >&2; exit 1; }
          pg_dump --version | grep -Eq ' 16\.' || { echo "pg_dump is not the 16.x client" >&2; exit 1; }
          # The restore's own safety check: psql must accept \restrict.
          printf '\\restrict k0\n\\unrestrict k0\n' | psql -X -q -v ON_ERROR_STOP=1 "$TEST_DATABASE_URL"
          echo "psql accepts \\restrict"

      - name: Run indexer integration tests
        working-directory: apps/indexer
        env:
          # The `postgres` service sidecar (declared above), reachable by name.
          TEST_DATABASE_URL: postgres://morphit_test:test@postgres:5432/morphit_test
        run: npm run test:integration

  ansible-lint:
    name: ansible-lint (playbook quality gate)
    runs-on: ubuntu-24.04
    # current runtime is <1 minute; 5 minutes is roomy.
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Install Python + ansible-lint (pinned, hash-checked)
        run: |
          # Container-executor job runs as root in node:20-bookworm — plain
          # apt-get (no sudo, no source-list overrides). The retry loop rides out
          # a brief mirror hiccup.
          for i in 1 2 3; do
            apt-get update -qq && break
            echo "apt-get update attempt $i failed; retrying in 5s..."
            sleep 5
          done
          apt-get install -y --no-install-recommends \
            python3 python3-pip python3-venv
          # --break-system-packages: Debian marks the system Python as externally
          # managed. This is an ephemeral CI container. Every package is pinned
          # with its hash; the pinned `ansible` bundles the collections the
          # playbook uses, so nothing comes from Ansible Galaxy.
          pip3 install --break-system-packages --quiet --require-hashes \
            -r .forgejo/ansible-lint-requirements.txt

      - name: Run ansible-lint
        working-directory: ops/ansible
        run: ansible-lint --offline --strict playbook.yml

  smokes:
    name: Smoke suite (run-smokes.sh, triple-pulse)
    runs-on: ubuntu-24.04
    # One pulse took about 20 minutes on this runner, so triple-pulse is about
    # 60 minutes. the per-smoke 240s timeout caps any
    # single hung smoke; this job-level ceiling caps the whole battery in case
    # a non-smoke step (npm ci, build, ansible-lint install, ansible-galaxy
    # collection install) hangs, or the outer `for i in 1 2 3` loop wedges.
    # 90 is the ceiling ci-workflow-hardening-smoke allows (1.5× the observed
    # runtime); if the pulses outgrow it, cut the pulse count, not the cap.
    timeout-minutes: 90
    # The container executor gives V8 a ~2 GB default old-space heap; the memory
    # stress smoke (orderbook-provisional-removal-memory) allocates near that and
    # OOM'd on the CI container (it has more headroom locally). Raise the heap for
    # every smoke subprocess in this job so a legitimate memory test doesn't crash.
    env:
      NODE_OPTIONS: --max-old-space-size=3072
    # A few smokes drive REAL Postgres (the relay's drainer no-double-pay and
    # adversarial-RPC smokes). Without a database they print a skip line and no
    # `✓ all N` line, which run-smokes.sh counts as a failure — on purpose: a
    # guard that silently skips in CI is a guard that never runs. Same sidecar
    # as the integration job; each smoke works in its own schema and drops it.
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: morphit_test
          POSTGRES_PASSWORD: test
          POSTGRES_DB: morphit_test
        options: >-
          --health-cmd "pg_isready -U morphit_test -d morphit_test"
          --health-interval 2s
          --health-timeout 5s
          --health-retries 20
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Install Node.js 22 LTS
        uses: actions/setup-node@1e60f620b9541d16bece96c5465dc8ee9832be0b # v4.0.3
        with:
          node-version: 22

      - name: Install build tools
        run: |
          # see the ansible-lint job: plain apt-get as root in the
          # node:20-bookworm container (no sudo, no source-list overrides).
          for i in 1 2 3; do
            apt-get update -qq && break
            echo "apt-get update attempt $i failed; retrying in 5s..."
            sleep 5
          done
          apt-get install -y --no-install-recommends \
            build-essential python3

      - name: Install workspace dependencies (with the Matrix bot's native add-ons)
        # No install scripts run. The matrix-bot smokes load two native add-ons;
        # they are downloaded and checked against pinned SHA-256s
        # (scripts/fetch-matrix-bot-natives.mjs, the pins Ansible installs use).
        run: |
          set -eu
          npm ci --ignore-scripts --no-audit --no-fund
          node scripts/fetch-matrix-bot-natives.mjs .

      - name: Install ansible-lint (for ansible-lint-smoke; pinned, hash-checked)
        run: |
          apt-get install -y --no-install-recommends \
            python3-pip
          pip3 install --break-system-packages --quiet --require-hashes \
            -r .forgejo/ansible-lint-requirements.txt

      - name: Build workspaces that ship compiled artifacts
        # `apps/mcp-server` is the only workspace whose `bin`
        # points into `dist/` and therefore needs `tsc -p
        # tsconfig.build.json` to run before its smoke spawns
        # `node dist/main.js`.  The smoke is self-healing as of
        # (will lazy-build if missing), but doing the
        # build here makes the failure mode legible — a build
        # break surfaces as this step failing, not as a
        # mystery hang inside the smoke runner.
        #
        # If a future workspace adds a similar dist-bin, add
        # it here and the matching `spawn-dist-prebuild-coverage-smoke`
        # will keep this list and the smokes in sync.
        run: npm run build -w apps/mcp-server

      - name: Run smokes (triple-pulse)
        # We run the suite three times to catch flakes (~20 minutes a pulse).
        env:
          # The `postgres` service sidecar (declared above), reachable by name.
          TEST_DATABASE_URL: postgres://morphit_test:test@postgres:5432/morphit_test
        run: |
          for i in 1 2 3; do
            echo "=== Pulse $i ==="
            bash scripts/run-smokes.sh
          done
