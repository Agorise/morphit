# Morphit release workflow — fires on annotated-tag push.
#
# Runs the full validation gate (typecheck + ansible-lint + the
# smoke suite) AGAIN at release time (defensive — even though
# ci.yml runs on every push, tag pushes may bypass branch-protected
# CI in some forge configs), then builds a
# release tarball with the manifest of files needed to reproduce
# the deploy.
#
# Tag format: `v<MAJOR>.<MINOR>.<PATCH>` (e.g. `v1.0.0-beta.1`).
#
# Output: a `morphit-<tag>.tar.gz` archive uploaded as a release
# artifact.

name: morphit-release

on:
  push:
    tags:
      - 'v*'

# Releases should never race each other.
concurrency:
  group: morphit-release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  release:
    name: Build + publish release tarball
    runs-on: ubuntu-24.04
    # NB: Forgejo does NOT implement GitHub's `permissions:` key (it warns
    # and ignores it), so we don't set one. The Publish step's token scope
    # comes from Forgejo's default Actions token (repo-scoped) or, if that
    # is capped, an operator-supplied MORPHIT_RELEASE_TOKEN secret.
    # One smoke pulse took 19.5 minutes on this runner (2026-09-29), so the
    # job runs ONE pulse (~20 min) plus tag verification, typecheck,
    # ansible-lint, tarball build, checksum and upload: ~30 min. 60 = 2×.
    # (Three pulses here would be ~70 min and could not fit under the 90-min
    # ceiling ci-workflow-hardening-smoke allows with any safety margin; the
    # tagged commit already passed ci.yml's triple-pulse — Block 2's gate.)
    timeout-minutes: 60
    # Same heap as ci.yml's smokes job: the memory stress smoke allocates near
    # V8's ~2 GB default on the container executor.
    env:
      NODE_OPTIONS: --max-old-space-size=3072
      # The ONLY keys whose signatures make a tag a release and sign its
      # tarball (space-separated, upper-case fingerprints). Trust is decided
      # here, never by which .asc files the tagged tree carries under
      # .forgejo/release-signers/ (a tag pusher controls those). Must equal
      # RELEASE_SIGNER_FINGERPRINTS in packages/operator-config, which installed
      # nodes check tarball signatures against (release-signer-pin-smoke).
      MORPHIT_RELEASE_SIGNERS: 7B4C1D189DBB610C473B59ED53524E1F1017EB9C
    # Same Postgres sidecar as ci.yml's smokes job: the relay's drainer and
    # adversarial-RPC smokes drive a real database and fail the suite without one.
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: morphit_test
          POSTGRES_PASSWORD: test
          POSTGRES_DB: morphit_test
        options: >-
          --health-cmd "pg_isready -U morphit_test -d morphit_test"
          --health-interval 2s
          --health-timeout 5s
          --health-retries 20

    steps:
      - name: Checkout (full history for git describe)
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          fetch-depth: 0

      - name: Restore annotated tag (actions/checkout strips signatures)
        # Forgejo Actions (and GitHub Actions) ship a version of
        # actions/checkout that, after fetching all refs correctly,
        # performs a SECOND fetch of the form
        # `+<commit-sha>:refs/tags/<tag>` which force-rewrites the
        # tag in the runner's local workspace to a lightweight
        # pointer at the commit.  This destroys the annotated tag
        # object locally — and therefore destroys the signature —
        # even though the tag on the Forgejo server is still a
        # proper annotated signed tag.
        #
        # `git verify-tag` operates on the local copy, so it sees
        # the lightweight pointer and fails with:
        #   "cannot verify a non-tag object of type commit"
        #
        # Re-fetch the tag in its annotated form before verify.
        # The `+refs/tags/X:refs/tags/X` refspec preserves tag
        # objects (vs the commit-SHA refspec checkout uses).
        # See: github.com/actions/checkout issue #290 / #1467.
        env:
          TAG: ${{ github.ref_name }}
        run: |
          set -eu
          git fetch origin "+refs/tags/${TAG}:refs/tags/${TAG}" --force
          # Sanity-check: confirm we now have a tag object, not a
          # commit.  If this fails, the fetch above didn't restore
          # the annotated form (which would mean the tag on the
          # server is also lightweight — a separate bug).
          OBJTYPE=$(git cat-file -t "${TAG}")
          if [ "$OBJTYPE" != "tag" ]; then
            echo "ERROR: ${TAG} is a '${OBJTYPE}' object, not 'tag'" >&2
            echo "       This means the tag on the server is lightweight." >&2
            echo "       Delete and recreate with: git tag -s ${TAG} -m '...'" >&2
            exit 1
          fi
          echo "✓ ${TAG} restored as annotated tag object"

      - name: Verify tag is signed by a pinned release key and is on main
        # The tag must be signed by a key whose fingerprint is in
        # MORPHIT_RELEASE_SIGNERS (job env above). The .asc files in the
        # tagged tree's .forgejo/release-signers/ only supply key MATERIAL:
        # a tag pusher can commit their own key there, so a good signature
        # from it counts for nothing. The tagged commit must also be on the
        # protected main branch, so the code being released (this workflow
        # included) is code that went through main.
        # Runs before any dependency is installed or any repository code runs.
        env:
          TAG: ${{ github.ref_name }}
        run: |
          set -eu
          [ -n "${MORPHIT_RELEASE_SIGNERS:-}" ] || { echo "ERROR: no pinned release signers (MORPHIT_RELEASE_SIGNERS)" >&2; exit 1; }
          [ "$(git cat-file -t "$TAG")" = tag ] || { echo "ERROR: $TAG is not an annotated tag" >&2; exit 1; }
          # The signature covers the tag object, and the object names its tag:
          # a ref pointed at another version's signed object is refused.
          OBJ_TAG="$(git cat-file tag "$TAG" | sed -n '/^$/q; s/^tag //p')"
          if [ "$OBJ_TAG" != "$TAG" ]; then
            echo "ERROR: refs/tags/$TAG points at the signed tag object of '${OBJ_TAG}', not of $TAG" >&2
            exit 1
          fi
          # What this job checked out, and builds, is the commit the tag names.
          if [ "$(git rev-parse HEAD)" != "$(git rev-parse "${TAG}^{commit}")" ]; then
            echo "ERROR: the checked-out commit is not the commit $TAG points at (was the tag moved after the push?)" >&2
            exit 1
          fi
          GNUPGHOME="$(mktemp -d)"
          chmod 700 "$GNUPGHOME"
          export GNUPGHOME
          for key in .forgejo/release-signers/*.asc; do
            [ -f "$key" ] && gpg --batch --import "$key" >/dev/null 2>&1 || true
          done
          if ! STATUS="$(git verify-tag --raw "$TAG" 2>&1 >/dev/null)"; then
            echo "ERROR: $TAG is not signed, or its signature does not verify" >&2
            rm -rf "$GNUPGHOME"
            exit 1
          fi
          rm -rf "$GNUPGHOME"
          SIGNER=""
          for f in $(printf '%s\n' "$STATUS" | awk '$1=="[GNUPG:]" && $2=="VALIDSIG" {print $3; print $NF}'); do
            for p in $MORPHIT_RELEASE_SIGNERS; do
              if [ "$(printf '%s' "$f" | tr a-f A-F)" = "$(printf '%s' "$p" | tr a-f A-F)" ]; then SIGNER="$p"; fi
            done
          done
          if [ -z "$SIGNER" ]; then
            echo "ERROR: $TAG is signed, but not by a pinned release key (MORPHIT_RELEASE_SIGNERS)" >&2
            exit 1
          fi
          git fetch --no-tags origin "+refs/heads/main:refs/remotes/origin/main"
          if ! git merge-base --is-ancestor "${TAG}^{commit}" refs/remotes/origin/main; then
            echo "ERROR: the commit $TAG points at is not on main" >&2
            exit 1
          fi
          echo "✓ $TAG is signed by pinned key $SIGNER, names itself, is the checked-out commit, and is on main"

      - name: Install Node.js 22 LTS
        uses: actions/setup-node@1e60f620b9541d16bece96c5465dc8ee9832be0b # v4.0.3
        with:
          node-version: 22

      - name: Install build tools + pip
        run: |
          # Plain apt-get as root in the container executor (no sudo, no
          # source-list overrides — see ci.yml); the retry loop rides out a
          # brief mirror hiccup.
          for i in 1 2 3; do
            apt-get update -qq && break
            echo "apt-get update attempt $i failed; retrying in 5s..."
            sleep 5
          done
          apt-get install -y --no-install-recommends \
            build-essential python3 python3-pip

      - name: Install workspace dependencies
        # No install scripts: the lockfile's packages are unpacked, nothing they
        # ship is run. The two native add-ons the Matrix bot (and its smokes)
        # load are then downloaded and checked against pinned SHA-256s
        # (scripts/fetch-matrix-bot-natives.mjs, the pins Ansible installs use).
        run: |
          set -eu
          npm ci --ignore-scripts --no-audit --no-fund
          node scripts/fetch-matrix-bot-natives.mjs .

      - name: Install ansible-lint (pinned, hash-checked)
        # The pinned `ansible` bundles the collections the playbook uses, so
        # nothing is installed from Ansible Galaxy.
        run: |
          pip3 install --break-system-packages --quiet --require-hashes \
            -r .forgejo/ansible-lint-requirements.txt

      - name: Typecheck sweep
        run: bash scripts/typecheck-sweep.sh

      - name: ansible-lint (production profile)
        working-directory: ops/ansible
        run: ansible-lint --offline --strict playbook.yml

      - name: Smoke suite (one pulse; ci.yml ran three on this commit)
        env:
          # The `postgres` service sidecar (declared above), reachable by name.
          TEST_DATABASE_URL: postgres://morphit_test:test@postgres:5432/morphit_test
          # This commit already passed ci.yml's STRICT npm-audit gate. A HIGH
          # advisory published since then is reported (loudly, as a warning)
          # instead of failing the release; a new CRITICAL still fails it.
          # Only this step may set it (ci-workflow-hardening-smoke checks).
          MORPHIT_AUDIT_GATE_MODE: report
        run: bash scripts/run-smokes.sh

      - name: Compute release version + validate tag format
        id: ver
        run: |
          set -eu
          TAG="${GITHUB_REF#refs/tags/}"
          # AUDIT-CI-7: validate the tag format
          # STRICTLY before letting it flow into shell-interpolated
          # contexts.  git-check-ref-format permits `$`, `(`, `)`,
          # spaces, and other shell-metacharacters; we permit only
          # the tag grammar we actually use: `v<num>.<num>.<num>`
          # optionally followed by `-<alnum-and-dots>`.  This
          # blocks injection like `v1.0.0-$(curl evil.com)`.
          case "$TAG" in
              v[0-9]*.[0-9]*.[0-9]*|v[0-9]*.[0-9]*.[0-9]*-*)
                  ;;
              *)
                  echo "ERROR: tag '$TAG' does not match v<n>.<n>.<n>[-<pre>]" >&2
                  exit 1
                  ;;
          esac
          # Belt-and-braces: also reject any char outside the
          # narrow whitelist [A-Za-z0-9.-].  Even if the case-glob
          # above accepts something weird, this catches it.
          case "$TAG" in
              *[!A-Za-z0-9.-]*)
                  echo "ERROR: tag '$TAG' contains forbidden chars" >&2
                  exit 1
                  ;;
          esac
          # The tag must name the version the tree says it is: a
          # `v1.19.0` tag on a tree whose package.json still reads
          # 1.18.x would publish a tarball whose upgrade/verify
          # reporting shows the wrong version everywhere.
          PKG_VERSION=$(node -p "require('./package.json').version")
          if [ "v${PKG_VERSION}" != "$TAG" ]; then
            echo "ERROR: tag '$TAG' does not match package.json version '${PKG_VERSION}'" >&2
            echo "       Bump the version in every package.json (version-consistency smoke) before tagging." >&2
            exit 1
          fi
          echo "tag=${TAG}" >> "$GITHUB_OUTPUT"
          echo "tarball=morphit-${TAG}.tar.gz" >> "$GITHUB_OUTPUT"
          echo "offline=morphit-${TAG}-offline.tar.gz" >> "$GITHUB_OUTPUT"

      - name: Generate release-info.json (in-tarball provenance manifest)
        # bake a manifest into the tarball that
        # `morphit-ops upgrade` reads to verify the operator is
        # extracting the version they think they are.  Survives
        # tarball-rename mistakes (operator renames the file
        # → `morphit-ops upgrade` still reads the canonical
        # version from inside).  Contents:
        #   tag         — the release tag (e.g. v1.0.0-beta.1)
        #   commit      — full git commit SHA the tarball was built from
        #   build_time  — ISO 8601 UTC of CI build
        #   builder     — "forgejo-actions" (provenance hint)
        env:
          TAG: ${{ steps.ver.outputs.tag }}
        run: |
          set -eu
          COMMIT=$(git rev-parse HEAD)
          BUILD_TIME=$(date -u +'%Y-%m-%dT%H:%M:%SZ')
          cat > release-info.json <<EOF
          {
            "tag": "${TAG}",
            "commit": "${COMMIT}",
            "build_time": "${BUILD_TIME}",
            "builder": "forgejo-actions"
          }
          EOF
          cat release-info.json

      - name: Build the canonical web frontend (shipped prebuilt, not rebuilt per-operator)
        # Federated operators must serve BYTE-IDENTICAL frontend assets to pass the
        # on-chain build-integrity check — a local `npm run build` is not
        # byte-reproducible across machines, so an honest operator's rebuild
        # mismatches @morphit's published hashes and trips the scary red banner.
        # Build the frontend ONCE here and ship apps/web/build in the tarball; the
        # install + upgrade DEPLOY these exact files (falling back to a rebuild only
        # if the prebuilt is somehow absent). The frontend is generic — instance
        # identity loads at runtime from /v1/instance — so one build serves everyone.
        run: |
          npm run build -w apps/web
          # Without the brand-slot record, `morphit-ops branding` cannot put an
          # operator's site name into the prerendered pages (docs/BRANDING.md).
          if [ ! -f apps/web/build/.brand-slots.json ]; then
            echo "ERROR: apps/web/build/.brand-slots.json missing — the brand-slot adapter did not run" >&2
            exit 1
          fi
          # Mark the freshly-built frontend as the SHIPPED canonical build. On an
          # operator's box, apps/web's build script sees this marker and deploys
          # these exact bytes instead of rebuilding — so every instance's assets
          # match the on-chain hashes and the build-integrity banner stays quiet.
          touch apps/web/build/.shipped

      - name: Build release tarball
        # Stage the output in /tmp so tar never sees its own
        # output land inside the directory it's reading.  Writing
        # the tarball directly into `.` updates the directory's
        # mtime mid-walk and tar bails with `.: file changed as
        # we read it` (run 406, even after the per-file exclude
        # from run 401).  Staging in /tmp and moving the finished
        # tarball back is the standard workaround.
        #
        # ./private is the maintainer's private handoff (gitignored, so a CI
        # checkout never has it); excluded here as well so no tree it does
        # sit in can pack it (release-packers-exclude-private-smoke).
        #
        # AUDIT-CI-7: tag value passed via env, not ${{ }}
        # interpolation, so bash sees a plain variable (no
        # command substitution on the tag content).
        env:
          TARBALL: ${{ steps.ver.outputs.tarball }}
        run: |
          set -eu
          STAGE=$(mktemp -d)
          tar --exclude='./node_modules' \
              --exclude='./.git' \
              --exclude='./out' \
              --exclude='./dist' \
              --exclude='./apps/*/node_modules' \
              --exclude='./apps/*/dist' \
              --exclude='./apps/*/.svelte-kit' \
              --exclude='./packages/*/node_modules' \
              --exclude='./packages/*/dist' \
              --exclude='*.log' \
              --exclude='./private' \
              -czf "${STAGE}/${TARBALL}" .
          mv "${STAGE}/${TARBALL}" "./${TARBALL}"
          rmdir "${STAGE}"

      - name: Compute tarball checksum
        env:
          TARBALL: ${{ steps.ver.outputs.tarball }}
        run: |
          set -eu
          sha256sum "$TARBALL" > "$TARBALL.sha256"
          cat "$TARBALL.sha256"

      - name: Build the offline bundle (node_modules + this release's frontend)
        # A zero-clearnet node takes a release with no clearnet and no npm:
        # `morphit-ops upgrade --from-file=<this bundle>`. The bundle carries
        # node_modules with the marker that makes the upgrade skip npm, the
        # frontend this job built (the same bytes as the slim tarball), and the
        # slim tarball itself. The next step signs it with the pinned key; an
        # installed node (v1.20.2 included) checks that signature against its own
        # .forgejo/release-signers before it uses a byte of it. A failure here
        # fails the release.
        # Built without Docker (this job runs in a container that has none): no
        # apt packages and no images, which only a fresh, fully offline install
        # would use; scripts/build-offline-bundle.sh without --without-docker
        # still builds that appliance on any Ubuntu 24.04 box with Docker.
        # No secret is in reach of this step.
        env:
          OFFLINE: ${{ steps.ver.outputs.offline }}
        run: |
          set -eu
          bash scripts/build-offline-bundle.sh --without-docker --reuse-frontend
          if [ ! -s "$OFFLINE" ] || [ ! -s "$OFFLINE.sha256" ]; then
            echo "ERROR: $OFFLINE (+ .sha256) was not produced; the release needs it" >&2
            exit 1
          fi
          sha256sum -c "$OFFLINE.sha256"
          ls -lh "$OFFLINE"

      - name: Sign release tarball (detached GPG signature)
        # Installed nodes accept a tarball signed by a fingerprint pinned in
        # @morphit/operator-config (or one matching @morphit's signed on-chain
        # record). The key comes from two repo secrets (Forgejo → repo →
        # Settings → Actions → Secrets):
        #   MORPHIT_RELEASE_SIGNING_KEY         — ASCII-armored PRIVATE key of a
        #     pinned fingerprint (MORPHIT_RELEASE_SIGNERS).
        #   MORPHIT_RELEASE_SIGNING_PASSPHRASE  — its passphrase (may be empty).
        # A missing key, or a key that is not pinned, FAILS the release: a
        # release is never published unsigned. The passphrase reaches gpg on a
        # file descriptor, never on its command line. The signature logic is
        # inline here, not a repository script, so nothing a dependency wrote
        # into the workspace earlier in this job is run with the key.
        env:
          TARBALL: ${{ steps.ver.outputs.tarball }}
          OFFLINE: ${{ steps.ver.outputs.offline }}
          SIGNING_KEY: ${{ secrets.MORPHIT_RELEASE_SIGNING_KEY }}
          SIGNING_PASSPHRASE: ${{ secrets.MORPHIT_RELEASE_SIGNING_PASSPHRASE }}
        run: |
          set -eu
          if [ -z "${SIGNING_KEY:-}" ]; then
            echo "ERROR: MORPHIT_RELEASE_SIGNING_KEY is not set. A release is never published unsigned." >&2
            exit 1
          fi
          SIGN_HOME="$(mktemp -d)"
          chmod 700 "$SIGN_HOME"
          export GNUPGHOME="$SIGN_HOME"
          trap 'rm -rf "$SIGN_HOME"' EXIT
          printf '%s' "$SIGNING_KEY" | gpg --batch --import 2>/dev/null
          FPR="$(gpg --list-secret-keys --with-colons | awk -F: '$1=="fpr" {print $10; exit}')"
          PINNED=no
          for p in $MORPHIT_RELEASE_SIGNERS; do
            [ "$(printf '%s' "$FPR" | tr a-f A-F)" = "$(printf '%s' "$p" | tr a-f A-F)" ] && PINNED=yes
          done
          if [ -z "$FPR" ] || [ "$PINNED" != yes ]; then
            echo "ERROR: the signing secret holds key '${FPR:-none}', which is not a pinned release key (MORPHIT_RELEASE_SIGNERS)." >&2
            exit 1
          fi
          # The slim tarball and the offline bundle, with the same key.
          for f in "$TARBALL" "${OFFLINE:-}"; do
            if [ ! -s "$f" ]; then
              echo "ERROR: '$f' is missing; the release signs the tarball and the offline bundle" >&2
              exit 1
            fi
            printf '%s' "${SIGNING_PASSPHRASE:-}" | gpg --batch --yes --pinentry-mode loopback \
              --passphrase-fd 0 --local-user "$FPR" \
              --armor --detach-sign --output "$f.asc" "$f"
            # Check what was produced before anything else uses it.
            # VALIDSIG names the signing (sub)key first and the primary key last.
            gpg --batch --status-fd 1 --verify "$f.asc" "$f" 2>/dev/null \
              | awk -v k="$FPR" '$1=="[GNUPG:]" && $2=="VALIDSIG" && ($3==k || $NF==k) {ok=1} END {exit !ok}' || {
              echo "ERROR: the fresh signature of $f does not verify as $FPR" >&2
              exit 1
            }
            echo "Signed $f with pinned key $FPR."
          done
          printf '%s\n' "$FPR" > release-signer.fpr

      - name: Compute canonical IPFS CID (self-hosted seed model — Kubo, no pinning service)
        # v1.9.3: releases are hosted on our OWN nodes (the maintainer's release box seeds via
        # ops/ipfs/morphit-ipfs-seed.sh; every instance's Kubo pins), so CI does NOT
        # upload anywhere. It only COMPUTES the DETERMINISTIC directory CID with the
        # SAME pinned Kubo the seed uses, over the SAME shared staging script
        # (ops/ipfs/stage-release-dir.sh) — so CI's --only-hash CID EQUALS the CID the
        # seed box produces + hosts (the seed asserts equality when it hosts). That
        # directory CID is anchored on-chain as ipfs_cid; ipns://<name> is repointed
        # at it below. No secret, no account, no cost. ANY failure here is NON-FATAL
        # (git mirrors + on-chain SHA-256 are the real anchors) — it just means no
        # ipfs_cid this run, which the Block-4 dry-run makes visible.
        #
        # KUBO_VERSION + KUBO_SHA512 MUST stay in sync with
        # ops/ipfs/morphit-ipfs-setup.sh (asserted by ipfs-selfseed-smoke). The binary
        # is pinned + checksum-verified — never an unverified binary in the release path.
        env:
          TARBALL: ${{ steps.ver.outputs.tarball }}
          TAG: ${{ steps.ver.outputs.tag }}
          KUBO_VERSION: v0.42.0
          KUBO_SHA512: 054c38a0cf66f7d738e25085ad62cb3a42d03d4bac329b7dd25c1d71cf18e1ce87d55b1d1b705b04c65210dca9109973579e0eb1cd72f6341ecb3311d840d156
        run: |
          set -u
          # 1. Install the pinned Kubo (checksum-verified) into a scratch dir.
          KUBO_DIR="$(mktemp -d)"
          KTAR="kubo_${KUBO_VERSION}_linux-amd64.tar.gz"
          # v1.20.3: v1.20.2's run hung ~5 min on dist.ipfs.tech and released with
          # no ipfs_cid, so zero-clearnet instances could not fetch it. Bounded
          # retries, then the same pinned binary from Kubo's GitHub release; the
          # SHA-512 pin below checks whichever answered.
          KOK=no
          for KURL in "https://dist.ipfs.tech/kubo/${KUBO_VERSION}/${KTAR}" "https://github.com/ipfs/kubo/releases/download/${KUBO_VERSION}/${KTAR}"; do
            if curl -fsSL --connect-timeout 20 --max-time 180 --retry 3 --retry-delay 5 --retry-all-errors "$KURL" -o "${KUBO_DIR}/${KTAR}"; then
              KOK=yes
              echo "Kubo ${KUBO_VERSION} from ${KURL}"
              break
            fi
            echo "WARNING: Kubo download failed from ${KURL}" >&2
          done
          if [ "$KOK" != yes ]; then
            echo "::warning::could not download Kubo ${KUBO_VERSION} — NO ipfs_cid this run: Block 4 must take the CID the release box prints when it seeds." >&2
            exit 0
          fi
          GOT=$(sha512sum "${KUBO_DIR}/${KTAR}" | awk '{print $1}')
          if [ "$(echo "$GOT" | tr 'A-Z' 'a-z')" != "$(echo "$KUBO_SHA512" | tr 'A-Z' 'a-z')" ]; then
            echo "WARNING: Kubo SHA-512 mismatch vs pin — refusing the binary; no ipfs_cid this run." >&2
            exit 0
          fi
          tar -xzf "${KUBO_DIR}/${KTAR}" -C "${KUBO_DIR}"
          IPFS_BIN="${KUBO_DIR}/kubo/ipfs"
          chmod +x "$IPFS_BIN" 2>/dev/null || true
          export IPFS_PATH="$(mktemp -d)"
          "$IPFS_BIN" init --profile lowpower >/dev/null 2>&1 || true
          # 2. Stage the canonical directory from the LOCAL just-built tarball via the
          #    SHARED script (identical to what the seed box stages → identical CID).
          STAGE="$(mktemp -d)/morphit"
          mkdir -p "$STAGE"
          if ! MORPHIT_STAGE_TARBALL="$TARBALL" \
               MORPHIT_STAGE_SHA256="${TARBALL}.sha256" \
               sh ops/ipfs/stage-release-dir.sh "$TAG" "$STAGE"; then
            echo "WARNING: staging failed — no ipfs_cid this run." >&2
            exit 0
          fi
          # 3. Compute the DETERMINISTIC directory CID (offline: no upload, no daemon).
          CID="$("$IPFS_BIN" add -rQ --cid-version 1 --chunker=size-262144 --raw-leaves --only-hash "$STAGE" 2>/dev/null || true)"
          if [ -z "${CID:-}" ]; then
            echo "WARNING: ipfs add --only-hash produced no CID — no ipfs_cid this run." >&2
            exit 0
          fi
          printf '%s' "$CID" > ipfs-cid.txt
          echo "Canonical IPFS CID (seeded by the release box + anchored on-chain): $CID"
          echo "  the seed hosts THIS exact CID; instances pin it; ipns://<name> repoints to it below."

      - name: Install the IPNS signing tools (pinned, no install scripts, no secrets)
        # scripts/ipns/ has its own package.json + package-lock.json. They are
        # installed HERE, in a step that is given no secret, with install
        # scripts off; the next step, which is given the IPNS key, runs node
        # on them and installs nothing. NON-FATAL: IPNS is additive.
        run: |
          set -u
          npm ci --prefix scripts/ipns --ignore-scripts --no-audit --no-fund >/dev/null 2>&1 \
            || echo "WARNING: could not install the IPNS signing tools — the release goes out without ipns_record." >&2

      - name: Sign stable IPNS record (optional — DHT-native, sign-once/rebroadcast-only)
        # OPTIONAL "always find the latest" pointer, resolvable on the PUBLIC DHT
        # (v1.9.6). If a MORPHIT_IPNS_KEY secret is set, sign an IPNS record pointing
        # Morphit's STABLE name at THIS release's CID — scripts/ipns/ipns-sign.mjs,
        # in this step only; the key is used by that one process — with a 1-year
        # lifetime. The signed record (base64) is written to ipns-record.txt and the
        # k51… name to ipns-name.txt, each only after checking its shape; both are
        # carried into the on-chain anchor below. Every instance then reads the
        # record (via /v1/release) and rebroadcasts it to the DHT WITHOUT the key, so
        # ipns://<name> resolves on any gateway for as long as one instance lives — and
        # no instance can repoint it (minting/bumping requires the key; the sequence is
        # signed).
        #
        # The sequence is the build's unix timestamp: strictly monotonic across releases
        # (newest wins on resolve) with no fragile chain read. NO key → skipped; ANY
        # failure is NON-FATAL (IPNS is additive to the immutable ipfs_cid + git
        # mirrors + on-chain SHA-256). Broadcast (Block 5) is laptop-only; the IPNS key
        # only repoints a name, never touches funds.
        env:
          MORPHIT_IPNS_KEY: ${{ secrets.MORPHIT_IPNS_KEY }}
        run: |
          set -u
          if [ -z "${MORPHIT_IPNS_KEY:-}" ]; then
            echo "No MORPHIT_IPNS_KEY secret — skipping IPNS sign (release proceeds without ipns_record)."
            exit 0
          fi
          if [ ! -s ipfs-cid.txt ] || [ ! -d scripts/ipns/node_modules ]; then
            echo "No CID or no IPNS signing tools — skipping IPNS sign (release proceeds without ipns_record)."
            exit 0
          fi
          RELEASE_CID=$(cat ipfs-cid.txt)
          SEQ=$(date -u +%s)
          echo "Signing IPNS record → /ipfs/${RELEASE_CID} (seq ${SEQ}) for DHT rebroadcast…"
          if RELEASE_CID="${RELEASE_CID}" MORPHIT_IPNS_SEQUENCE="${SEQ}" node scripts/ipns/ipns-sign.mjs > ipns-sign.json 2> ipns-sign.log; then
            sed 's/^/  /' ipns-sign.log >&2 || true
            # Written only when each value has the exact shape the anchor allows.
            node -e '
              const fs = require("fs");
              const j = JSON.parse(fs.readFileSync("ipns-sign.json", "utf8"));
              if (typeof j.name !== "string" || !/^k51[a-z0-9]{50,70}$/.test(j.name)) throw new Error("bad IPNS name");
              if (typeof j.record !== "string" || !/^[A-Za-z0-9+/]{64,1200}={0,2}$/.test(j.record)) throw new Error("bad IPNS record");
              fs.writeFileSync("ipns-name.txt", j.name);
              fs.writeFileSync("ipns-record.txt", j.record);
            ' || { echo "WARNING: the IPNS output did not have the expected shape — continuing without ipns_record." >&2; rm -f ipns-name.txt ipns-record.txt; }
            [ -s ipns-name.txt ] && echo "IPNS record signed: name=$(cat ipns-name.txt), record=$(wc -c < ipns-record.txt) b64 chars."
          else
            echo "WARNING: IPNS sign did not complete — continuing without ipns_record." >&2
            sed 's/^/  /' ipns-sign.log >&2 || true
            rm -f ipns-name.txt ipns-record.txt ipns-sign.json
          fi
          true

      - name: Write distribution anchor (source_sha256 + gpg_fingerprint)
        # The on-chain morphit_release_v1 `distribution` block anchors the
        # SHA-256 of THIS canonical tarball (the one published below) plus the
        # release-signer key fingerprint, so a downloader can prove a copy is
        # genuine against the chain. The hash MUST be the published tarball's —
        # this job built it; a laptop `git archive` would produce different
        # bytes and a mismatched anchor (the old release-sign.sh footgun). The
        # fingerprint is the one the sign step signed the tarball with, which it
        # checked against MORPHIT_RELEASE_SIGNERS. The mirror list is a fixed
        # default baked into the payload builder, so it is NOT written here. The
        # ELI5 ceremony fetches this file back from the release and hands it to the
        # payload builder (MORPHIT_BUILD_ANCHOR_FILE), which PARSES it against an
        # allowlist of keys and value shapes. It is never sourced.
        env:
          TARBALL: ${{ steps.ver.outputs.tarball }}
          TAG: ${{ steps.ver.outputs.tag }}
          OFFLINE: ${{ steps.ver.outputs.offline }}
        run: |
          set -eu
          SHA256=$(awk '{print $1}' "$TARBALL.sha256")
          # The key that signed the tarball (the sign step checked it is pinned).
          FPR=$(cat release-signer.fpr 2>/dev/null || true)
          # The signed tag object this job verified and built. Block 4 (on the
          # laptop that made the tag in Block 2) refuses an anchor naming any
          # other object, so a tag re-pointed at an older signed object of the
          # same name cannot reach the chain.
          TAG_OBJECT=$(git rev-parse "refs/tags/${TAG}")
          OFF_SHA=$(awk '{print $1}' "${OFFLINE}.sha256" 2>/dev/null || true)
          if ! printf '%s' "${SHA256:-}" | grep -qE '^[0-9a-f]{64}$' || ! printf '%s' "${FPR:-}" | grep -qE '^[0-9A-F]{40}$' \
             || ! printf '%s' "${TAG_OBJECT:-}" | grep -qE '^([0-9a-f]{40}|[0-9a-f]{64})$' || [ "$(git cat-file -t "${TAG_OBJECT}")" != tag ] \
             || ! printf '%s' "${OFF_SHA:-}" | grep -qE '^[0-9a-f]{64}$'; then
            echo "ERROR: could not derive the anchor (sha256='${SHA256:-}' fpr='${FPR:-}' tag object='${TAG_OBJECT:-}' offline sha256='${OFF_SHA:-}')" >&2
            exit 1
          fi
          {
            echo "# Morphit distribution anchor for ${TAG} — read by release-build-payload.ts (MORPHIT_BUILD_ANCHOR_FILE); never source it."
            echo "export MORPHIT_BUILD_SOURCE_SHA256=${SHA256}"
            echo "export MORPHIT_BUILD_GPG_FINGERPRINT=${FPR}"
            echo "export MORPHIT_BUILD_TAG_OBJECT=${TAG_OBJECT}"
            # The offline bundle's SHA-256 (signed above, like the tarball).
            echo "export MORPHIT_BUILD_OFFLINE_SHA256=${OFF_SHA}"
            # Optional canonical IPFS CID from the compute step above (present
            # unless Kubo download/staging failed). Read by the payload builder at ELI5 Block 4,
            # it flows into the payload builder's `ipfs_cid` and is anchored
            # on-chain alongside the mirrors; the release box seeds THIS exact CID
            # and instances pin it. Absent → the block simply omits ipfs_cid
            # (schema-optional), exactly as before.
            # Every value is written only when it has the exact shape the anchor
            # allows: the ceremony PARSES this file (it is never sourced), and a
            # value that is not a hash/CID/name/record has no business in it.
            if [ -s ipfs-cid.txt ] && grep -qE '^(Qm[1-9A-HJ-NP-Za-km-z]{44}|b[a-z2-7]{58,110})$' ipfs-cid.txt; then
              echo "export MORPHIT_BUILD_IPFS_CID=$(cat ipfs-cid.txt)"
            fi
            # Optional stable IPNS name from the publish step above (present only
            # if a MORPHIT_IPNS_KEY secret is set and the publish succeeded).
            # Read at ELI5 Block 4, it flows into the payload builder's
            # `ipns_name` and is anchored on-chain as the canonical "always
            # latest" pointer. Absent → the block omits ipns_name (schema-optional).
            if [ -s ipns-name.txt ] && grep -qE '^k51[a-z0-9]{50,70}$' ipns-name.txt; then
              echo "export MORPHIT_BUILD_IPNS_NAME=$(cat ipns-name.txt)"
            fi
            # Optional signed IPNS record (base64) from the sign step above (v1.9.6):
            # the DHT-rebroadcast pointer. Read at ELI5 Block 4 into the payload
            # builder's `ipns_record` and anchored on-chain, where every instance reads
            # it (via /v1/release) and rebroadcasts it to the DHT. Absent → omitted
            # (schema-optional), exactly as before.
            if [ -s ipns-record.txt ] && grep -qE '^[A-Za-z0-9+/]{64,1200}={0,2}$' ipns-record.txt; then
              echo "export MORPHIT_BUILD_IPNS_RECORD=$(cat ipns-record.txt)"
            fi
          } > distribution-anchor.env
          echo "── distribution-anchor.env ──"
          cat distribution-anchor.env

      - name: Upload release artifact
        # AUDIT-CI-2 — Forgejo Actions does not implement the
        # `@actions/artifact` v2 backend that upload-artifact@v4+
        # requires (run 411 surfaced this with the explicit
        # `GHESNotSupportedError: @actions/artifact v2.0.0+,
        # upload-artifact@v4+ and download-artifact@v4+ are not
        # currently supported on GHES`).  Pin to v3, which uses
        # the older backend Forgejo does support.
        #
        # pinned by COMMIT, like every other
        # action here. This step's code runs after the tarball, .sha256,
        # .asc and distribution-anchor.env are written and before they are
        # published, so a moved tag could rewrite all of them consistently.
        # ff15f030… is the commit `v3` pointed to when this was pinned — the
        # v3.2.1 tag (verified with `git ls-remote
        # https://github.com/actions/upload-artifact`, 2026-09-24; both tags
        # are lightweight tags on that commit). The publish step below also
        # re-verifies the .asc before anything is attached.
        uses: actions/upload-artifact@ff15f0306b3f739f7b6fd43fb5d26cd321bd4de5 # v3.2.1
        with:
          name: ${{ steps.ver.outputs.tag }}
          path: |
            ${{ steps.ver.outputs.tarball }}
            ${{ steps.ver.outputs.tarball }}.sha256
            ${{ steps.ver.outputs.tarball }}.asc
            distribution-anchor.env
          retention-days: 90
          if-no-files-found: warn

      - name: Publish Forgejo release + attach assets
        # Auto-create the release for this tag and attach the artifacts, so the
        # operator downloads + uploads NOTHING (this replaces the old manual
        # "download the zip, make a release, upload files" dance). Uses the
        # Forgejo API with the runner's automatic Actions token. If that token
        # lacks release-write permission the step FAILS LOUDLY with remediation
        # — and the artifacts are still retained by the upload-artifact step
        # above as a manual fallback, so a first-run permission miss loses
        # nothing. Broadcasting to the chain is deliberately NOT here: a
        # spending key must never live in CI. That stays a laptop step in the
        # ELI5 ceremony.
        #
        # Tag value flows via env (not ${{ }} interpolation into the shell),
        # matching AUDIT-CI-7; the tag is already format-validated in `ver`.
        env:
          TAG: ${{ steps.ver.outputs.tag }}
          TARBALL: ${{ steps.ver.outputs.tarball }}
          OFFLINE: ${{ steps.ver.outputs.offline }}
          # Prefer an operator-supplied token (only needed if the default
          # Forgejo Actions token can't write releases); otherwise fall back
          # to the automatic token. Forgejo's `permissions:` key is ignored,
          # so token scope is set by the instance / this optional secret.
          RELEASE_TOKEN: ${{ secrets.MORPHIT_RELEASE_TOKEN }}
          AUTO_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -eu
          # Re-verify what is about to be published:
          # steps that ran after signing (a third-party action among them) could
          # have rewritten the tarball, .sha256 and anchor consistently. The
          # signing key left the runner when the sign step finished, so a
          # rewritten tarball cannot carry a valid .asc. The signature must be
          # there, and good, from a PINNED key (MORPHIT_RELEASE_SIGNERS); the
          # key material is read from the signed tag's own tree.
          # Both the slim tarball and the offline bundle: each must match its
          # anchored SHA-256 and carry a good signature from a pinned key.
          VERIFY_HOME="$(mktemp -d)"
          chmod 700 "$VERIFY_HOME"
          for key in $(git ls-tree --name-only "$TAG" .forgejo/release-signers/ | grep '\.asc$'); do
            git show "$TAG:$key" | gpg --homedir "$VERIFY_HOME" --batch --import 2>/dev/null || true
          done
          for pair in "$TARBALL:MORPHIT_BUILD_SOURCE_SHA256" "${OFFLINE:-}:MORPHIT_BUILD_OFFLINE_SHA256"; do
            F="${pair%%:*}"
            KEY="${pair#*:}"
            if [ -z "$F" ] || [ ! -f "$F" ] || [ ! -f "$F.sha256" ]; then
              echo "ERROR: '$F' (+ .sha256) is missing; the release publishes the tarball and the offline bundle." >&2
              exit 1
            fi
            sha256sum -c "$F.sha256"
            ANCHOR_SHA=$(sed -n "s/^export ${KEY}=//p" distribution-anchor.env | head -n1)
            if [ "$ANCHOR_SHA" != "$(awk '{print $1}' "$F.sha256")" ]; then
              echo "ERROR: distribution-anchor.env does not anchor $F." >&2
              exit 1
            fi
            if [ ! -f "$F.asc" ]; then
              echo "ERROR: $F.asc is missing; nothing is published unsigned." >&2
              exit 1
            fi
            VSTATUS="$(gpg --homedir "$VERIFY_HOME" --batch --status-fd 1 --verify "$F.asc" "$F" 2>/dev/null || true)"
            GOOD=""
            for f in $(printf '%s\n' "$VSTATUS" | awk '$1=="[GNUPG:]" && $2=="VALIDSIG" {print $3; print $NF}'); do
              for p in $MORPHIT_RELEASE_SIGNERS; do
                [ "$(printf '%s' "$f" | tr a-f A-F)" = "$(printf '%s' "$p" | tr a-f A-F)" ] && GOOD="$p"
              done
            done
            if [ -z "$GOOD" ]; then
              echo "ERROR: $F.asc is not a good signature from a pinned release key; not publishing." >&2
              exit 1
            fi
            echo "re-verified $F.asc: good signature from pinned key $GOOD"
          done
          rm -rf "$VERIFY_HOME"
          TOKEN="${RELEASE_TOKEN:-$AUTO_TOKEN}"
          if [ -z "${TOKEN:-}" ]; then
            echo "ERROR: no token available. Add a token with repository (write) scope as an Actions secret named MORPHIT_RELEASE_TOKEN." >&2
            exit 1
          fi
          API="${GITHUB_API_URL:-${GITHUB_SERVER_URL}/api/v1}"
          REPO="${GITHUB_REPOSITORY}"
          AUTH="Authorization: token ${TOKEN}"
          # 1. Build the release JSON. The body is the matching RELEASE-NOTES
          # file, JSON-encoded by node so any quotes / newlines / backticks in
          # the notes can't break the payload. Missing file => empty body (never
          # fails the release). The PATCH variant omits tag_name so a re-run can
          # NEVER re-point or re-create the signed tag.
          NOTES_FILE="RELEASE-NOTES-${TAG}.md"
          NOTES_FILE="$NOTES_FILE" node -e '
            const fs = require("fs");
            const tag = process.env.TAG;
            let body = "";
            try { body = fs.readFileSync(process.env.NOTES_FILE, "utf8"); } catch (e) {}
            const name = "Morphit " + tag;
            fs.writeFileSync("/tmp/rel-create.json", JSON.stringify({ tag_name: tag, name, body, draft: false, prerelease: false }));
            fs.writeFileSync("/tmp/rel-patch.json", JSON.stringify({ name, body, draft: false, prerelease: false }));
          '
          if [ -s "$NOTES_FILE" ]; then echo "release body := ${NOTES_FILE}"; else echo "no ${NOTES_FILE}; publishing with an empty body"; fi
          # 2. Create the release for this tag (or reuse it on a re-run).
          REUSED=0
          CODE=$(curl -sS -o /tmp/rel.json -w '%{http_code}' -X POST \
            -H "$AUTH" -H 'Content-Type: application/json' \
            --data-binary @/tmp/rel-create.json "${API}/repos/${REPO}/releases" || true)
          if [ "$CODE" = "201" ]; then
            echo "Created release ${TAG}."
          elif [ "$CODE" = "409" ]; then
            echo "Release ${TAG} already exists; will attach assets + refresh the notes."
            REUSED=1
            curl -sS -H "$AUTH" -o /tmp/rel.json "${API}/repos/${REPO}/releases/tags/${TAG}"
          else
            echo "ERROR: creating the release failed (HTTP ${CODE})." >&2
            if [ "$CODE" = "403" ]; then
              echo "  The token lacks release-write permission." >&2
              echo "  Fix (4 clicks): your avatar -> Settings -> Applications -> Generate New Token (repository: write)," >&2
              echo "  then repo -> Settings -> Actions -> Secrets -> add it as MORPHIT_RELEASE_TOKEN. It is picked up automatically." >&2
            fi
            cat /tmp/rel.json >&2 || true
            exit 1
          fi
          REL_ID=$(node -e 'const o=JSON.parse(require("fs").readFileSync("/tmp/rel.json","utf8"));if(!o.id){console.error("no release id in API response");process.exit(1)}process.stdout.write(String(o.id))')
          echo "Release id: ${REL_ID}"
          # 2b. A release for this tag already exists: a re-run of this job, or a
          # tag moved back to another (older) signed object after it was
          # published. Only the tag object that release was built from may add
          # to it: its distribution-anchor.env (attached first) names it.
          if [ "$REUSED" = "1" ]; then
            OUR_OBJ=$(sed -n 's/^export MORPHIT_BUILD_TAG_OBJECT=//p' distribution-anchor.env | head -n1)
            REL_ASSETS=$(node -e '
              const o = JSON.parse(require("fs").readFileSync("/tmp/rel.json", "utf8"));
              const all = o.assets || [];
              const a = all.find((x) => x.name === "distribution-anchor.env");
              process.stdout.write(`${all.length} ${a ? a.browser_download_url : "-"}`);
            ')
            N_ASSETS="${REL_ASSETS%% *}"
            ANCHOR_URL="${REL_ASSETS#* }"
            if [ "$ANCHOR_URL" != "-" ]; then
              THEIR_OBJ=$(curl -sSfL -H "$AUTH" "$ANCHOR_URL" | sed -n 's/^export MORPHIT_BUILD_TAG_OBJECT=//p' | head -n1 || true)
              if [ -z "$OUR_OBJ" ] || [ "$THEIR_OBJ" != "$OUR_OBJ" ]; then
                echo "ERROR: release ${TAG} was already published from tag object '${THEIR_OBJ:-unknown}', and this run built '${OUR_OBJ}': the tag was moved after it was published. Nothing was attached." >&2
                exit 1
              fi
              echo "release ${TAG} exists and was built from this same tag object (a re-run)."
            elif [ "$N_ASSETS" != "0" ]; then
              echo "ERROR: release ${TAG} already has ${N_ASSETS} asset(s) but no distribution-anchor.env naming the tag object they were built from; nothing was attached." >&2
              exit 1
            fi
          fi
          # 3. On a re-run the release already existed, so the create call above
          # did not set the notes. PATCH the body now (tag_name omitted, so the
          # signed tag is never touched).
          if [ "$REUSED" = "1" ]; then
            curl -sS -o /dev/null -X PATCH \
              -H "$AUTH" -H 'Content-Type: application/json' \
              --data-binary @/tmp/rel-patch.json "${API}/repos/${REPO}/releases/${REL_ID}" || true
            echo "refreshed release body from ${NOTES_FILE}"
          fi
          # 4. Attach every asset (each was checked above). The anchor goes
          # first (it names the tag object, see 2b); the large offline bundle
          # last, after its signature.
          for f in distribution-anchor.env "$TARBALL" "$TARBALL.sha256" "$TARBALL.asc" \
                   "$OFFLINE.sha256" "$OFFLINE.asc" "$OFFLINE"; do
            NAME=$(basename "$f")
            CODE=$(curl -sS -o /tmp/asset.json -w '%{http_code}' -X POST \
              -H "$AUTH" -F "attachment=@${f}" \
              "${API}/repos/${REPO}/releases/${REL_ID}/assets?name=${NAME}" || true)
            if [ "$CODE" = "201" ]; then
              echo "attached ${NAME}"
            else
              echo "ERROR: attaching ${NAME} failed (HTTP ${CODE})." >&2
              cat /tmp/asset.json >&2 || true
              exit 1
            fi
          done
          echo "✓ release ${TAG} published with all assets attached."

      - name: Mirror the release to codeberg.org + gitea.com (best-effort)
        # codeberg.org (Forgejo) + gitea.com (Gitea) speak our OWN /api/v1 release
        # API, so publishing the SAME release + assets there lets `morphit-ops
        # upgrade` auto-rotate to them when git.agorise.net is down — the upgrader
        # ships them as built-in mirrors (parseReleaseSources), no operator config.
        # Our other 9 download-page mirrors are git PUSH-mirrors on different APIs
        # (GitHub/GitLab/…) and stay out of this — they carry the signed tag + source,
        # not a release object.
        #
        # BEST-EFFORT BY DESIGN: a missing token or a mirror outage only ::warning::s
        # and moves on — the primary (published above) is the SHA-256 anchor, so a
        # release NEVER fails because of a mirror. Enable each mirror by adding a
        # repository-write PAT as an Actions secret (CODEBERG_TOKEN for codeberg.org /
        # GITEACOM_TOKEN for gitea.com — note: Forgejo reserves the GITEA_ prefix, so the
        # gitea.com secret must be named GITEACOM_TOKEN); until then the step just skips that mirror.
        #
        # Tag flows via env (AUDIT-CI-7), already format-validated in `ver`.
        env:
          TAG: ${{ steps.ver.outputs.tag }}
          TARBALL: ${{ steps.ver.outputs.tarball }}
          OFFLINE: ${{ steps.ver.outputs.offline }}
          CODEBERG_TOKEN: ${{ secrets.CODEBERG_TOKEN }}
          GITEA_COM_TOKEN: ${{ secrets.GITEACOM_TOKEN }} # gitea.com token — secret is GITEACOM_TOKEN (Forgejo RESERVES the GITEA_ prefix, so GITEA_COM_TOKEN cannot be created)
        run: |
          set -u
          # Reuse the SAME release JSON shape as the primary step (node-encoded body,
          # so quotes/newlines in the notes can't break the payload; missing notes =>
          # empty body). tag_name is set on create; a re-run reuses the release and
          # never re-points the signed tag.
          NOTES_FILE="RELEASE-NOTES-${TAG}.md"
          NOTES_FILE="$NOTES_FILE" node -e '
            const fs = require("fs");
            const tag = process.env.TAG;
            let body = "";
            try { body = fs.readFileSync(process.env.NOTES_FILE, "utf8"); } catch (e) {}
            fs.writeFileSync("/tmp/mrel-create.json", JSON.stringify({ tag_name: tag, name: "Morphit " + tag, body, draft: false, prerelease: false }));
          '
          publish_to() {
            HOST="$1"; REPO="$2"; TOKEN="$3"
            if [ -z "${TOKEN:-}" ]; then
              echo "::warning::${HOST}: no token set — skipping release mirror (add its Actions secret to enable)."
              return 0
            fi
            API="https://${HOST}/api/v1"
            AUTH="Authorization: token ${TOKEN}"
            # A push-mirror replicates the signed tag asynchronously (usually seconds).
            # Wait for it before creating the release — a release needs its tag to exist,
            # and we must NEVER create the tag here (that would diverge from the mirror).
            TC=000
            i=0
            while [ "$i" -lt 12 ]; do
              TC=$(curl -sS -o /dev/null -w '%{http_code}' -H "$AUTH" "${API}/repos/${REPO}/tags/${TAG}" || echo 000)
              [ "$TC" = "200" ] && break
              i=$((i + 1)); sleep 10
            done
            if [ "$TC" != "200" ]; then
              echo "::warning::${HOST}: tag ${TAG} not mirrored yet (HTTP ${TC} after ~2m) — skipping this mirror this run."
              return 0
            fi
            # Create (or reuse) the release for this tag.
            CODE=$(curl -sS -o /tmp/mrel.json -w '%{http_code}' -X POST \
              -H "$AUTH" -H 'Content-Type: application/json' \
              --data-binary @/tmp/mrel-create.json "${API}/repos/${REPO}/releases" || echo 000)
            if [ "$CODE" = "201" ]; then
              echo "${HOST}: created release ${TAG}."
            elif [ "$CODE" = "409" ]; then
              echo "${HOST}: release ${TAG} already exists; will attach assets."
              curl -sS -H "$AUTH" -o /tmp/mrel.json "${API}/repos/${REPO}/releases/tags/${TAG}" || true
              # Same rule as the primary: only the tag object it was built from adds to it.
              OUR_OBJ=$(sed -n 's/^export MORPHIT_BUILD_TAG_OBJECT=//p' distribution-anchor.env | head -n1)
              M_ASSETS=$(node -e 'try{const o=JSON.parse(require("fs").readFileSync("/tmp/mrel.json","utf8"));const all=o.assets||[];const a=all.find((x)=>x.name==="distribution-anchor.env");process.stdout.write(`${all.length} ${a?a.browser_download_url:"-"}`)}catch(e){process.stdout.write("0 -")}')
              if [ "${M_ASSETS#* }" != "-" ]; then
                THEIR_OBJ=$(curl -sSfL -H "$AUTH" "${M_ASSETS#* }" | sed -n 's/^export MORPHIT_BUILD_TAG_OBJECT=//p' | head -n1 || true)
                if [ -z "$OUR_OBJ" ] || [ "$THEIR_OBJ" != "$OUR_OBJ" ]; then
                  echo "::warning::${HOST}: release ${TAG} was published from tag object '${THEIR_OBJ:-unknown}', not this run's '${OUR_OBJ}' (the tag was moved); nothing attached there."
                  return 0
                fi
              elif [ "${M_ASSETS%% *}" != "0" ]; then
                echo "::warning::${HOST}: release ${TAG} has assets but no anchor naming its tag object; nothing attached there."
                return 0
              fi
            else
              echo "::warning::${HOST}: could not create the release (HTTP ${CODE}) — skipping this mirror."
              cat /tmp/mrel.json || true
              return 0
            fi
            REL_ID=$(node -e 'try{const o=JSON.parse(require("fs").readFileSync("/tmp/mrel.json","utf8"));process.stdout.write(String(o.id||""))}catch(e){}')
            if [ -z "${REL_ID:-}" ]; then
              echo "::warning::${HOST}: no release id in API response — skipping asset upload."
              return 0
            fi
            # Attach each asset that exists (same set the primary attaches).
            for f in distribution-anchor.env "$TARBALL" "$TARBALL.sha256" "$TARBALL.asc" \
                     "$OFFLINE.sha256" "$OFFLINE.asc" "$OFFLINE"; do
              [ -f "$f" ] || continue
              NAME=$(basename "$f")
              CODE=$(curl -sS -o /tmp/masset.json -w '%{http_code}' -X POST \
                -H "$AUTH" -F "attachment=@${f}" \
                "${API}/repos/${REPO}/releases/${REL_ID}/assets?name=${NAME}" || echo 000)
              if [ "$CODE" = "201" ]; then
                echo "${HOST}: attached ${NAME}"
              else
                echo "::warning::${HOST}: attaching ${NAME} failed (HTTP ${CODE})."
              fi
            done
            echo "${HOST}: release mirror done."
          }
          publish_to "codeberg.org" "agorise/morphit" "${CODEBERG_TOKEN:-}"
          publish_to "gitea.com" "agorise/morphit" "${GITEA_COM_TOKEN:-}"
          echo "✓ mirror-publish step complete (mirrors are best-effort; primary is the anchor)."
